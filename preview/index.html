 around a shared centre point `(cx, cy) = (64, 55)`, which sits near the top of the play area. A point on any arc at angle `a` (in pico-8 turns, `a=0` straight down from the centre) is `x = cx - r*sin(a)`, `y = cy + r*cos(a)` (see `lib/math.lua`'s `arc_xy()`; the sin term is negated to correct for pico-8's inverted `sin()`, and the cos term is *added*, not subtracted, so the shape opens upward \u2014 a valley, not a dome). Because `cy` is near the top of the screen, a *smaller* `r` keeps a point closer to the centre and therefore higher up the screen (smaller `y`); a *larger* `r` sits further from the centre and therefore lower, nearer the bottom. The ship's own arc uses the largest radius in the system, 64px, the widest a full 180\u00b0 half-circle can use without exceeding the 128px screen (for a semicircle, on-screen width is always 2x its apex-to-endpoint height, so capping height at 64px caps width at exactly 128px) \u2014 and, at that radius, the arc's untrimmed endpoints land exactly at `x=0` and `x=128`, satisfying the requirement that the arc run edge to edge like a U. Enemy arcs sit *above* the ship (between it and the centre) and therefore need radii *smaller* than 64, so they sit closer to `(cx,cy)` and higher up the screen.\n\nAn earlier draft of this design had the centre *below* the play area, which produces the opposite shape: a dome, with the ship's centred position at the top of its sweep and enemies further still above it via *larger* radii. That was backwards. Ships come from the top of the screen, so the player's arc needs to open upward toward them (a valley, low in the middle, rising to the edges), not curve over them (a dome). Every formula below reflects the corrected orientation.\n\n**Ship movement & trim** \u2014 The ship's state is an angle `sang`, measured from straight down (0) at `(cx,cy) = (64,55)`, so `sang=0` is the ship's centred, resting position (the valley floor, `y=119`) and increasing `|sang|` sweeps it up toward the screen edges. Screen position is the sprite's centre, `x,y = arc_xy(64,55,64,sang)`, drawn via `spr()` offset by `(-4,-4)`. To keep the ship's 8x8 sprite fully on-screen at full deflection, its centre must stay within `x \u2208 [4, 124]`; this constraint only touches the x-formula (unchanged by the geometry fix above), so the trim derivation itself carries over exactly: solving `64 - 64*sin(sang) <= 124`-equivalent gives `sang <= 69.64\u00b0`, rounded down to `sang` clamped to `[-69\u00b0, 69\u00b0]` (a 21\u00b0 trim off the true \u00b190\u00b0 endpoints). At full trim, `y = 55 + 64*cos(69\u00b0) \u2248 78`. Left/right input adjusts `sang` at `sturn = 2\u00b0/frame` (a default, tune once playable), clamped within that range; the full \u00b169\u00b0 sweep takes about 69 frames (2.3s at 30fps) end to end. Horizontal displacement per unit of `sang` is proportional to `cos(sang)`, largest at the resting centre and shrinking toward the endpoints, so the ship's on-screen horizontal speed for a constant angular input decelerates approaching either end of the sweep. This is a consequence of the geometry, not a separate tuning curve, and is worth confirming feels right once playable.\n\n**Radial shots (player)** \u2014 Hold-to-fire: while the fire button is held, a shot spawns every 4 frames at the ship's current screen position, direction the *inward* unit vector at `sang` at the moment of firing (`arc_xy(0,0,-1,sang)`, i.e. toward the centre `(64,55)` and therefore up, since the ship sits at the largest radius in the system and the enemies it's shooting at sit at smaller radii, closer to centre), travelling at 4px/frame until off-screen or it hits an enemy. Because `sang` can change between shots, consecutive shots fired while sweeping the ship travel in different, non-parallel directions.\n\n**Enemy arcs** \u2014 Three arcs, all above the ship's arc (radii smaller than 64, per Arc geometry above, so they sit closer to the centre and higher up the screen). Each tier's angular band is a stylistic choice, not a hard constraint: at these radii the arc's full \u00b190\u00b0 would already stay within `x \u2208 [4, 124]` (max horizontal deviation from centre is the radius itself, and the largest of the three, 53px, is well under the 60px margin), so narrower bands are chosen for a formation look rather than to avoid clipping:\n\n| Arc | Radius | y at `ea=0` (centred) | y at band edge (topmost) | Angular band | Starting enemy count |\n| --- | ------ | ---------------------- | -------------------------- | ------------- | --------------------- |\n| Inner (closest to ship) | 40px | 95 | 81 | \u00b150\u00b0 | 7 |\n| Middle | 30px | 85 | 78 | \u00b140\u00b0 | 6 |\n| Outer (topmost) | 20px | 75 | 72 | \u00b130\u00b0 | 5 |\n\nRadii shrunk from an original 53/43/33 (kept from README/DESIGN's initial lock) after a play-test note said the settled formation sat \"too low\" and asked for it to sit closer to the shared centre dot; the 10px gap between tiers and the angular bands are unchanged, so the formation's shape holds, just shifted roughly 13px closer to `(64,55)`. The enemy size formula (`ds`, in Enemy entrance below) was retuned to match.\n\n18 enemies total on wave 1. Enemies sweep back and forth within their arc's band.\n\n**Enemy entrance** \u2014 Enemies don't spawn already on their tier's band. Entry runs in two timed phases, driven by a single global frame counter `ET` since wave start (`ND1`/`ND2` frame durations, both defaults, tune once playable), followed by an untimed third phase that reuses existing formation math:\n\n1. **Split and circle at one of two entry points** (`ET < ND1`, ~`ND1/30` seconds) \u2014 two fixed points, `(LX,D1Y)=(32,12)` and `(RX,D1Y)=(96,12)`, sit near the top of the screen flanking the shared centre `(64,55)`, well above it. Each enemy is assigned to one or the other at spawn, alternating by spawn order (`idx%2`) so the wave splits exactly in half; it orbits only its assigned point at a small fixed radius (`D1R=10px`), sharing one angular speed (`CSPD=0.01` turns/frame, roughly 3.6 full revolutions over a 360-frame phase) with every other enemy on the same point but starting at a different phase offset so they don't stack. Alternating a globally-evenly-spaced phase-offset sequence by parity keeps each side's own sub-sequence evenly spaced too (every other value of an evenly-spaced sequence is itself evenly spaced), so no extra bookkeeping is needed to keep either ring from clumping. This replaces an earlier single-entry-point version (both an original single-point design and a first, single-point Phase 7 build) that read as one undifferentiated ring circling one spot; a play-test note asked for the wave to visibly fork into two streams at the top of the screen before continuing down, matching classic two-column enemy entrances, rather than reading as one clump. Both entry points are drawn as the Saucer alien (see Sprite rendering's Enemy roster note; \"planets\" \u2014 see Scoring below for the bonus tied to them) and are shootable throughout the wave, not just during this phase.\n2. **Spiral to the shared centre** (`ND1 <= ET < ND1+ND2`, ~`ND2/30` seconds) \u2014 each enemy's position blends from where its own entry point's orbit formula would put it toward the shared centre `(64,55)`, by linear interpolation on the progress fraction through this phase. Because the orbit formula keeps running throughout (not frozen at phase-1's exit position), the blend reads as a decaying spiral that shrinks to nothing exactly as the enemy arrives at the shared centre, rather than a straight glide. Both streams (left-entry and right-entry) converge on the same shared centre here, so \"then continue down\" happens naturally: this phase and phase 3 below are unchanged by the phase-1 split.\n3. **Grow into formation** (`ET >= ND1+ND2`) \u2014 unchanged from the original entrance note below: `r=0` at the shared centre, grows to the tier's target radius at `RGR` px/frame while sweeping its angle, same as formation sweep once settled.\n\nTotal entrance time is `(ND1+ND2)/30` seconds plus up to `ER[1]/RGR/30` seconds for the slowest (inner-tier) enemy to finish growing into formation; at the current defaults (`ND1=ND2=360`, `RGR=1`) that's about 24s plus up to 1.8s, roughly 25.8s total (doubled from an initial 10-20s target after a play-test pass asked for a longer, more visibly circling entrance). Once fully arrived (formation sweep, `ET>=ND1+ND2` and `r` at its tier target), `ea` sweeps at half its original speed (`ESPD=0.0007` turns/frame, down from `0.0014`) \u2014 a play-test note asked for slower movement specifically \"once in the radial area,\" and since `ea` only affects visible position in this final phase (phases 1-2 derive position from the orbit/spiral formulas instead), halving it only slows the settled formation sweep, not the entrance itself.\n\n**Early-attack divers** \u2014 A small number of enemies break off from phase 1's entry-point orbit to dive at the ship before the wave migrates into phase 2, rather than every wave's entrance being pure formation-flying with no threat until enemies settle. The diver count ramps from 1 on wave 1 by 1 per wave, capped at 5 (`min(5, w)`), and is chosen at random from that wave's full roster in `spawn_wave()`; each chosen enemy is given a fixed trigger frame staggered across roughly the first half of phase 1 (`20 + 40*(i-1)` frames into the wave, for the `i`-th diver), so on a 5-diver wave the last trigger lands at frame 180 of `ND1=360`, still comfortably before phase 2 begins. At its trigger frame, a diver leaves its orbit and dives in a straight line toward the ship's current position, reusing the same dive mechanic and speed formula as a formation-phase dive (see the Dive bullet below) rather than a separate system. The one difference is on resolution: a formation dive snaps the enemy directly to its band edge, since it already has a settled tier position to return to; an entrance diver has none yet, so on hit or miss it simply clears its dive flag and falls back into the ordinary per-frame entrance calculation for whatever phase the shared `ET` counter is in by then (still phase 1's orbit, or already phase 2's spiral, or rarely formation itself) \u2014 a deliberate \"just resume the shared timeline\" choice over building a return-to-entry-point animation. An entrance diver renders as the Stinger sprite and is fully shootable, identical to any other diving enemy, for free from the existing dive-state draw/collision code; it also doesn't fire while diving, again matching formation-dive behaviour. Requested directly (\"a ramping-up variation that starts slow... ship(s) diving down from the group before they migrate, to start the attack\").\n\nBoth fixed points are drawn: the entry point as the Saucer sprite, the shared centre as a small dot with a few faint spoke lines extending out to the screen edge (drawn via `arc_xy` with a radius far larger than any on-screen distance, 200px, so Pico-8's own line-clipping does the work of stopping exactly at the edge regardless of angle; originally stopped at the ship's own arc radius, 64px, which read as too short) \u2014 still giving the shared centre a deliberate vanishing-point read. Phase 3 (below) implements a diving enemy's miss-respawn as a direct snap to its band edge (`ea=\u00b1B`, `r` already at its tier target), not routed back through these three entrance phases; sending a respawning enemy through the full entrance again is a possible later polish pass, not required by the current spec.\n\nEnemies also scale in size with their current distance from the shared centre `(64,55)`, computed fresh each frame regardless of which entrance phase they're in (`ds = mid(1, (50-dist)/10, 3) * 3`, an `sspr` destination width/height in px; the source sprite varies by which of the five aliens the enemy is currently showing, see Sprite rendering's Enemy roster note, but the size formula itself doesn't care which): far away (near either entry point, `dist\u224843.6px`) they read small (floored at 3px), and they grow visibly larger through phase 2 as `dist` shrinks toward 0, capping at 9px. In formation this same distance-based size is what makes the outer tier (closest to centre at `r=20`, `ds=9px`, max) read largest and the inner tier (farthest at `r=40`, `ds=3px`, min) read smallest \u2014 a single continuous formula produces the \"worth more\" sizing cue for every tier and through every entrance phase, rather than a fixed per-tier lookup applied only once settled; an earlier Phase 7 pass had reintroduced fixed native-vs-`sspr`-scaled sizing per tier (dropping the continuous version when real sprites replaced `circfill`), but a play-test note asked for the \"start smaller, then get larger\" entrance read back, so the continuous formula now drives the sprite's `sspr` destination size directly instead of being tier-gated. The formula's constants (`50`, `10`) are tuned to the current tier radii (40/30/20, see Enemy arcs above); when those radii shrank after a later play-test note, the leading `50` shrank with them (from an original `60`, keeping the same `10` divisor and `[1,3]` clamp range) so the size range and per-tier hierarchy still land correctly. The 3px collision hitbox used for shot/enemy collision is unaffected by this draw-only size.\n\n**Background grid** \u2014 A static, non-animated spatial cue, not tied to `ET`: 7 line pairs straddle the shared centre's y (`55\u00b1d` for `d` starting at 4px and multiplying by 1.6 each step, `d\u22484,6.4,10.2,16.4,26.2,41.9,67.1`), so lines are dense right around the shared centre and spread out approaching either screen edge, converging toward both the entry points above (near `y=12`) and the ship's own arc below (down to `y\u2248122`) \u2014 the same \"closer together near the point of interest\" read as the radial spoke lines, just spatial rather than temporal, and together the two line systems form a single-point-perspective \"tunnel\" converging on the shared centre. Drawn in the same fixed dark blue (1) as the radial spoke lines so the two read as one visual family rather than two competing colours; unlike the enemy/shot colour, this grid does **not** rotate with the wave theme (see Palette note below). An earlier version tied the line spacing to `ET`, animating it wide-to-tight over the entrance duration, but that read as unmotivated movement rather than a distance cue once played; this version fixes the lines' positions in place from frame 1. A later Phase 7 pass replaced this entirely with a flat 8-fixed-row scanline grid (bright near the HUD, fading to black at a fixed horizon `y=30`, colours rotating with the wave theme) as a more literal read of \"receding perspective,\" but a play-test note asked for the original converging grid back specifically (\"we lost the gridlines into the distance, they looked good\"), so this version is the current and final one; the flat-row version and its wave-rotating grid-hi/grid-mid colours are retired, not merely superseded-pending-reconciliation as an earlier note here suggested.\n\nThe lines below the centre (`CY+d`, toward the ship's own arc) stay solid. The lines above it (`CY-d`, toward the entry points and open sky) fade as they climb, starting immediately at the first line pair past the centre rather than only at the outer few: Pico-8's flat 16-colour palette has no intermediate tone between dark blue (1) and black (0) to produce a true colour gradient, so each upper line is drawn as a repeating dash/dot pattern instead of one solid line, the classic flat-palette way to fake a density gradient with only two tones. Three patterns escalate from denser to sparser as `d` grows, assigned by line index (`i` of `GN=7`, 1 nearest the centre, 7 nearest the top): dash-dash-dot (run lengths `{3,2,3,2,1,2}` px, alternating lit/unlit starting lit, ~54% lit) for `i` 1-3, dash-dot (`{3,2,1,2}`, 50% lit) for `i` 4-5, dot-dot (`{1,2,1,2}`, 33% lit) for `i` 6-7 \u2014 a genuine decreasing-density progression, not just three arbitrary patterns. This is a density fade layered on the existing fixed-colour rule above, not an exception to it: the lines are still always dark blue (1), never wave-tinted, only how much of each line is drawn changes.\n\nEach enemy independently, on a wave-scaled interval, either fires or breaks formation to dive:\n\n- **Fire** \u2014 a shot spawns at the enemy's current screen position, direction the *outward* unit vector at the enemy's current angle `ea`: `arc_xy(0,0,1,ea)`, i.e. away from the centre `(64,55)` and therefore down, toward the ship. This is the same direction convention as the player's own shots use (both are \"away from centre\" or \"toward centre\" depending on which side of the ship they're on) but the opposite sign, since the player sits at the largest radius (64, shooting inward toward smaller-radius enemies) while enemies sit at smaller radii (shooting outward toward the larger-radius ship). The shot travels at `ESSPD=3px/frame` (a default, tune once playable; not given an explicit value elsewhere in this doc, chosen slightly under the player's own 4px/frame so enemy fire stays dodgeable) until it hits the ship or goes off-screen past the bottom. A firing enemy only becomes eligible once its entrance is complete (`r` has reached its tier's target radius, see Enemy entrance above), so newly-arriving enemies don't fire mid-spiral.\n- **Dive** \u2014 the enemy leaves its arc position and moves in a straight line toward the ship's last-known position at `dive_spd * min(2, 1 + 0.15*ei.dv)` px/frame, where `ei.dv` is that enemy's own miss counter (see below). If it hits the ship, resolve as a player hit. If it goes off-screen without hitting the ship, it does **not** leave the wave: it re-enters at the *top* of its arc, which is the outer edge of its angular band (`ea = \u00b1B` for that tier, whichever the enemy was nearer when it started diving), not `ea=0` \u2014 `ea=0` is each tier's centred position, but because the arc opens upward, the band edges are actually the highest (smallest-`y`) points an enemy in that tier can reach, not `ea=0`. It resumes formation-sweep behaviour from there, `ei.dv` incremented by 1. Each miss also tightens that specific enemy's own fire cooldown: `max(20, wave_fire_cooldown - 10*ei.dv)`, floored at the same global 20-frame minimum as the wave-level ramp. The multiplier and cooldown reduction are both capped (`ei.dv` effectively saturates past ~7 misses) so one persistently-dodged enemy can't spiral indefinitely. Because a diving enemy is never actually removed except by being killed, a wave can only clear through kills, not through the player dodging attrition away \u2014 this was a deliberate fix over an earlier draft where a missed dive silently decremented the wave's live count. A diving enemy occupies a slot in the 32-entity concurrent cap only while it's actively on-screen (formation, mid-dive, or freshly respawned); the brief off-screen instant between miss and respawn doesn't hold one.\n\n**Wave progression & difficulty ramp** \u2014 A wave ends when its enemy count reaches 0. For wave `w` (starting at 1):\n\n- Enemy count: `min(24, 18 + 2*(w-1))`, capped at 24 to leave headroom under the 32-entity concurrent cap (enemies + enemy shots) for enemy fire.\n- Formation sweep speed: `base_espd * (1 + 0.08*(w-1))`, `base_espd = 0.5\u00b0/frame` (a default, tune once playable) \u2014 uncapped, this and aggression below are what keep escalating once the count cap is hit.\n- Dive speed: `base_dvspd * (1 + 0.08*(w-1))`, `base_dvspd = 3px/frame` (a default, tune once playable; the per-enemy miss multiplier above stacks on top of this wave-level value).\n- Dive chance (per enemy, per-second probability of breaking formation): `min(0.5, 0.05 + 0.015*(w-1))`.\n- Enemy fire cooldown: `wave_fire_cooldown = max(20, 90 - 5*(w-1))` frames between an individual enemy's shots (before the per-enemy miss reduction described under Dive above).\n- Wave theme colour rotates per the Palette table above, `(w-1) % 4`.\n\n**Entity cap** \u2014 Total concurrent enemies + enemy shots is capped at 32. In practice only firing needs the check: a diving enemy doesn't create a new entity (it's already counted as one of the 32 while it's mid-dive, per the paragraph above), so only a fire event that would spawn a new enemy shot can push the total over the cap. That fire event is skipped for that frame and retried next opportunity rather than queued (the enemy's cooldown simply isn't reset, so the same check runs again next frame), keeping the check O(1). Player shots aren't counted against this cap; the 4-frame cooldown and 4px/frame travel speed already bound them to roughly 8 in flight at once over the 128px playfield.\n\n**Scoring** \u2014 `50 * arc_tier + (50 if the enemy was diving when destroyed else 0)`, where `arc_tier` is 1 (inner), 2 (middle), or 3 (outer). Rewards both prioritizing harder-to-reach outer-arc enemies and taking the risk of engaging a diving enemy.\n\n**Boss planets** \u2014 The two entry points (see Enemy entrance above) are boss targets, `pl[1]`/`pl[2]` (`{x=LX or RX, hp}`), re-armed every wave in `spawn_wave()` with `hp = 10 + 5*(w-1)` (10 on wave 1, 15 on wave 2, and so on \u2014 the same wave-indexed-by-`(w-1)` convention as every other difficulty formula in this doc). Each can be hit by a player shot at any point during the wave using the same 3px hitbox convention as every other collision check here (`abs(dx)<3 and abs(dy)<3` against `(LX,D1Y)` or `(RX,D1Y)`, gated on `hp>0` so a destroyed planet stops registering hits); a hit decrements that planet's `hp`, awards a flat 200-point bonus, and consumes the shot, every time, hit or kill. Below 0 the \"explode\" hit instead plays the enemy-destroyed chime (reusing `sfx(1)`, not the ordinary hit chime \u2014 this is framed as a kill, not another tap) and spawns a much bigger burst than a normal hit (14 particles at up to 3px/frame for 15-30 frames, versus a normal hit's 5 particles at up to 1.5px/frame for 10-15 frames), both centred on the planet's fixed position rather than the shot's exact impact point. Once destroyed, that planet stops drawing and stops registering hits for the rest of the wave; the *next* wave's `spawn_wave()` resets both planets' `hp` unconditionally, so a destroyed planet always comes back next wave, full-health, regardless of whether it survived the previous one.\n\nA planet's `hp`/alive state has no bearing on the enemy entrance geometry: `spawn_wave()` still orbits enemies around the raw `(LX,D1Y)`/`(RX,D1Y)` coordinates regardless of whether the boss sprite standing there is currently drawn, so destroying a planet mid-wave doesn't change how the *next* wave's enemies enter. **Boss planets play no part in the wave-clear condition**: that check is `#en==0` alone (see Wave progression above), and a planet is never a member of `en`, so hitting or destroying one any number of times neither advances nor delays a wave; it's purely extra score layered on top of the kill-everything win condition, never a second objective \u2014 confirmed explicitly (\"treat them as extra points, but they do not gate the level end\"). Landing a hit at all takes a deliberate, precise shot rather than incidental fire, since each entry point sits at roughly the same angular position from the shared centre as the inner-tier enemy band (`~37\u00b0`, within the ship's \u00b169\u00b0 range but requiring the ship to hold a specific angle). First added as an indestructible, infinitely-repeatable bonus target (\"you should be able to hit the yellow planets, too\"); given a hit-point pool and an explosion in a follow-up request (\"let's turn the planets into bosses... they take 10 hits (increases by 5 per level) to explode, using a particle effect\").\n\n**Wave transition sequence** \u2014 Replaces the original placeholder (a static 36-frame freeze with a centred \"WAVE n\" overlay) with a 5-stage animated sequence, entered the same way (`#en==0`) but no longer just a countdown: a sub-state `ws` (1-5) tracks which stage is active, alongside a per-stage frame counter (the same `frz` variable the old freeze used). Two new fixed points bound the sequence, both distinct from the two entry-point planets: the shared centre `(64,55)` (already established, see Arc geometry) and a third point `(TX,TY)=(64,12)`, directly between the two planets \u2014 the original single entry point from before the entrance split (see Enemy entrance above), kept around specifically for this. All 5 stage lengths below are defaults, tune once playable, chosen to total roughly 3s (up from the original 1.2s freeze) since there's meaningfully more happening now:\n\n1. **Ship \u2192 centre dot** (`WZ1=20` frames, ~0.67s) \u2014 the ship flies in a straight line from wherever it was when the wave cleared to `(64,55)`, *not* along its own arc; this is a direct cut across the playfield, the one place in the game the ship's position isn't governed by `sang`/`arc_xy`. A trail accumulates behind it: one point recorded per frame at the ship's current interpolated position, each stamped with a colour based on overall sequence progress (see the colour ramp below), then rendered as connected line segments (`line()` between consecutive trail points) rather than loose points, so it reads as a continuous growing line rather than a dotted one. The ship sprite itself is drawn in its `sprite 0` (straight) pose throughout the whole zoom \u2014 it isn't \"steering\" anymore, so the rotation logic (Sprite rendering's ship note) doesn't apply here.\n2. **Centre dot \u2192 top point** (`WZ2=15` frames, ~0.5s) \u2014 continues from `(64,55)` to `(TX,TY)=(64,12)`, a second straight-line leg in a different direction than stage 1 (a visible bend at the centre dot, not a single unbroken line, since the two destinations aren't generally colinear with the ship's start position). Trail accumulation and the ship's straight-pose sprite continue exactly as in stage 1.\n3. **White iris expands from the top point** (`WZ3=10` frames, ~0.33s) \u2014 once the ship arrives at `(TX,TY)`, it's no longer drawn separately (it's \"become\" the point); a circle centred on `(TX,TY)` grows from radius 0 to 140px (comfortably past every screen corner from that point) over this stage, painted with `circfill`, giving a wipe-style \"fade to white\" \u2014 Pico-8 has no alpha blending, so a full cross-fade isn't available; an expanding solid fill from the arrival point is the standard substitute and ties the \"fade\" directly to where the ship just went. The frozen backdrop (background grid, spokes, centre dot, completed trail) keeps rendering underneath until the circle covers it.\n4. **\"NEW WAVE n\" holds** (`WZ4=30` frames, ~1s) \u2014 this is the stage boundary where the actual wave-advance state reset happens, at the moment `ws` becomes 4 (`wv+=1`, `en={}`, `eshots={}`, `pt={}`, `ET=0`, `sang=0`, `spawn_wave()` \u2014 which also re-arms both boss planets' `hp`, see Boss planets above \u2014 then `trail={}`), so by the time this stage's own draw code runs, `wv` already holds the new wave's number: the screen is fully white, and text reads `\"new wave \"..wv` centred, coloured in that (now-current) wave's theme colour (`WT[(wv-1)%4+1]`, the same lookup and rotation used everywhere else in this doc \u2014 see Palette), a small preview of what's about to load rather than plain white-on-white text.\n5. **White iris shrinks back** (`WZ5=15` frames, ~0.5s) \u2014 the same circle, now centred on `(TX,TY)` again, shrinks from full coverage back to 0, revealing the ordinary game scene underneath: background grid, ship at its reset rest position (`sang=0`), and the next wave's enemies already spawned at their entry points (static, since the entrance's own `ET`-driven animation only advances once `gs` returns to 1 \u2014 they visibly start moving on the very first frame of normal play rather than mid-reveal, a deliberate simplification rather than duplicating the entrance's update logic inside the transition). Once this stage's counter reaches 0, `gs=1` and play resumes normally.\n\n**Trail colour ramp** \u2014 Across the combined duration of stages 1-2 (`WZ1+WZ2=35` frames), each trail point's colour is chosen from its progress fraction `p` (0 at the ship's start, 1 at the top point): `p<1/3` \u2192 dark blue (1, matching the background grid and spoke lines' fixed colour), `1/3<=p<2/3` \u2192 light grey (6), `p>=2/3` \u2192 white (7) \u2014 \"the line turning into white\" as it travels, three fixed steps rather than a continuous gradient (Pico-8's 16-colour palette doesn't have the intermediate shades for a smoother ramp, and three steps is enough to read as a directional colour shift at this resolution).\n\nImplemented as spec'd above (`zoompos()`, `draw_backdrop()`/`draw_trail()`/`draw_game()` factored out of the old single `_draw()` body so the same playfield renderer serves both ordinary play and stage 5's reveal, per \"Implement this and the end of level transition\").\n\n**Pauses and the building sound** \u2014 A `PZ=12` frame (~0.4s) pause is inserted after stages 1, 2, and 3 complete, before advancing to the next stage; the 4th gap (stage 4 into stage 5) has no pause, since stage 4 is already a 30-frame hold and a second pause immediately after it would be redundant \u2014 requested as \"a delay between each step except the last.\" A separate counter `pz` (0 when not pausing) takes over `_update()`'s `gs==2` branch first: while `pz>0` it just counts down and returns, leaving `ws`/`frz`/the trail exactly as they were at the moment the stage finished, so the paused frame reads as a clean freeze rather than a stutter. Each pause plays one of three ascending SFX slots (7/8/9, `sfx(6+ws)` \u2014 `ws` still holds the *just-completed* stage's number while pausing, so `ws==1` maps to the lowest slot) \u2014 three short rising two-note stabs, each pitched higher than the last, so the sequence of three pauses reads as one building phrase leading into the white flash, rather than three identical beeps.\n\n**Ship glow (first pause only)** \u2014 While paused after stage 1 (`ws==1 and pz>0`, the ship sitting exactly at the shared centre dot), a pulsating yellow circle (`circfill(zx,zy, 3+2*sin(time()*4), 10)`) is drawn *before* the ship sprite, so it reads as a glow behind/around the hull rather than an outline on top of it; radius oscillates continuously via `time()` rather than being tied to the pause's own frame count, so it doesn't visibly reset or jump if `PZ` is retuned later. Only the first of the three pauses gets this treatment \u2014 requested specifically (\"for the first pause, is it possible to add a glow around the back of the ship?\"), read as the ship \"charging\" at the centre dot before continuing on to the top point, rather than a treatment applied uniformly to all three pauses.\n\n**Ship reset** \u2014 `sang` is set to 0 as part of the stage-4 state reset, so the ship is genuinely centred (not just visually parked there) once play resumes; this was a deliberate choice over a purely cosmetic zoom; confirmed directly rather than assumed, since the alternative (visual-only, `sang` unchanged underneath) was a real option that would have left the ship wherever the player had it when the wave cleared.\n\n**Sprite rendering**\n\nShip (sprites 0, 5, 6: straight, and 2 lean levels), rocket-wedge silhouettes, drawn at native 8\u00d78 via `spr()`, offset `(-4,-4)` from its arc position, always white (7). The angle a rotated sprite should represent is not a stylized guess: it's exactly the angle of the line the ship's own shots travel along, `arc_xy(0,0,-1,sang)`, which by construction of `arc_xy` is `sang` itself \u2014 the same angle used for the ship's own arc position. At maximum deflection that angle is exactly `SC` (`0.19167` turns `\u00d7 360\u00b0 = 69.0\u00b0`, the same \u00b169\u00b0 trim derived under Ship movement & trim above from keeping the sprite on-screen), **not** 90\u00b0; an earlier pass used a stylized full 90\u00b0 at the extreme after a play-test note asked for \"completely rotated 90 degrees,\" but a follow-up note clarified the intent was accuracy to the true fire-line angle, not a round number, so sprite 6 now represents 69\u00b0, not 90\u00b0.\n\nSprites 5/6 are generated, not hand-shifted: an initial attempt derived them by shifting rows of sprite 0 rightward, which produced a staircase-like artifact rather than a recognizable rotation (caught in a play-test screenshot); a second attempt used plain nearest-neighbour trig rotation at the target angle, which also produced broken, disconnected pixel art at non-90\u00b0-multiple angles (holes, floating fragments) \u2014 8\u00d78 is too coarse for naive per-pixel rotation sampling. The working method supersamples: upscale sprite 0 8\u00d7, rotate the upscaled grid by nearest-neighbour, then downsample each 8\u00d78 block back to one pixel by majority vote (filled if \u226550% of the block's samples are filled), which anti-aliases away the single-pixel holes that plain nearest-neighbour left behind, at the cost of a slightly blockier silhouette than the small handful of \"clean by construction\" 90\u00b0-multiple rotations:\n\n```\nsprite 0: straight   sprite 5: 35\u00b0         sprite 6: 69\u00b0\n...##...             .....##.              ........\n...##...             ...####.              ########\n..####..              .######.              ########\n..####..              #######.              ########\n.######.              #######.              ..#####.\n.######.              #######.              ..#####.\n##....##             ...###..              ..###...\n##....##             ...###..              .###.....\n```\n\nGiven the ship's current angle `sang`, pick the sprite with 2 thresholds dividing the ship's \u00b169\u00b0 range into thirds (`23\u00b0`, `46\u00b0`): `abs(sang) < 23\u00b0` \u2192 sprite 0, `23\u00b0 <= abs(sang) < 46\u00b0` \u2192 sprite 5 (the 35\u00b0 rotation, roughly this bucket's midpoint), `abs(sang) >= 46\u00b0` \u2192 sprite 6 (the 69\u00b0 rotation, the true maximum). This gives 5 visibly distinct rotation states (straight, slight-left, slight-right, sharp-left, sharp-right) from 3 drawn sprites.\n\nThe nose must always point toward the shared centre `(64,55)`, the same \"inward\" direction the player's own shots already fire along (`arc_xy(0,0,-1,sang)`), not toward the top of the screen: `flip_x = sang > 0`. This follows from the arc's geometry alone, independent of any trig sign convention: `sang>0` puts the ship's screen `x` to the right of the centre's `x=64` (the input mapping already established under Ship movement & trim, \"increasing `a` sweeps rightward\"), so the centre sits to the ship's *left* and the nose (drawn leaning right by default in sprites 5/6) must be mirrored to point left; symmetrically, `sang<0` leaves the nose unflipped, since the centre is then to the ship's right, matching the base art's default rightward lean. An initial pass used `flip_x = sang < 0`, the inverse of this, which pointed the nose *away* from the centre at both ends of the sweep; a play-test note caught it (\"the ship rotates in the wrong direction... the nose should stay pointing to the centre [point], not the top centre [of the screen]\").\n\n**Enemy roster (sprites 1, 7-10)** \u2014 Five distinct alien silhouettes, one per tier plus a dive-only look and the two entry-point \"planets\", replace the single generic wing sprite an earlier draft of this design used for every enemy regardless of type. Each is vertically symmetric like the sprite it replaces, so it reads the same whether formation-sweeping or mid-dive and never needs a flip flag:\n\n```\nsprite 1: Crab       sprite 7: Moth       sprite 8: Wyrm       sprite 9: Stinger    sprite 10: Saucer\nA......A             AA....AA             .A....A.             .A....A.             ..YYYY..\nAA....AA             .AA..AA.             AAA..AAA             .AA..AA.             .YYYYYY.\n.AA..AA.             ..AAAA..             AAAAAAAA             BAA..AAB             YYRRRRYY\n..ABBA..             ..ABBA..             .ABBBBA.             BBAAAABB             YYRRRRYY\n..AWWA..             ..ABBA..             .AB..BA.             ..AAAA..             .Y.RR.Y.\n...AA...             ...AA...             ..A..A..             ...AA...             ...RR...\n..A..A..             ..A..A..             ..AAAA..             ..A..A..             R......R\n.A....A.             AA....AA             .A....A.             .A....A.             .R....R.\n```\n\n| Alien | Slot | Role |\n| ----- | ---- | ---- |\n| Crab | 1 (the old generic enemy slot) | Inner tier (`tr==1`, radius 40) |\n| Moth | 7 | Middle tier (`tr==2`, radius 30) |\n| Wyrm | 8 | Outer tier (`tr==3`, radius 20) |\n| Stinger | 9 | Any tier, while diving (`e.dv==1`); reverts to the tier's own sprite once it respawns back into formation |\n| Saucer | 10 | The two boss-planet sprites at `(32,12)`/`(96,12)` (see Enemy entrance and Boss planets above) \u2014 not a member of `en`, drawn separately, and only while that planet's `hp>0` |\n\n`A` (majority of each shape) and `B` (accent detail) are drawn in the sheet using two fixed source colours, red (8) and teal (12), and remapped at draw time with `pal(8,wtheme.primary) pal(12,wtheme.accent)` immediately before each `sspr()` call, reset with a bare `pal()` right after \u2014 the same one-swap-per-draw pattern the original single sprite used, doubled to two source/target pairs (see Palette above for the four-wave primary/accent table). Crab's `W` is the one exception: a literal, never-swapped white (7) trim matching the ship/HUD's existing fixed-white convention, a deliberate callback rather than an inconsistency. Saucer's `Y`/`R` are also literal (yellow 10, red 8, matching the fixed-yellow dot it replaces) and never swapped; because it's drawn outside the `en` loop entirely, no rotating alien's `pal(8,...)` call is ever active while it renders, so its own literal red pixels can't be caught mid-swap.\n\nAlways drawn via `sspr(sp*8,0,8,8, x-ds/2,y-ds/2, ds,ds)` for whichever slot `sp` the enemy is currently showing (tier-selected, or 9 while diving), `ds` the same continuous distance-from-centre size formula as before (see Core system design's Enemy entrance note); the outer tier (Wyrm) still reads largest and the inner tier (Crab) smallest, as a side effect of that formula rather than a separate tier check. The 3px collision hitbox is unaffected by which alien is currently drawn.\n\nShots (sprites 2-4: straight, shallow, steep), shared between player and enemy shots, recoloured to match the firer (white for the player, that wave's enemy colour for enemies):\n\n```\nsprite 2: straight   sprite 3: shallow      sprite 4: steep\n........              ........               ........\n...##...              ....##..               ......##\n..####..              ...###..               .....##.\n.######.              ..####..               ....##..\n...##...              ...##...               ...##...\n...##...              ...##...               ..##....\n........              ........               ........\n........              ........               ........\n```\n\nGiven a shot's fired angle `\u03b8` (`sang` for player shots, `ea` for enemy shots, both measured from vertical), pick the sprite and flip flags:\n\n- `abs(\u03b8) < 12\u00b0` \u2192 sprite 2 (straight)\n- `12\u00b0 <= abs(\u03b8) < 37\u00b0` \u2192 sprite 3 (shallow)\n- `abs(\u03b8) >= 37\u00b0` \u2192 sprite 4 (steep)\n- `flip_x`: mirrors the sprite so it points along its actual direction of travel, not just its fired angle's sign. Sprites 3/4's un-mirrored art leans right (its narrow \"nose\" sits right of centre \u2014 see the diagrams above), so `flip_x` should be true whenever the shot is actually moving *left*. For player shots (travelling inward, `arc_xy(0,0,-1,sang)`) that's `flip_x = sang > 0` (positive `sang` puts the ship right of the centre column, so its inward shot moves left \u2014 the same geometry already established for the ship's own nose in Ship movement & trim); for enemy shots (travelling outward, `arc_xy(0,0,1,ea)`) it's the opposite sign, `flip_x = ea < 0`, since outward continues in the same left/right sense the enemy is already offset in, rather than reversing it. An initial version used `flip_x = \u03b8 < 0` for both, which happened to be correct for enemy shots (outward travel) but backwards for player shots (inward travel) \u2014 the same class of sign inversion the ship's own rotation had, caught by the same kind of play-test note (\"the bullets rotate in the inverse direction... it would look better rotated in the direction of movement\").\n- `flip_y = ` true for enemy shots (which travel downward, outward from centre), false for player shots (which travel upward, inward toward centre)\n\nThis covers every direction that can actually occur (both ship and enemy angular ranges stay well short of \u00b190\u00b0, so no shot ever needs a near-horizontal sprite) from 3 drawn sprites instead of 8, using Pico-8's native `flip_x`/`flip_y` args for the mirrored cases. Shots are drawn at half their native size (`sspr(sp*8,0,8,8, x-2,y-2, 4,4, flip_x,flip_y)`, a 4\u00d74 destination instead of 8\u00d78) \u2014 a play-test note found the full-size sprites read as too large once real art replaced the original single-pixel placeholders. The 3px collision hitbox is unaffected by this draw-only size, same precedent as the enemy sizing above.\n\n**Explosion effect** \u2014 On enemy death, spawn 4-6 short-lived particles at the enemy's last position: each a flat `{x,y,vx,vy,t}` table, `vx,vy` a small random outward velocity, `t` a countdown (~10-15 frames) decremented each frame and removed at 0. Drawn with `pset` or a 1px `circfill`, coloured to match that wave's enemy colour (no dedicated sprite, no palette entry needed). Same flat-array-by-id pattern as `shots`/`en`, so it costs a `del()`-safe reverse loop, not new architecture.\n\n## Token budget\n\nAngle-based movement (ship, enemies, shots) leans heavily on trig every frame. A shared `arc_xy(cx, cy, r, a)` helper (returning `x, y`) should go in `lib/math.lua` before this game is built, since deriving `cos`/`sin`-based position math separately for the ship, 3 enemy arcs, player shots, and enemy shots would cost tokens fast, and the same helper covers the grid's horizon-band rationale check (enemy apex y-values above) for free. With up to 18 enemies, their shots, and player shots concurrently (capped at 32 hostile entities plus ~8 player shots), keep all per-entity state as flat arrays indexed by id, not named variables. Store the current wave's 4 theme colours as a single table looked up by `(wave-1)%4` rather than branching per-element, the same flat-array-by-id pattern game 3 uses for its colour table; the enemy roster's primary/accent pair is just two columns in that same table, not a second lookup structure. Picking an enemy's sprite slot (tier vs. diving) is one more small branch per enemy per frame, not per-frame per-pixel work, so it shouldn't meaningfully move the token count.\n", "plan": "# Plan\n\nPhased implementation checklist for `4.p8`, based on [README.md](README.md) and [DESIGN.md](DESIGN.md). Nothing is built yet; all phases are pending. Design is locked, no phase below is blocked on an open question.\n\n## Phase 1: Ship arc movement & radial shooting\n\n- [x] Ship position represented as an angle `sang`, clamped to \u00b169\u00b0 (a 21\u00b0 trim off the true \u00b190\u00b0 endpoints, keeping the 8\u00d78 sprite fully on-screen; derivation in DESIGN.md)\n- [x] Left/right input adjusts `sang` at `sturn = 2\u00b0/frame` (default, tune once playable) within that clamp\n- [x] Shared `arc_xy(cx, cy, r, a)` helper added to `lib/math.lua` before wiring ship position; 3 enemy arcs and both shot types reuse the same math, so deriving it once here pays off immediately. Implementing it surfaced a gotcha not visible from the DESIGN.md formula alone: Pico-8's built-in `sin()` is inverted from standard math convention (`sin(x) == -sin(2*pi*x)`, a consequence of its y-down screen coordinates), so the helper negates the sin term to keep \"increasing angle\" sweep rightward, matching the left/right button mapping.\n- [x] Hold-to-fire: spawns a shot every 4 frames while held, travelling 4px/frame along the radius vector through `sang` at the moment of firing\n- [ ] Verify (manual play test, not yet done): ship visibly sweeps along a curve rather than a straight line, clamps cleanly at both ends without the sprite clipping off-screen; a shot fired from each end of the arc travels in a visibly different direction; holding fire produces a steady stream of shots\n\nImplemented in `4.p8` with placeholder visuals only (filled circle for the ship, single pixels for shots); real sprites land in Phase 7.\n\n**Follow-up fix**: the arc's orientation in the original spec was backwards (a dome opening downward, centre below the screen) instead of a valley opening upward toward the screen edges (centre above the screen), per a corrected spec \u2014 see DESIGN.md's Arc geometry note. `CX,CY` moved from `(64,103)` to `(64,25)`, `arc_xy()` in `lib/math.lua` now adds the cos term instead of subtracting it, and the player's shot direction flipped from outward to inward (`arc_xy(0,0,-1,sang)`). The four checked items above are still correct in shape, but `4.p8`'s constants and shot-direction call were updated to match; re-verify after this fix, not just the original implementation.\n\n## Phase 2: Enemy arcs & formation\n\n- [x] Three enemy arcs at radii 53/43/33 (centred position y=108/98/88, band-edge/topmost y\u224889/88/84), angular bands \u00b150\u00b0/\u00b140\u00b0/\u00b130\u00b0\n- [x] Wave 1 starting counts: 7/6/5 (18 total), evenly spaced within each arc's band\n- [x] Enemies sweep back and forth within their arc's band\n- [x] Shot/enemy collision detection (player shot vs enemy)\n- [x] Enemy entrance, phase 3 (grow into formation): each enemy reaches `r=0` at the shared centre and spirals out to its tier's radius while sweeping, rather than appearing pre-placed on its band (added after first play test \u2014 see DESIGN.md's Enemy entrance note)\n- [x] Enemy entrance, phase 1 (circle at entry point): each enemy orbits a second fixed point near the top of the screen `(64,12)` at a small radius, spread by starting angle offset so they don't stack\n- [x] Enemy entrance, phase 2 (spiral to shared centre): each enemy's position blends from its orbit formula toward the shared centre over the phase's duration, reading as a decaying spiral rather than a straight glide\n- [x] Vanishing-point dot and spoke lines drawn at the shared centre, entry-point dot drawn at the second point, pulled forward from Phase 7's visual polish since the enemy entrance depends on both points reading as deliberate spots rather than empty space\n- [x] Placeholder animated background grid (12 horizontal lines, spacing 24px\u21928px) tied to entrance progress, standing in for Phase 7's real background grid until the two are reconciled\n- [x] Enemies scale in size with distance from the shared centre (small far away near the entry point, growing to full size as they spiral in), and formation sweep slows to half speed once fully settled into the radial/formation phase (added after a fourth play test)\n- [x] Radial spoke lines extended to reach the screen edge (previously stopped at the ship's own arc radius, which read as too short)\n- [x] Background grid switched from a time-animated squeeze to a static spacing gradient centred on the shared centre's y-coordinate, so distance is shown spatially rather than by an unmotivated animation\n- [ ] Verify (manual play test, not yet done): enemies visibly enter from a point near the top of the screen, circle for several revolutions, then spiral down \u2014 visibly growing larger as they approach the shared centre \u2014 into three distinct curved bands above the ship that sweep slowly; the background grid is static and denser near the shared centre than at the screen edges; the spoke lines reach the screen edge; a player shot that crosses an enemy's position destroys it at any point in the entrance\n\nImplemented in `4.p8` with placeholder visuals (`circfill` dots for enemies, colour 8, radius scaled by distance from the shared centre rather than fixed; sky-blue dot and dark-blue spoke lines for the shared-centre vanishing point; yellow dot for the entry point; dark-blue lines, matching the spoke-line colour, for the static background grid); real sprites land in Phase 7. Each enemy sweeps independently back and forth within its own tier's band (own `dir` flipping at `ea=\u00b1B`), rather than the whole tier moving as a single rigid block; since all enemies in a tier share the same speed but start at different evenly-spaced offsets, they naturally reach their band edges and reverse at different frames, giving a staggered rather than lockstep sweep. Collision is a flat `abs(dx)<3 and abs(dy)<3` box check between each in-flight shot and each enemy, run as a reverse double loop over `shots`/`en` so deletions mid-loop are safe; it runs unconditionally, so enemies can be shot down during any entrance phase, not just once settled into formation. The hitbox stays a fixed 3px box regardless of the enemy's draw-only size, so it isn't harder to hit up close than far away.\n\n**Follow-up (third pacing/visual pass)**: `ND1`/`ND2` doubled to 360 frames each (12s per phase, ~24s for phases 1+2 combined) and `CSPD` doubled to 0.01, giving roughly 3.6 revolutions around the entry point during phase 1 alone versus under 1 before \u2014 a much more visible circling motion before the spiral-in begins. Enemy dots shrank from a 2px `circfill` to a single-pixel `pset` (collision hitbox unchanged). The animated background grid switched from orange (9) to the same dark blue (1) as the radial spoke lines, so the two line systems read as one visual family instead of two competing colours.\n\n**Follow-up (fourth pass)**: enemies now draw at `mid(1, (60-dist)/10, 3)` radius, `dist` their live distance from the shared centre, recomputed every frame regardless of entrance phase \u2014 this both answers \"make them bigger as they approach\" and, as a side effect, reproduces the eventual Phase 7 \"outer tier reads bigger\" sprite rule for free once settled into formation, since the outer tier sits closest to the shared centre. `ESPD` (formation sweep speed) halved to `0.0007`; because `ea` only drives visible position in the settled/radial phase (phases 1-2 use the orbit/spiral formulas instead), this only slows movement once an enemy has arrived, not the entrance itself. The radial spoke lines' reach grew from the ship's own arc radius (64px) to a deliberately oversized 200px, letting Pico-8's automatic line-clipping stop them exactly at the screen edge instead of short of it. The background grid dropped its `ET`-driven animation entirely in favour of a static gradient of line pairs straddling the shared centre's y-coordinate (tight near the centre, spreading toward the edges) \u2014 a play-test note flagged the animated version as unmotivated movement rather than a legible distance cue.\n\n**Follow-up (first play test)**: the initial version placed enemies pre-formed on their bands (y=84-108), which read as using only the screen's lower half with the top left empty. Moving the shared centre `(64,55)` up wasn't viable without changing the ship's arc radius (see CLAUDE.md's discussion of why `cy+64` is fixed to the ship's rest position). The first fix made enemies spawn at the shared centre (`r=0`) and grow outward while sweeping.\n\n**Follow-up (second play test)**: extended to a full two-phase entrance: enemies now start by circling a second, independent point near the top of the screen, then spiral from there to the shared centre before the original grow-into-formation behaviour takes over, driven by one global frame counter `ET` (`ND1=180`, `ND2=180` frames, ~12s total before the formation phase's own ~1.8s tail). A single animated background grid whose row spacing tightens over the same timeline was added to reinforce the \"closing in\" pacing. Re-verify against this version.\n\n**Follow-up (early-attack divers)**: requested directly (\"a ramping-up variation that starts slow... ship(s) diving down from the group before they migrate, to start the attack\"). `spawn_wave()` now picks `min(5, wv)` random enemies from the wave's roster and gives each a staggered trigger frame in roughly the first half of phase 1 (`20+40*(i-1)`, so wave 1 has exactly 1 diver at frame 20, ramping to 5 divers by wave 5, the last triggering at frame 180 of `ND1=360`). At its trigger frame a diver leaves its orbit and dives at the ship using the same dive mechanic and speed formula as a formation-phase dive; the trigger and resolution logic that used to be inlined at the formation dive-roll site was pulled into two shared functions, `start_dive(e,shx,shy,ed)` and `end_dive(e)`, so both dive sources (early and formation) share one implementation, differing only in a new `ed` (entrance-dive) flag read at resolution: a formation dive still snaps to its band edge on hit/miss, but an entrance dive (no settled tier position yet) just clears its dive flag and falls back into whatever entrance phase the shared `ET` counter is in by then. No draw or collision changes were needed: an entrance diver already renders as the Stinger sprite and is already shootable via the existing dive-state code paths. Token count after this follow-up: 2,989 (`p8tool stats`), up from 2,372.\n- [ ] Verify (manual play test, not yet done): wave 1 shows exactly one enemy peeling off to dive early during the entrance, later waves show visibly more (up to 5 by wave 5+); an early dive that hits or misses rejoins the entrance rather than snapping into formation early; early divers are shootable and render as the Stinger sprite same as any other diving enemy\n\n## Phase 3: Enemy attack behaviour\n\n- [x] Each enemy independently fires a shot outward along its radius vector (`arc_xy(0,0,1,ea)`, away from the centre and therefore down toward the ship \u2014 enemies sit at smaller radii than the ship, so \"outward\" is toward the ship here, the opposite of the player's own inward shots) on a wave-scaled cooldown (`max(20, 90-5*(w-1))` frames); gated on `e.r>=ER[e.tr]` so an enemy only starts firing once its entrance (Phase 2) has fully settled it into formation\n- [x] Each enemy independently has a wave-scaled per-second chance to break formation and dive toward the ship's last-known position (`min(0.5, 0.05+0.015*(w-1))`, converted to a per-frame roll as `dch/30`), at `base_dvspd = 3px/frame` scaled the same way as formation speed (default, tune once playable)\n- [x] Dive miss handling: an enemy that goes off-screen without hitting the ship does **not** leave the wave; it respawns at the *outer edge of its angular band* (`ea=\u00b1B` for its tier, the highest point it can reach, not `ea=0` which is its centred/lowest position) and resumes formation sweep, with a per-enemy miss counter (`e.mc`) that makes its next dive faster and its own fire cooldown shorter each time (both capped after ~7 misses). A wave must always clear via kills, never via unshot enemies dodging their way out of the roster.\n- [x] Player-hit collision (enemy shot or diving enemy vs ship) reduces lives (`lv`, starts at 5 per README.md's Resources line); a diving enemy that hits the ship resolves as a hit and immediately returns to formation at its band edge (same respawn path as a miss, but without incrementing the miss counter)\n- [x] Entity cap enforced: total enemies + enemy shots never exceeds 32 (a respawning diver doesn't hold a slot during its brief off-screen instant); a fire event that would exceed it is skipped for that frame rather than queued (diving itself never needs the check, since a diving enemy doesn't create a new entity \u2014 see DESIGN.md's Entity cap note)\n- [ ] Verify (manual play test, not yet done): enemies visibly fire back and occasionally dive; a missed dive re-enters at the top and is visibly more aggressive on its next attempt; getting hit reduces lives (shown as a placeholder `lv N` readout, top-left); entity count never visibly exceeds the cap even with fire and dive both active\n\nImplemented in `4.p8` with placeholder visuals (pink `pset` for enemy shots, distinct from the player's white shots; `lv N` text top-left standing in for Phase 6's real HUD). Enemy state gained `dv` (diving flag), `dvx`/`dvy` (dive velocity), `dvsg` (which band edge to respawn at, captured from `sign(ea)` at dive start), `mc` (miss count), and `fc` (fire cooldown, staggered at spawn via `rnd(90)` so the first volley isn't synchronized). The enemy update loop now branches on `e.dv`: diving enemies move in a straight line and check only for a ship hit or going off-screen, while formation enemies keep the existing entrance/sweep logic and, once settled, roll for fire and dive independently each frame. Ship position (`shx,shy`) is computed once per frame at the top of `_update()` and reused for the player's own shot spawn, dive targeting, and both hit-collision checks, rather than recomputed per use. Wave-scaled formulas (`wfc` fire cooldown, `dch` dive chance, and the dive-speed wave multiplier) all reference a `wv` variable fixed at 1 for now; Phase 4 will update `wv` as waves progress and these formulas already feed off it correctly.\n\n## Phase 4: Waves & progression\n\n- [x] Wave clears when its enemy count reaches 0\n- [x] Next-wave enemy count `min(24, 18+2*(w-1))`, formation speed `base_espd*(1+0.08*(w-1))` (`base_espd = 0.5\u00b0/frame` default), feeding Phase 2/3's placement and behaviour formulas\n- [x] Lives (5 start), score tracking: `50*arc_tier + (50 if diving when destroyed)` per kill\n- [ ] Verify (manual play test, not yet done): clearing every enemy on a wave triggers the next wave with a visibly larger/faster formation; losing all 5 lives ends the round; score increases correctly by arc tier and dive bonus\n\nImplemented in `4.p8` with a placeholder HUD readout (`lv N sc N w N`, top-left) standing in for Phase 6's real HUD; there's no `gs` state machine yet, so wave transition and game over are placeholder behaviours pending Phase 6's real screens, decided during review rather than left to guesswork:\n\n- **`base_espd`**: DESIGN.md's literal `0.5\u00b0/frame` (0.00139 turns/frame) predates Phase 2's fourth-pass tuning, which had already halved the live `ESPD` constant to `0.0007` for feel reasons. `base_espd` is the tuned `0.0007`, not the original spec number, so wave 1's formation speed matches what's already been played; the wave-scaling formula applies on top of it (`local espd=ESPD*(1+0.08*(wv-1))`, computed once per frame and used in place of the bare `ESPD` constant).\n- **Wave clear**: detected at the end of `_update()` (`#en==0`), which sets a 36-frame freeze counter (`frz`) rather than transitioning immediately. During the freeze, `_update()` returns early after decrementing `frz` (skipping ship movement, shot movement, and all enemy logic), so the playfield reads as frozen rather than continuing to animate with no enemies on screen \u2014 a placeholder for Phase 6's real wave-transition overlay, which will show \"WAVE n\" text over this same frozen frame instead of nothing.\n- **Wave re-entrance**: once the freeze ends, the next wave replays the *full* two-phase entrance (`ET=0`, `en`/`eshots` cleared, `spawn_wave()` called again) rather than spawning enemies directly into formation. This reuses Phase 2's entrance code unchanged at the cost of the same ~25.8s entrance repeating every wave; revisit if playtesting finds that too slow a cadence between waves.\n- **Tier split**: the enemy-count formula only specifies a wave total, not a per-tier split. A new `spawn_wave()` function (replacing the old fixed `EN={7,6,5}` table and its dedicated spawn loop in `_init()`, both removed) computes each tier's count by scaling the wave-1 7:6:5 ratio (`t1=flr(n*7/18+0.5)`, `t2=flr(n*6/18+0.5)`, `t3=n-t1-t2`), keeping the same inner-heaviest silhouette at every wave size (18\u219224) instead of skewing toward one tier as the count grows. `_init()` now just resets state and calls `spawn_wave()`, so wave 1's spawn and every later wave's respawn share one code path.\n- **Game over**: `lv<=0` sets an `over` flag; `_update()` returns immediately at the top when `over==1`, freezing the game permanently (no auto-restart) since Phase 6 hasn't added an End screen to transition to yet. `over` is checked before `frz`, so a lives-out and wave-clear on the same frame resolves as game over, not a wave transition.\n- **Score**: added at the point of a shot/enemy collision (`sc+=50*e.tr+(e.dv==1 and 50 or 0)`), since that's the one place both the killed enemy's tier and its diving state are already in scope; a diving enemy that's shot rather than one that hits the ship is what triggers the dive bonus, matching DESIGN.md's \"destroyed while diving,\" not \"was diving at some point.\"\n\n## Phase 5: Token checkpoint (core systems)\n\n- [x] Count tokens with Phases 1-4 implemented: ship movement, enemy arcs/formation, attack behaviour (fire, dive, miss-respawn), waves/progression, entity cap\n- [x] Compare against a soft ceiling of ~4,000 tokens for core systems (roughly half the ~8,192 total), leaving room for Phase 6's screens/HUD and Phase 7's sprites/SFX\n- [x] If over the soft ceiling, simplify before continuing (e.g. cut the miss-intensity stacking, simplify dive-vs-formation state, or move more shared math into `lib/`) rather than discovering the problem after art and sound are already built\n- [x] Verify: token count recorded; explicit decision made (proceed, or simplify first) before starting Phase 6\n\nMeasured via `p8tool stats 4.p8` (picotool): **1,415 tokens**, 220 lines, 4,567 chars. Well under the ~4,000 soft ceiling (about a third of it), so no simplification pass is needed; proceeding straight to Phase 6 with all of Phases 1-4's logic intact.\n\n## Phase 6: Screens & flow\n\n- [x] Title screen: call the shared `draw_title_card(\"GYRI #4\")` from [`../lib/title.lua`](../lib/title.lua); paste `blink()` (`lib/screen.lua`) and `draw_title_card()` into `4.p8`'s `__lua__` section rather than hand-rolling\n- [x] Wave-transition overlay: \"WAVE n\" text over the frozen playfield, holds 36 frames (1.2s)\n- [x] End screen: final score and wave reached\n- [x] HUD (y=120-127): lives left, score centre, wave right\n- [ ] Verify (manual play test, not yet done): full loop is playable start to finish, title \u2192 game \u2192 wave transition \u2192 ... \u2192 end \u2192 title\n\nImplemented in `4.p8` by replacing the ad hoc `over`/`frz`-return placeholders from Phases 3-4 with a real `gs` state variable matching DESIGN.md's state table exactly (0 title, 1 game, 2 wave transition, 3 end). `_update()` now branches on `gs` at the very top instead of checking `over==1`/`frz>0` as separate early returns; the wave-transition branch (`gs==2`) is the same 36-frame `frz` countdown Phase 4 already had, just moved out of the main update path and paired with a state change instead of an in-place return. A `newgame()` function (full state reset: ship angle, shots, enemies, `ET`, lives, wave, score, then `spawn_wave()`) replaces the reset logic that used to live only in `_init()`; `_init()` itself now just sets `gs=0`, and `newgame()` is called both from the title screen (any button) and would be called again from a future restart path. `any_btnp()` (loop over `btnp(0..5)`) gates both the title-to-game and end-to-title transitions, copied from game 3's pattern (`3.p8`) rather than re-derived. The wave-transition overlay shows `\"wave \"..(wv+1)` (the upcoming wave, not the one just cleared, since `wv` itself doesn't increment until the freeze ends) centred at y=60 over whatever the frozen playfield already contains \u2014 because enemies are already empty by the time the freeze starts (it's triggered by `#en==0`), the \"frozen playfield\" is in practice just the background grid, ship, and any still-in-flight shots (which also stop moving during the freeze, since `_update()` returns early for `gs==2`). The real HUD replaces the placeholder `lv N sc N w N` line with three separately-positioned strings on one line at y=121 (lives left-aligned at x=2, score centred at `64-#s*2` reusing `title.lua`'s centring convention, wave right-aligned at `126-#s*4`), with the placeholder `line(0,120,127,120,7)` kept as a visual HUD separator rather than removed. `draw_end()` is a new function (score, wave reached, blinking \"press x\" prompt, following game 3's `draw_end()` shape but with this game's own fields). Token count after this phase: 1,714 (`p8tool stats`), up from Phase 5's 1,415 checkpoint, still well under the ~8,192 total budget with Phase 7's sprites/SFX still to come.\n\n**Redesign implemented**: the wave-transition overlay item above is superseded by a much richer 5-stage sequence \u2014 see DESIGN.md's Wave transition sequence note (Core system design) for the full spec: ship zooms in a straight line to the shared centre then a third fixed point `(TX,TY)=(64,12)`, trailing a colour-ramping line; screen irises to white; \"NEW WAVE n\" holds in the new wave's colour; iris shrinks back to reveal the next wave already spawned underneath. Requested directly (\"Ship zooms to the center dot, then zooms in a line turning into white to the top point. once it's there, the screen fades to white, 'new wave' appears, and then fades to the next level\"), clarified via a short Q&A (the top point is the original single entry point from before the entrance split, not one of the two current planets; the trail is a streak behind the ship rather than the ship itself recolouring; the zoom permanently resets `sang` to 0, not just a cosmetic overlay; the text reads \"NEW WAVE n\" with the number), then implemented directly (\"Implement this and the end of level transition\"). `gs==2`'s `_update()` branch grew a sub-stage counter `ws` (1-5) and a `zoompos()` helper for stages 1-2's interpolated position; `_draw()` was split into `draw_backdrop()` (grid/spokes/centre dot), `draw_trail()`, and `draw_game()` (the full ordinary-play render, reused verbatim for stage 5's reveal so nothing needed duplicating) so the same rendering code serves normal play and the transition's final stage. Checklist item above stays as originally checked (Phase 6 shipped *a* wave-transition overlay); this note documents its replacement rather than reopening the phase.\n\n## Phase 7: Visuals & sound polish\n\n- [x] Apply palette: ship fixed white (7), enemy/enemy-shot colour rotates per the 4-wave theme table in DESIGN.md (grid colour rotation was dropped in the play-test follow-up below)\n- [x] Draw sprite 0 (ship, rocket wedge) and sprite 1 (enemy, wing silhouette), per the pixel data in DESIGN.md's Sprite rendering section\n- [x] Draw sprites 2-4 (shot straight/shallow/steep); wire the angle-to-sprite-and-flip lookup (`abs(\u03b8)` thresholds at 12\u00b0/37\u00b0, `flip_x` on sign, `flip_y` for enemy shots) so both shot types share all 3 sprites\n- [x] Enemies drawn via `sspr` at a continuous, distance-driven size (superseding the originally-planned fixed-per-tier native/10\u00d710 split; see play-test follow-up below)\n- [x] Explosion particle effect on enemy death: a handful of short-lived particles (position + velocity + countdown) spawned at the enemy's death position, radiating outward and fading over a few frames, coloured to match the wave theme; no dedicated sprite, drawn with `pset`/`circfill` like the current shot/enemy placeholders\n- [x] Background grid (reverted from an 8-fixed-row scanline version to the original radiating/converging version per play-test feedback; see follow-up below)\n- [x] SFX: ship fire (short/punchy, deliberately breaks from the atmospheric palette so hold-to-fire doesn't choke the 4 sound channels), enemy destroyed, player hit, enemy dive start, wave clear, game over (all atmospheric/sustained)\n- [ ] Verify (manual play test, not yet done): play a full round with sound on; confirm every listed SFX fires at its correct trigger, shots visibly point along their travel direction, outer-tier enemies read as visibly bigger, and the ship stays visually identifiable against a re-tinting field\n\nImplemented in `4.p8` plus two new files under `../tools/sprites/defs/` (`g4_ship.txt`, `g4_enemy.txt`, `g4_shot_straight.txt`, `g4_shot_shallow.txt`, `g4_shot_steep.txt`), authored as 8\u00d78 hex-grid sprite sources and patched into the cart's `__gfx__` section (sprite slots 0-4) with `tools/sprites/sprite_tool.py patch`, the same tool used for games 1/3's sprite work; a combined preview PNG (`sprite_tool.py sheet`) was rendered and visually checked before patching, since the tool runs headlessly and doesn't require Pico-8 itself.\n\n- **Palette rotation**: sprites are drawn into the sheet in one canonical colour each (ship white(7), enemy and both shot types drawn in the wave-1 theme colours already, red(8) for the enemy sprite, white(7) for the shot sprites since player shots need no swap) and recoloured per-wave at draw time with `pal(8,ecol)`/`pal(7,ecol)` swaps, reset with a bare `pal()` immediately after each swapped draw group; `WT` is a 4-row table (`{enemy/shot colour, grid-hi, grid-mid}` per row) indexed by `(wv-1)%4+1`. This avoids storing or duplicating sprite art per theme colour, at the cost of needing the swap/reset bracketing to be correct so an un-reset `pal()` doesn't bleed into the next draw call (verified by inspection: enemies use `pal(8,ecol)` bracketed before the ship/player-shot draws, enemy shots use a separate `pal(7,ecol)` bracketed before the particle draws, matching DESIGN.md's Palette table exactly for wave 1 since `WT[1]={8,9,13}` reproduces the placeholder colours already in use).\n- **Sprites**: ship (`spr(0,...)`) and enemy (`spr(1,...)` for inner/middle tiers, `sspr(8,0,8,8,x-5,y-5,10,10)` for the outer tier) replace the placeholder `circfill` calls; this also retires the Phase 2 \"grow larger as distance from the shared centre shrinks\" continuous scaling placeholder (`sz=mid(1,(60-dist)/10,3)`) in favour of DESIGN.md's actual final rule, a fixed size per tier with only the outer tier scaled \u2014 DESIGN.md's Enemy entrance note had already flagged the distance-based version as a temporary stand-in for this, not a feature to carry forward, so real sprites render at final size through all three entrance phases, not just once settled into formation.\n- **Shot sprites**: each shot's sprite index and `flip_x` flag are computed once at spawn (`shsp(th)`, thresholds `SA1=0.03333`/`SA2=0.10278` turns, i.e. 12\u00b0/37\u00b0) and stored on the shot table (`sp`, `fx`) rather than recomputed every draw frame, since a shot's fired angle never changes after spawn; `flip_y` is passed as a literal (`false` for player shots, `true` for enemy shots) at the draw call site instead of stored per-shot, since it's constant within each array.\n- **Explosion particles**: a new `pt` flat array (same `del()`-safe reverse-loop pattern as `shots`/`en`/`eshots`), 5 particles spawned per kill at the shot/enemy collision site, each a random unit direction (`cos(rnd(1))`,`sin(rnd(1))`) scaled by `rnd(1.5)` px/frame with a 10-15 frame countdown, drawn with `pset` in that wave's `ecol` (no separate colour field needed per particle, since it's read fresh from `ecol` at draw time, and the entire lifespan is well under one wave). `pt` is cleared alongside `en`/`eshots` in both `newgame()` and the wave-transition's respawn block, so stray particles from the just-cleared wave don't linger visibly through the freeze into the next wave's entrance.\n- **Background grid**: the Phase 2 placeholder (`GD0`/`GGR`/`GN`, a static line-pair gradient centred on `CY` in a fixed dark-blue) is replaced outright by DESIGN.md's real 8-fixed-row grid (`GY={127,119,109,97,83,67,49,30}`), rows 1-3 in that wave's `ghi` colour, rows 4-5 in `gmid`, rows 6-8 always black \u2014 this is the reconciliation DESIGN.md's Background during entrance note already flagged as pending. The Phase 4 placeholder white HUD separator line (`line(0,120,127,120,7)`) is removed since the grid's own row 2 (y=119, one pixel above the old placeholder, in that wave's `ghi` colour) now serves the same visual-separator role without a redundant second line.\n- **SFX**: 6 hand-authored `__sfx__` slots (0 fire, 1 enemy destroyed, 2 player hit, 3 enemy dive start, 4 wave clear, 5 game over), generated with a short one-off Python script rather than typed by hand (the format is header `00` + speed + loop-start + loop-end, each 1 byte/2 hex chars, followed by 32 notes of `pitch(2 hex)+waveform(1 hex)+volume(1 hex)+effect(1 hex)`) since `tools/sfx/` has no notation utility yet (tracked as an open backlog item in `../tools/TASKS.md`); slot 0 is a single-note laser \"drop\" effect (fast decay, breaks the mood deliberately per DESIGN.md's fire-sound note so hold-to-fire's repeated triggering doesn't feel wrong), slots 1-3 are short multi-note stings, slots 4-5 are longer, slower, fading sequences for the atmospheric wave-clear/game-over beats. `sfx(n)` calls were added at each event's existing state-change site (fire spawn, both player-hit sites, dive-start, kill, wave-clear, game-over) rather than introducing new call sites.\n- Token count after this phase: 2,001 (`p8tool stats`), up from Phase 6's 1,714, with Phase 8's final budget check still to come.\n\n**Follow-up (play-test pass)**: five changes made after playing the Phase 7 build, two new sprite defs added (`g4_ship_lean1.txt`, `g4_ship_lean2.txt`, patched to slots 5-6), no gameplay/collision logic touched:\n\n- **Background grid reverted**: the flat 8-fixed-row scanline grid (`GY`, wave-rotating `ghi`/`gmid`) is removed outright and replaced by the original Phase 2 radiating grid (`GD0`/`GGR`/`GN`, now `GN=7` to reach further in both directions, fixed dark blue) \u2014 a play-test note said this looked better (\"we lost the gridlines into the distance, they looked good\"). The Phase 6 HUD separator line (`line(0,120,127,120,7)`) is restored too, since the flat grid's row 2 (which had been standing in for it) is gone. `WT` collapses from a `{enemy, grid-hi, grid-mid}` table to a flat per-wave enemy/shot colour array (`WT={8,11,12,2}`), since grid-hi/grid-mid have no reader left.\n- **Ship rotation**: two new sprites (5 \"lean slight\", 6 \"lean sharp\") join sprite 0 (\"straight\"); `shipspr(sang)` picks between them at two thresholds (23\u00b0/46\u00b0, roughly thirding the ship's \u00b169\u00b0 range) and `flip_x=sang<0` mirrors for the opposite side, giving 5 visible rotation states from 3 sprites. Each lean sprite keeps the bottom two rows (the wedge's base) unshifted and skews the rows above progressively more toward the nose, so the ship reads as pivoting on a planted base rather than sliding sideways.\n- **Shots at half size**: player and enemy shots now draw via `sspr(sp*8,0,8,8,x-2,y-2,4,4,flip_x,flip_y)`, a 4\u00d74 destination instead of the native 8\u00d78 `spr()` call \u2014 a play-test note found the Phase 7 shot sprites read as too big. The 3px collision hitbox is untouched.\n- **Enemies grow continuously again**: the Phase 7 \"outer tier `sspr` 10\u00d710, others native `spr` 8\u00d78\" fixed-per-tier split is replaced by the Phase 2 placeholder's continuous distance-from-centre formula (`ds=mid(1,(60-dist)/10,3)*3`), now driving an `sspr` destination size for the single enemy sprite instead of a `circfill` radius. A play-test note asked for the \"start smaller, then get larger\" entrance read back; the fixed-tier version had dropped it when real sprites replaced the placeholder circles in the initial Phase 7 pass.\n- **Two-point split entrance**: phase 1 of the enemy entrance (orbit-then-spiral) now uses two entry points, `(LX,D1Y)=(32,12)` and `(RX,D1Y)=(96,12)`, instead of one shared `(D1X,D1Y)=(64,12)`. Each enemy is assigned one at spawn by `idx%2` (exactly half the wave to each side, since `idx` runs 0..n-1 across the whole spawn order) and stores it as `dex,dey` on its own table; phase 1 and phase 2's `arc_xy` calls read `e.dex,e.dey` instead of the old globals. A play-test note asked for the entrance to visibly fork into two streams before continuing down into formation, rather than reading as one ring circling a single point; phase 2 (spiral to the shared centre) and phase 3 (grow into formation) are unchanged, since both streams converge on the same shared centre regardless of which point they started from. Two yellow entry-point dots are drawn in place of the old single dot.\n\nToken count after this follow-up: 2,095 (`p8tool stats`), up from 2,001.\n\n**Follow-up (rotation direction fix)**: the ship-rotation change above shipped with `flip_x = sang < 0`, which pointed the nose *away* from the shared centre at both ends of the sweep instead of toward it. Fixed to `flip_x = sang > 0` \u2014 see DESIGN.md's Sprite rendering section for the geometric derivation (it follows directly from the already-established \"increasing `sang` sweeps the ship right\" input mapping, no trig-sign guessing required). No token or gameplay-logic change, draw call only.\n\n**Follow-up (rotation precision + planet bonus)**: two more changes from the same play-test round.\n\n- A 4th ship sprite (7, \"lean 3\") joins sprites 0/5/6; `shipspr()` now uses 3 even thresholds (17.25\u00b0/34.5\u00b0/51.75\u00b0, quartering the \u00b169\u00b0 range) instead of 2 (thirds), giving 7 visible rotation states instead of 5. The new sprite's rows are narrowed as well as shifted, since an 8px-wide row can only shift so far before it clips \u2014 this reads as a much more compressed, near-horizontal silhouette at maximum deflection, closer to the true ~69\u00b0-from-vertical aim direction. A play-test note found the 3-sprite version imprecise (\"the ship rotation isn't quite enough... it should be pointing towards the centre point, not the top centre point\").\n- Player shots can now hit the two entry-point dots (\"planets\" \u2014 see DESIGN.md's Enemy entrance note) for a flat 200-point bonus, added after a play-test note (\"you should be able to hit the yellow planets, too\"). A new collision check (same 3px-box convention as every other hit test in `4.p8`) runs after the shot/enemy loop; a hit awards score, plays a new `sfx(6)` chime, spawns the existing particle effect in yellow (10) instead of the wave's enemy colour (particles gained an optional `c` field, read at draw time as `p.c or ecol`), and consumes the shot. Unlike enemies, planets are never removed \u2014 they're fixed landmarks the entrance geometry (`spawn_wave()`) depends on every wave, so they stay hittable indefinitely.\n\nToken count after these two follow-ups: 2,223 (`p8tool stats`), up from 2,095.\n\n**Follow-up (rotation art fix + formation moved closer to centre)**: three more changes, the first two from a play-test screenshot showing the actual in-game result of the two follow-ups above.\n\n- The 4-sprite, row-shift-derived ship rotation (sprites 5/6/7 above) looked wrong in play \u2014 a play-test screenshot showed sprite 7 rendering as a jagged, disconnected staircase rather than a recognizable tilted ship, and the note asked for the ship to be \"completely rotated 90 degrees\" at maximum deflection rather than a partial, proportional tilt. Row-shifting turned out to be the wrong technique entirely (it works for small skews but degrades into disconnected artifacts once the shift exceeds a couple of pixels on an 8-wide sprite). Replaced with 3 sprites total: 0 (straight, unchanged), 5 (a hand-drawn solid triangle, chosen f
