<style>
:root{--embed-size:440px; --console-depth:70px; --edge-size:42px}
.main{position:relative; max-width:calc(var(--main-width) + var(--gap) * 2); margin:auto; padding:var(--gap)}
.jam-title{text-align:center; font-family:"Montserrat",sans-serif; font-weight:700; letter-spacing:3px; text-transform:uppercase; font-size:.8em; color:var(--secondary); margin-bottom:var(--gap)}

/* The console is a static outer frame (always-visible, full-width/height
   labelled buttons — the TV's physical control chrome) wrapped around an
   inner cube that does the actual 3D rotation. A literal 90deg-rotated
   cube face is edge-on to the camera at rest — invisible and unclickable —
   so the buttons can't themselves be rotating faces; the frame stays put
   and the content cube spins inside its window. */
.console-stage{perspective:1400px; display:flex; justify-content:center; margin:8px auto}
.console-frame{
  display:grid;
  grid-template-columns: var(--edge-size) var(--embed-size) var(--edge-size);
  grid-template-rows: var(--edge-size) var(--embed-size) var(--edge-size);
  background:var(--tertiary); border-radius:16px; overflow:hidden;
}
.frame-btn{
  background:var(--tertiary); border:0; cursor:pointer; color:var(--primary);
  font-family:"Montserrat",sans-serif; font-weight:600; letter-spacing:1px; text-transform:uppercase;
  font-size:.75em; display:flex; align-items:center; justify-content:center;
}
.frame-btn:hover{background:var(--border)}
.frame-btn.top{grid-column:1 / 4; grid-row:1}
.frame-btn.bottom{grid-column:1 / 4; grid-row:3}
.frame-btn.left{grid-column:1; grid-row:2}
.frame-btn.right{grid-column:3; grid-row:2}
.frame-btn.left,.frame-btn.right{font-size:16px}

.console-window{
  grid-column:2; grid-row:2; position:relative; perspective:1400px;
  background:#000; border-radius:4px; overflow:hidden;
}
.console{
  position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s ease;
}
.cube-face{position:absolute; inset:0; backface-visibility:hidden}
.cube-face.front{transform:translateZ(calc(var(--console-depth) / 2)); background:#000}
.cube-face.back{transform:rotateY(180deg) translateZ(calc(var(--console-depth) / 2)); background:var(--tertiary)}
.cube-face.top{transform:rotateX(90deg) translateZ(calc(var(--console-depth) / 2)); background:var(--tertiary)}
.cube-face.bottom{transform:rotateX(-90deg) translateZ(calc(var(--console-depth) / 2)); background:var(--tertiary)}
.cube-face.left{transform:rotateY(-90deg) translateZ(calc(var(--console-depth) / 2)); background:var(--tertiary)}
.cube-face.right{transform:rotateY(90deg) translateZ(calc(var(--console-depth) / 2)); background:var(--tertiary)}

#console-screen{width:100%; height:100%; overflow:hidden}
#console-screen iframe{width:100%; height:100%; border:0; display:block}
#console-screen.face-about{
  background:#0b0f0c; color:#39ff6a; font-family:Menlo,Consolas,monospace; font-size:.68em;
  padding:16px; overflow-y:auto; text-align:left; display:block; height:100%; box-sizing:border-box;
  scrollbar-width:thin; scrollbar-color:#2e8a52 #0b0f0c;
}
#console-screen.face-about::-webkit-scrollbar{width:8px}
#console-screen.face-about::-webkit-scrollbar-track{background:#0b0f0c}
#console-screen.face-about::-webkit-scrollbar-thumb{background:#2e8a52; border-radius:4px}
#console-screen.face-about a{color:#7dffb0}
#console-screen.face-about h1,#console-screen.face-about h2,#console-screen.face-about h3,
#console-screen.face-about h4,#console-screen.face-about h5,#console-screen.face-about strong{
  color:#7dffb0; font-family:inherit;
}
#console-screen.face-about h1,#console-screen.face-about h2,#console-screen.face-about h3{
  font-size:1em; text-transform:uppercase; letter-spacing:1px; margin:1em 0 .3em;
}
#console-screen.face-about h1:first-child,#console-screen.face-about h2:first-child,
#console-screen.face-about h3:first-child{margin-top:0}
#console-screen.face-about table{width:100%; border-collapse:collapse; font-size:.85em; margin:.6em 0}
#console-screen.face-about th,#console-screen.face-about td{border-bottom:1px solid #1e5c34; padding:3px 5px; text-align:left}
#console-screen.face-about .doc-label{
  color:#39ff6a; text-transform:uppercase; letter-spacing:2px; font-size:.85em; margin:1em 0 .3em; opacity:.8;
}
#console-screen.face-about .doc-label:first-child{margin-top:0}
#console-screen.face-about hr{border:0; border-top:1px dashed #1e5c34; margin:1em 0}
#console-screen.face-about pre{background:#06110a; padding:8px; border-radius:4px; overflow-x:auto}
#console-screen.face-about code{background:#06110a; padding:1px 4px; border-radius:3px}
#console-screen .placeholder{color:var(--secondary); text-align:center; padding:20px; font-size:.85em; font-family:-apple-system,sans-serif}
#console-screen .placeholder strong{display:block; font-size:1.3em; letter-spacing:1px; color:var(--primary); margin-bottom:6px; font-family:Menlo,Consolas,monospace}
#console-screen.face-about .placeholder{color:#2e8a52; font-family:inherit}
#console-screen.face-download{background:var(--theme); color:var(--primary); text-align:center; padding:20px; box-sizing:border-box}
#console-screen.face-download a{font-weight:600; border-bottom:1px solid currentColor}
#console-screen.face-download p{margin-top:10px; color:var(--secondary); font-size:.85em; font-family:Menlo,Consolas,monospace}

.console-indicator{
  text-align:center; background:var(--tertiary); border-radius:0 0 16px 16px;
  margin:-1px auto 0; padding:10px var(--gap) 14px; max-width:calc(var(--edge-size) * 2 + var(--embed-size));
}
.console-indicator .title{display:block; font-family:"Montserrat",sans-serif; font-weight:700; font-size:1.15em; color:var(--primary)}
.console-indicator .tagline{display:block; font-size:.85em; color:var(--secondary); font-style:italic; margin-top:2px}

@media (max-width:560px){
  :root{--embed-size:min(64vw,300px); --console-depth:50px; --edge-size:34px}
  .frame-btn{font-size:.65em}
  .frame-btn.left,.frame-btn.right{font-size:14px}
}

footer.footer{text-align:center; padding:var(--gap) 0}
</style>

 a retro maze game with Atari 2600 aesthetics. The full spec is in [README.md](README.md), following [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md). Output is a single `.p8` cartridge file.\n\nThis game shipped before `SPEC-FORMAT.md`'s DESIGN.md convention existed, so there's no DESIGN.md here; the Architecture section below is both the technical design and the as-built record.\n\n## Development\n\nPico-8 has no build system. The workflow is:\n\n- Edit the `.p8` file in an external editor or inside Pico-8's built-in editor\n- Run with `pico8 -run 1.p8` (requires Pico-8 installed)\n- Or open Pico-8, then `load 1.p8` and press Ctrl+R to run\n\nThere are no tests, linters, or package managers.\n\n## Pico-8 Constraints\n\nThese constraints shape every implementation decision:\n\n- **Token limit**: ~8,192 tokens total (code is compressed; count aggressively)\n- **Display**: 128\u00d7128 pixels, 16-colour palette\n- **Sprites**: 8\u00d78 pixels each, 256 slots in the sprite sheet\n- **Map**: 128\u00d764 cells, shared memory with the bottom half of the sprite sheet\n- **Colours**: Pico-8 has its own 16-colour palette \u2014 to approximate Atari 2600, use black (0), white (7), red (8), orange (9), yellow (10), green (11), dark green (3), teal (12), sky blue (6), dark blue (5), purple (2), dark red (13)\n- **Sound**: 64 SFX slots, 4 channels\n- **Lua variant**: Pico-8 Lua omits some standard library functions. No `string.format` on older versions; use `tostr()`, `tonum()`, `sub()`, `#str` for strings\n\n## Architecture\n\nThe game should follow the standard Pico-8 callback structure in a single `1.p8` file:\n\n```lua  \n_init()   -- called once on startup: seed RNG, generate first level\n_update() -- called 30fps: handle input, move player, check collisions\n_draw()   -- called 30fps: clear screen, draw map, player, HUD\n```\n\n### Key systems\n\n**Maze generation** \u2014 Recursive backtracking (depth-first search) on a grid. Seed with `srand(lseed)` before generation so the same seed always produces the same maze. The maze array is a flat table indexed `y*mw+x`.\n\n**Level seeding** \u2014 `lseed = flr(rnd(32767))` on new game. Sequential exits: `lseed+1`. Teleports: `lseed + flr(rnd(9)) + 1`.\n\n**Map layout** \u2014 Tile type IDs stored in the `maze` table (not Pico-8 map tiles). Tile IDs: 0=floor, 1=wall, 2=start, 3=exit, 4=trap, 5=treasure, 6=teleport. Player is drawn with primitives, not stored in the maze.\n\n**Collision** \u2014 `mg(x,y)` reads a tile (returns 1 for out-of-bounds). Check before moving; wall tiles block, item tiles trigger `handle_tile()` then become floor.\n\n**HUD** \u2014 Bottom strip (y=120\u2013127): score left, level number centered, timer right. Drawn every frame over the game area.\n\n**Screen flash** \u2014 On item pickup, set `flash_t` (frames) and `flash_c` (colour). In `_draw()` during playing state, if `flash_t > 0`, fill the game area with `flash_c` instead of drawing the maze, then decrement.\n\n**Title screen** \u2014 Uses the shared jam title card from [`../lib/title.lua`](../lib/title.lua) and [`../lib/screen.lua`](../lib/screen.lua) (`draw_title_card`, `blink`), pasted into this cart's `__lua__` section. `gs==2` calls `draw_title_card(\"#1\")`; no per-game title-drawing code remains.\n\n### Game states\n\n| `gs` | Name | Triggered by |\n| ---- | ---- | ------------ |\n| 0 | Playing | `new_game()` or transition complete |\n| 1 | Game over | Score < 0, or timer reaches 0 |\n| 2 | Title | Startup; any button on game over screen |\n| 3 | Transitioning | Exit or teleport collected; 18-frame black/white flicker |\n\n### SFX slots\n\n| Slot | Event | Notes |\n| ---- | ----- | ----- |\n| 0 | Trap hit | C3\u2192A2\u2192G2\u2192E2 descending, square wave, speed 10 |\n| 1 | Treasure collected | C3\u2192E3\u2192G3\u2192C4 ascending, square wave, speed 10 |\n| 2 | Teleport activated | A2\u2192C3\u2192E3\u2192G3\u2192C4 ascending, noise, speed 6 |\n| 3 | Exit reached | C3\u2192E3\u2192G3\u2192C4\u2192E4 ascending, square wave, speed 20 |\n\n### State variables\n\n```lua\n-- constants (uppercase to avoid shadowing)\nMW, MH    -- maze dimensions: 16\u00d715\nTS        -- tile size in pixels: 8\n\n-- screen\ngs        -- game state: 0=playing 1=game_over 2=title 3=transitioning\n\n-- level\nlseed     -- current level's RNG seed\nlnum      -- levels completed; displayed as lnum+1\n\n-- player\npx, py    -- player map cell position\npdir      -- facing: 0=right 1=down 2=left 3=up\nscore     -- carries over between levels; game over if <0\n\n-- timer\ntimer     -- countdown in seconds; game over at 0\n\n-- screen flash\nflash_t   -- remaining flash frames\nflash_c   -- flash colour index\n\n-- transition\nnext_seed -- seed for incoming level\nnext_tp   -- true: spawn at teleport tile; false: spawn at start\ntrans_t   -- transition countdown (18 frames)\n```\n\n## Reusable code\n\nCheck [`../lib/CLAUDE.md`](../lib/CLAUDE.md) for shared Lua snippets before writing new utility code from scratch. This cart pastes in `blink()` (`lib/screen.lua`) and `draw_title_card()` (`lib/title.lua`) for its title screen; everything else here predates extraction and remains bespoke.\n\n### Known bugs\n\nTracked in [`../BUGS.md`](../BUGS.md#1--maze-game) (entries 1.1\u20131.3): teleport increments the level counter by the seed offset instead of by 1, the exit tile isn't guaranteed a slot when placing items onto dead ends, and the timer resets on teleport though README only documents that for Exit and Treasure.\n"}}, {"num": "2", "title": "#2 Somewhat possible mission", "tagline": "action/platform/puzzle game", "hasCart": true, "cartRelPath": "downloads/2.p8", "embedPath": "exports/2/2.html", "embedStatus": "ok", "docs": {"readme": "# #2 Somewhat possible mission\n\nThis is an action/platform/puzzle game built using Claude and Pico-8. Follows the format in [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md).\n\nThe game looks like an Atari 2600 game. Colours, sprites, and fonts should approximate the Atari 2600 aesthetic using Pico-8's palette. It's a vastly simplified remake of Impossible Mission (Epyx, 1984).\n\n## Game overview\n\nThe player starts in an elevator, viewed from the side as if the wall is cut away. It moves up or down, auto-stopping at floors with a corridor and humming with a faint buzz while it moves. Floors with no corridor just scroll past.\n\nEach floor may have a corridor on the left, the right, both, or neither. A corridor isn't a separate screen: it's just the elevator screen's walkable area extending out to a door at the screen edge. Walking through a door leads into a room. Most rooms have 3 floors linked by an automatic centre lift, with robots and searchable objects (garbage cans, desks, vending machines, shelves, and the occasional terminal) on each floor. A room's state persists: searched objects and robot positions carry over if the player leaves and comes back. See [Elevator & rooms](#elevator--rooms) for the exact entry/exit rules.\n\nSearching an object can yield health, extra time, or a puzzle-piece letter; a terminal instead opens a reusable help screen. Ten letters, found across the first 10 valid rooms, spell a secret word. The control room, behind the last valid room in the shaft, shows the word as blank slots; the player arranges their letters into the blanks and submits. A correct arrangement wins; a wrong one costs 1 HP and can be retried without limit.\n\n## Scenes\n\n| Scene | Shows | Enters from | Exits to |\n| ----- | ----- | ------------ | -------- |\n| Title | \"#2 Mission\" / \"'26 WARPED GAME JAM\" | Startup | Any button \u2192 Intro |\n| Intro | Placeholder transition text, \"stay a while, solve a puzzle!\" | Title, any button | ~3 seconds elapsed, or any button \u2192 Elevator shaft |\n| Elevator shaft | Vertical shaft, 16 randomized floors scrolling by (auto-stopping only at corridor floors), top and bottom bounds; a floor's corridor is part of this same screen, extending from the shaft to a door at the screen edge | The Intro screen; walking back out of a puzzle room | Walking through an edge door on a corridor floor \u2192 Puzzle room |\n| Puzzle room | 3 floors of robots and objects, centre lift, player standing beside the entry door on the bottom floor | The elevator shaft, through a floor's edge door (a \"both\" floor's two doors lead to two independent rooms) | Walking back out the entry door \u2192 Elevator shaft; reaching the control room (far side of the last valid room in the shaft) \u2192 Control room; completing a terminal search \u2192 Help |\n| Help | Full-screen overlay: controls, the letter/win goal, and an object legend; gameplay is paused (timer, robots) while shown | Completing a search on a terminal object, from any puzzle room | Any button \u2192 back to the puzzle room, unpaused |\n| Control room | Blank letter slots for the secret word; player arranges collected letters and submits | The last valid puzzle room in the shaft | Correct arrangement \u2192 Game over (win); timer or HP hits 0 \u2192 Game over (loss), any time; wrong arrangement costs 1 HP, stays in Control room |\n| Game over | Final score, win or lose state | Timer reaches 0; HP reaches 0; puzzle solved in Control room | Any button \u2192 Title |\n\nTransitions: elevator movement implies scrolling by floor as it moves (constant per game, may be randomized between games). Entering or exiting a room fades in/out. Game start and end flash.\n\n## Elevator & rooms\n\n- Layout: title screen (Intellivision-style, per the 2026 jam guide); elevator shaft screen (corridors are part of this screen, not separate); puzzle room screen; control room screen.\n- Generation: 16 floors, each randomized as left corridor, right corridor, both (two independent rooms), or neither, seeded. The generator re-rolls the seed until at least 10 floors resolve to a valid room. Puzzle rooms are randomized from 4 patterns that vary robot and object density per floor side (light/medium/heavy), not room structure. Puzzles must be solvable, and robots must be jumpable with skill.\n- The elevator only stops at floors with a corridor; a \"neither\" floor is scrolled past without stopping. If the shaft's very top or bottom floor happens to be \"neither\", the car simply can't reach it \u2014 it stops at the nearest corridor floor instead.\n- Corridor: not a separate place, just the part of the elevator screen between the narrow shaft column and the screen's edge, on any floor with an open corridor on that side. Same blank background as the rest of the shaft. No objects or robots in it, just floor space to walk across; jumping there is just a faster way to cross it, since there's nothing to clear.\n- Centre lift: a platform moving automatically between a room's 3 floors, pausing briefly at each. While riding it, the player can move and jump freely, the same as on any floor or corridor. Walking off either edge lands on whichever floor the lift is nearest to. Jumping off it can catch the lift again mid-air (whether it's paused or moving) or miss it entirely.\n- The bottom floor is solid ground, walkable straight across; only the gap on the top and middle floors is a hazard. Walking or jumping into an open gap while the lift isn't there starts a real fall, not an instant penalty: drifting sideways under momentum lands safely on whichever floor below is reached, and catching the lift mid-transit also lands safely. Falling all the way down costs HP scaled to the distance fallen (1 HP from the middle floor, 2 HP from the top), landing the player in place rather than resetting them to the room's entry door.\n- Secret word: 10 letters, picked per seed from a short hardcoded word list (`IMPOSSIBLE`, `INFILTRATE`, `DEMOLITION`, `ELECTRICAL`, `MECHANICAL`). One letter is placed in each of the first 10 valid rooms (in shaft order); every object in rooms beyond the 10th holds a health pickup instead. The control room sits behind the last valid room in the shaft, whatever that room's letter status.\n- Room persistence: once a room is generated, its state sticks. Objects already searched stay empty and robots keep their current position and pattern state if the player leaves and returns.\n- Placement rules: no more than 1 robot per floor side (left or right); no more than 2 items per floor side. A robot never crosses the centre lift gap; it's confined to the side of the floor it spawned on, for every movement pattern, including chase.\n- Search: standing in front of an object and holding up raises the player's hands. A comic-style bubble appears above the player with a progress bar, 0 to 10, about half a second per step. An object's contents stay hidden until the search actually starts; checking every object is the only way to know what it holds. At 10, the contents are added to the player's inventory (or, for a clock, the timer) and the bubble disappears; finding a letter also shows a brief \"found: X\" popup. Releasing up, or getting hit, pauses the bar at its current step rather than resetting it; holding up again resumes from there.\n- Terminal search works the same way but at double speed (~2.5s total) and opens a full-screen help overlay instead of adding to inventory. The overlay pauses the game and ignores input for the first 3 seconds, so it can't be closed before it's readable, then dismisses on any button. A terminal isn't consumed, so it can be searched again later; releasing up early cancels its progress back to 0 instead of pausing it.\n- Robots, 3 movement patterns:\n  - Stationary: looks left and right at random intervals, beeping on each look.\n  - Patrol: moves left and right at some speed, pausing a random amount of time at each end.\n  - Chase: moves toward the player at a random speed if the player is on the same floor, confined to its own side of the centre lift gap (it won't follow the player across). If the player jumps over it, the robot pauses, \"thinks\" for about 1 second, then reverses direction. Also pauses briefly whenever the direction it needs to move actually changes (e.g. the player crosses from one side of it to the other), rather than reversing instantly.\n- Difficulty ramps with rooms found: robot speed and density scale up as the player collects more letters, similar in spirit to game 3's fall-speed ramp.\n- Puzzle solving: the control room shows one blank slot per letter of the secret word. The player arranges their collected letters into the blanks (directional input to cycle/place) and submits. A correct arrangement wins immediately; a wrong one costs 1 HP and can be retried without limit.\n\n## Player\n\n- Standing (idle pose, same for both facings). Running: a 4-frame leg/arm cycle, drawn as separate left-facing and right-facing sequences (not mirrored). Searching: a 2-frame animated loop, hands raised and reaching, direction-neutral (shown facing whichever way the player last moved). Jumping: a 4-frame flip sequence (launch, tuck, extend, land) stepped through by the jump arc's progress, drawn as separate left-facing and right-facing sequences matching the jump's horizontal direction; a straight-up jump (no horizontal direction) uses the right-facing sequence by default.\n- Moves left or right; moves up or down while in an elevator shaft.\n- Up always jumps, except: while standing in the elevator car's narrow column (up/down there moves the car instead \u2014 this doesn't apply out in a corridor, where jumping works normally), while riding the centre lift, or while searching a found object (up there advances the search instead). Jump direction follows whichever way the player is currently moving, or straight up if they aren't.\n- Jumping is a fixed parabolic arc (Mario-style), not an instant hop: higher and slower than a quick hop would be, deliberately floaty, with enough horizontal reach to clear a robot or the lift shaft's gap with margin to spare, not just barely. Used to clear either hazard, or just to move faster.\n- Player steps make a percussive sound.\n- Resources:\n  - HP starts at 5. A robot hit costs 1 HP plus a brief knockback; falling all the way to the bottom floor during a lift-shaft fall costs 1-2 HP depending on how far the player fell (a fall can also be recovered from safely, see Elevator & rooms); a wrong puzzle submission in the control room costs 1 HP.\n  - Inventory begins empty.\n\n## Items\n\n| Item | Effect | Visual feedback |\n| ---- | ------ | --------------- |\n| Health pickup | Restores 2 HP | Green cross/plus icon, revealed in the search bubble once searching starts |\n| Puzzle letter | Adds one letter to inventory (1 of 10 total) | Yellow letter tile, revealed in the search bubble; also triggers the \"found: X\" popup |\n| Clock | Adds 60 seconds to the timer | Clock icon, revealed in the search bubble. Roughly 1 in 4 non-letter objects is a clock instead of health |\n| Terminal | Opens a reusable help screen (controls, letter/win goal, object legend); see Search above for its timing | Terminal icon; only placed on the bottom floor next to the entry door, never elsewhere |\n\n## Game over conditions\n\n- Timer reaches 0. Starts at 300 seconds (5 minutes), never resets mid-run.\n- Player HP reaches 0.\n- Player reaches the control room and submits the correct letter arrangement (win). Score is `100 \u00d7 letters collected + 2 \u00d7 seconds remaining` on a win, 0 on a loss.\n\n## Sound\n\n| Event | Description |\n| ----- | ------------ |\n| Elevator moving | Soft hum with a faint buzz |\n| Elevator ambient loop | Low, tense ambient pad, loops only while in the elevator shaft; silent in puzzle rooms and elsewhere |\n| Room door (enter/exit) | Short percussive thunk, decaying noise hit |\n| Player footstep | Percussive |\n| Player jump | Quick rising whoosh |\n| Player landing | Short percussive thump, on completing a jump's arc |\n| Robot look/turn | Two-note \"bleep-bloop\", on every look-flip, patrol turn, chase direction change, and the chase \"thinks\" pause |\n| Robot move | Short buzzy blip, repeated periodically while actively moving (patrol, chase, or fleeing) |\n| Robot hit (player) | Harsh, low percussive/noise hit |\n| Search progress tick | Short blip, once per progress step |\n| Search completion | Celebratory major chord (ascending arpeggio: root, third, fifth, octave) |\n| Item pickup: health | Warm ascending tone |\n| Item pickup: letter | Twinkling chime, distinct from the health tone |\n| Win | Triumphant ascending run |\n| Loss | Descending buzz |\n\nThis game's SFX set is a distinct identity from games 1 and 3, not a reuse of their runs.\n\n## Tile / sprite visuals\n\nPalette reuses game 1's Atari-2600-approximation colour index list; see [DESIGN.md](DESIGN.md) for the per-element colour table.\n\n| Tile / sprite | Colour | Visual description |\n| ------------- | ------ | ------------------- |\n| Elevator car | Sky blue | Boxy car frame around the player, open on the side facing the shaft |\n| Corridor / room floor | Dark blue | Flat institutional floor and back wall |\n| Centre lift | Teal | Vertical platform strip, animates moving top to bottom |\n| Robot | 1 of 3 random skins: red/dark red legs/white lights, solid red/yellow lights, or purple/white lights | Inverted-U arch on two legs; direction lights blink and shift to whichever side matches its current travel/look direction |\n| Object (can, desk, vending machine, shelf) | Dark green, brown, or dark grey | Distinct 8\u00d78 silhouette per object type; each instance randomly picks 1 of 3 colour variants (same silhouette) |\n| Terminal | Light grey | Monitor-and-base silhouette, single fixed look (no colour variants, unlike the other 4 object kinds) |\n| Health pickup | Green | Cross/plus glyph, shown in the search progress bubble once searching starts |\n| Letter tile | Yellow | Yellow tile badge with the letter printed in black, shown in the search progress bubble once searching starts |\n| Clock | White | Circular clock-face glyph with hands, shown in the search progress bubble once searching starts |\n| Player | White | Stand, or animated sequences: run (4-frame, separate left/right), search (2-frame, direction-neutral), jump (4-frame flip, separate left/right) |\n| HUD text | White | Bottom two lines, over a black strip |\n| Help screen | Neon green text, light grey border | Full-screen black background with a bezel-style border frame, evoking a terminal display |\n", "design": "# 2 \u2014 Design\n\nTechnical design derived from the spec in [README.md](README.md), following [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md). Updated through Phase 6 (sprites, visual polish, and the fixes in [`../BUGS.md`](../BUGS.md)'s #2 section) to track the shipped cart rather than the original pre-implementation draft; [`CLAUDE.md`](CLAUDE.md)'s Architecture section still has the exhaustive as-built detail (line-level code behaviour, state variable table) where this document only needs the design decision.\n\n## Screen layout (128\u00d7128)\n\nTitle: the shared jam title card, drawn by `draw_title_card(\"#2 MISSION\")` from [`../lib/title.lua`](../lib/title.lua). No per-game layout to design here, games 1 and 3 already use the same card; see that file for the exact pixel layout.\n\nElevator shaft:\n\n```\ny=0\n  |  elevator shaft: narrow vertical column (x=56-71, 16px wide),\n  |  player walks left/right within it and up/down between floors,\n  |  but up/down only responds while standing inside that column\n  |  floors scroll past as the car moves, 24px per floor (16 floors,\n  |  384px total shaft height), auto-stopping only at floors with\n  |  a corridor (others are scrolled straight past)\n  |  a corridor is part of this same screen, not a separate one: on\n  |  a floor with one open, that side has no wall or concrete, just\n  |  blank background from the shaft column out to the screen edge\n  |  (x=0 or x=127), where a door frame sits. A floor with no\n  |  corridor on a side keeps the solid 4px wall + concrete backdrop\n  |  there instead. Walking through an edge door pauses ~300ms then\n  |  enters the room; leaving the room pauses the same on return\n  |\ny=111\ny=112   HUD line 1 (8px): timer (left), floor level (right)\ny=119\ny=120   HUD line 2 (8px): letters collected so far, e.g. \"LETTERS 4/10\"\ny=127\n```\n\nPuzzle room:\n\n```\ny=0\n  |  floor 1 (top): robots/objects along left and/or right side\ny=?\n  |  floor 2 (middle), centre lift shaft running top to bottom\ny=?\n  |  floor 3 (bottom), entry door where the player stands on arrival\ny=111\ny=112   HUD line 1 (8px): timer (left), floor level (right)\ny=119\ny=120   HUD line 2 (8px): letters collected so far, e.g. \"LETTERS 4/10\"\ny=127\n```\n\nFloor boundaries within a 3-floor room: even thirds of the 112px play area, ~37px per floor. HUD line layout follows this project's established bottom-strip convention (see [`1/CLAUDE.md`](../1/CLAUDE.md) and [`3/DESIGN.md`](../3/DESIGN.md)). The two HUD lines sit on their own dark-blue panel with a light-grey top border (rather than floating directly over the scene), with dim labels and brighter values so it reads as a UI layer distinct from the shaft/room behind it.\n\nControl room: a single screen showing one blank letter slot per letter of the secret word (10 slots, centred), the player's collected letters below for selection, and a \"confirm\" prompt. No 3-floor layout here, since it's a distinct puzzle-arrangement UI rather than a physical room.\n\n## Palette\n\nReuses game 1's Atari-2600-approximation colour indices (see [`../1/CLAUDE.md`](../1/CLAUDE.md)).\n\n| Element | Colour | Index |\n| ------- | ------ | ----- |\n| Background | Black | 0 |\n| Elevator car | Sky blue | 6 |\n| Corridor / room floor | Dark blue | 5 |\n| Centre lift | Teal | 12 |\n| Robot (skin 1) | Red body, dark red legs, white lights | 8, 13, 7 |\n| Robot (skin 2) | Red body, yellow lights | 8, 10 |\n| Robot (skin 3) | Purple body, white lights | 2, 7 |\n| Object (can, desk, vending machine, shelf) | Dark green, brown, or dark grey (1 of 3 picked at random per instance) | 3, 4, 5 |\n| Terminal | Light grey (single fixed look, no colour variants) | 6 |\n| Health pickup | Green | 11 |\n| Letter tile | Yellow badge, black letter | 10, 0 |\n| Clock | White | 7 |\n| Player | White | 7 |\n| Concrete backdrop speckle | Light grey and dark blue flecks, on a dark grey fill | 6, 1, 5 |\n| Corridor floor/ceiling line | Light grey | 6 |\n| Shaft exit light bar | Yellow | 10 |\n| HUD panel | Dark blue fill, light grey border, white/red text | 1, 6, 7, 8 |\n| \"Found: X\" letter popup | Black fill, white border/text, yellow tile | 0, 7, 10 |\n| Help screen | Black fill, light grey border, neon green text | 0, 6, 11 |\n\n## State machine\n\n| `gs` | Name | Entered from | Exits to |\n| ---- | ---- | ------------- | -------- |\n| 0 | Title | startup | 5 (any button) |\n| 5 | Intro | title, any button | 1 (~90 frames elapsed, or any button) |\n| 1 | Elevator shaft (corridors included) | the intro screen; walking back out of a room | 2 (walking through an edge door on a corridor floor) |\n| 2 | Puzzle room | the elevator shaft, through a floor's edge door | 1 (walking back out the entry door); 3 (reaching the control room) |\n| 3 | Control room | last valid puzzle room in the shaft | 4 (correct letter arrangement submitted, or timer/HP hits 0); stays in 3 on a wrong submission |\n| 4 | Game over | any state, on loss/win condition | 0 (any button) |\n\n`won` (bool) set when state 3 is exited via a correct letter arrangement rather than timer/HP hitting 0; the game-over screen branches on this flag, matching the pattern in [`3/DESIGN.md`](../3/DESIGN.md).\n\nA short (~9 frame / 300ms) input-frozen pause plays out on both sides of the shaft\u2194room crossing (`trans_t`, ticked down before any other `_update` logic runs, screen keeps rendering normally throughout). Elevator floor stops don't get this pause \u2014 only the shaft/room boundary does.\n\nState 5 (Intro) is a placeholder transition screen: plain black background, centred white text reading \"stay a while, solve a puzzle!\". It auto-advances to state 1 after ~90 frames (~3s) or on any button press, whichever comes first, calling `new_game()` at that point \u2014 the same call state 0's button press used to make directly before this state existed.\n\nThe help screen (see Terminal / help screen below) is a modal overlay rather than its own `gs` value: a boolean (`help_on`) checked first thing in both `_update()` and `_draw()`, so it can interrupt and later resume gameplay from state 2 (the only state a terminal search can be completed in) without needing a dedicated state or losing track of what to return to.\n\n## Core system design\n\n**Floor/room generation** \u2014 16 floors along the elevator shaft, each randomized (left corridor, right corridor, both, or neither) from a seed; a \"both\" floor produces two independent rooms, one per side. Re-roll the seed (generate-then-validate) until at least 10 floors resolve to a valid room. Puzzle rooms draw from 4 density patterns (light/medium/heavy robot and object placement per floor side, same 3-floor structure throughout); placement rules cap each floor side at 1 robot and 2 objects. Valid floors are spaced apart afterward: any two valid floors that land back-to-back get a blank floor inserted between them, as long as doing so doesn't drop the room count below the 10-room minimum the puzzle needs; usually there's 1 blank floor between valid ones, sometimes more (existing longer blank runs from the random roll aren't shortened), occasionally none where there isn't enough slack to spare.\n\n**Secret word & letter placement** \u2014 `words = {\"impossible\",\"infiltrate\",\"demolition\",\"electrical\",\"mechanical\"}`; pick one per seed (10 letters each, no length variance to handle). Assign one letter, in word order, to each of the first 10 valid rooms in shaft order. Any valid room beyond the 10th gets no letter; every object it generates holds a health pickup instead. If a letter-room's rolled object count is 0, one object is force-placed so the letter always has somewhere to live. The control room is placed behind the last valid room regardless of whether that room carries a letter.\n\n**Room persistence** \u2014 Each generated room's object/robot state is stored once (e.g. a table keyed by room id) and mutated in place; re-entering a room reads that same state rather than regenerating it, so searched objects stay empty and robots keep their position.\n\n**Shaft walking & corridors** \u2014 The shaft's car interior is narrow (16px), and the player walks left/right within it using the same movement input as everywhere else. A corridor is not a separate screen: on a floor with an open corridor, the walkable range on that side extends from the shaft column all the way to the screen's edge (x=0 or x=127), where the door is; a floor with no corridor on that side keeps the solid wall in place instead, blocking movement there. Direction stays consistent the whole way: walking left through a left-side door arrives in the room beside its right-hand wall (continuing left goes deeper); walking right through a right-side door arrives beside the room's left-hand wall (continuing right goes deeper). Leaving a room retraces the same path in reverse, back through the same door, ending at the shaft's edge.\n\n**Corridor & shaft rendering** \u2014 An open corridor's floor/ceiling lines are light grey (not the original navy, which was too close to the corridor's black fill to read); each floor's band gets a line at both its top and bottom edge, not just the top. The shaft column also gets a 2px yellow light bar on whichever side has an open corridor at that floor, positioned right at the column edge so it's visible from inside the narrow column, not only at the door frame out at the screen edge. The concrete backdrop on closed sides has a sparse light-grey/dark-blue speckle texture on top of its base fill and mortar lines, using a deterministic position hash rather than `rnd()` since it's redrawn every frame.\n\n**Elevator stops** \u2014 The car only auto-stops at floors where `floors[i]~=0`; from the current floor, the next stop in a given direction is found by scanning forward until a non-\"neither\" floor turns up, skipping over \"neither\" floors without pausing there (they're still scrolled past visually at the normal travel speed). If no more valid floors remain before the shaft's physical top or bottom, the car just can't go further in that direction \u2014 it never parks on a \"neither\" floor, even at the very ends of the shaft. Up/down input only moves the car while the player is standing inside the narrow shaft column (not out in an open corridor stretch); arriving at a new floor re-clamps the player's shaft-relative x to that floor's actual wall/corridor layout, in case it differs from the floor just left.\n\n**Search mechanic** \u2014 Holding up in front of an object advances a 10-step progress bar, roughly half a second per step (2 progress/frame, 300-unit threshold, so 150 frames total at 30fps; doubled from an initial 1 progress/frame pass that felt slow). A tick plays once per step; on completion, a celebratory major-chord arpeggio plays (distinct from the per-step tick) and the object's contents are applied: health or a clock add to HP/timer, a letter is added to inventory (also showing a brief \"found: X\" popup, 60 frames/~2s, with the yellow letter tile and the actual letter \u2014 silently adding it gave no feedback), or a terminal opens the help screen. Releasing up, walking away, or getting hit all pause the bar rather than resetting it (progress lives on the object itself), resuming from the same step next time the player holds up in front of it.\n\nContents are hidden until a search actually starts \u2014 reversed from an earlier decision (documented in `../BUGS.md` #2.7) to always show them; a play-test round found that always-visible contents let players skip objects on sight instead of checking them, undermining the point of having several object types to search. Once `sobj` is set (the player is actively searching), the corresponding icon (green cross, yellow letter tile, white clock face, or the terminal icon) shows in the progress bubble alongside the step count, so the player learns what an object holds only by committing to search it.\n\n**Object sprites** \u2014 Each of the 4 furniture kinds (can, desk, vending machine, shelf) rolls both its kind and an independent colour variant (1 of 3: dark green, brown, dark grey) at generation time, so instances of the same furniture type aren't all identically coloured. A 5th kind, the terminal, has a single fixed look (light grey, no variants) and is excluded from ever receiving a letter \u2014 the letter-placement roll only picks among non-terminal objects in the room, re-adding a plain object if a room somehow generated with none. Unlike the other 4 kinds, a terminal only ever rolls on the bottom floor, on whichever side is adjacent to the room's entry door (by decision, after a play-test found them appearing anywhere in the room, including far from where the player enters) \u2014 not guaranteed to appear at all, just restricted to that one slot when it does.\n\n**Clock item** \u2014 About 1 in 4 non-letter, non-terminal objects hold a clock instead of health (`rnd(100)<25`); searching one adds 60 seconds to the timer instead of restoring HP. No cap on how many clocks can appear in a run.\n\n**Terminal / help screen** \u2014 A terminal's contents are always item 4 (\"help\"), never re-rolled into health/clock/letter. It still takes the full 10 search steps (300 progress) like every other object, but each step is twice as fast (4 progress/frame instead of 2), so completion takes ~2.5s rather than ~5s \u2014 its payoff is a reference screen, not a resource worth the full wait, but the step count itself stays consistent with everything else (an earlier pass had halved the step count instead of the per-step speed, reaching completion in only 5 displayed steps; kept as a distinct visual pace instead). Completing it opens a full-screen help overlay \u2014 controls, the letter/win goal, and a short object legend \u2014 which freezes the game (timer, robots, everything) until dismissed. The overlay itself ignores all input for its first 3 seconds (a separate timer, `help_t`) before \"any button to dismiss\" becomes active, so it can't be closed before it's even had time to be read. Unlike every other object, a terminal is never marked found: its progress simply resets to 0 after opening the help screen, so it can be searched again later for the same cost, rather than being consumed like a one-time pickup. It's also the only object where releasing up early *cancels* rather than pauses: progress resets to 0 the moment focus is lost (release, walk away, floor change) before reaching 300, instead of holding at whatever step it reached \u2014 a half-charged terminal doesn't \"remember\" partial progress between attempts, unlike health/letter/clock objects.\n\nThe help screen itself is styled to read as a terminal display: a light-grey bezel-style border frame around the full black screen, with all text in neon green (colour 11) rather than the plain white used elsewhere.\n\n**Robot behaviour** \u2014 3 patterns per robot, chosen at placement time: stationary-look (random-interval left/right look), patrol (left/right at a set speed, random pause at each end), and chase (moves toward the player at a random speed when on the same floor; pauses for about 30 frames (\"thinks\"), then reverses if the player jumps over it; also pauses briefly whenever its required direction actually changes, e.g. the player crossing from one side to the other, instead of reversing on the same frame \u2014 matches patrol's existing pause-at-turn behaviour, which chase originally lacked). Every pattern is confined to the side of the floor the robot spawned on; none of them ever cross the centre lift gap, so a robot on one side is never a threat on the other unless the player crosses to it \u2014 this still applies on the bottom floor even though it's no longer a fall hazard for the player, a placement rule independent of that hazard. The per-side clamp accounts for the robot's 8px sprite width on both edges (not just the room's outer edge), so a robot can't visually hang off the screen or overlap into the gap by its sprite width; base movement speed is also tuned to about half its original value.\n\nSound cycle: every look/turn event (stationary's flip, patrol's turn, chase's direction change or \"thinks\" pause) plays a two-note \"bleep-bloop\"; actively moving (patrol, chase, or fleeing) plays a periodic buzz blip roughly every 8px of travel. Both share a single channel across every robot in the room (a jam-scope simplification \u2014 not true per-robot polyphony, so only the most recently triggered robot is audible if two overlap). The look/turn sound is capped at once per 3 seconds per robot \u2014 bug fix: a chasing robot converging on the player's exact position can overshoot by a fraction of a pixel every frame, flipping which side of the player it's nominally on each frame too, which re-triggered the direction-change branch (and its sound) every single frame for as long as that jitter lasted, reading as the sound getting \"stuck.\" The underlying direction-change logic still runs at full rate; only the sound itself is rate-limited.\n\nSprite: an inverted-U arch on two legs, in 1 of 3 random colour skins (red body/dark red legs/white lights; solid red body/yellow lights; or purple body/white lights \u2014 the third added after a play-test question revealed the first two, while nominally \"two skins,\" were both red-based and read as one colour at a glance); a pair of lights blinks and shifts to whichever side matches the robot's current facing/travel direction (the same `dir` value already driving the 3 patterns above), so the look/turn sound cue has a matching visual. Both the robot's and the player's collision boxes are inset 2px on every side (was: robot only, inset 1px \u2014 still triggered 2-4px before the sprites visually touched, since the player's own box was still the full 8x8 too), matching each entity's actual drawn silhouette more closely so standing next to a robot to search a nearby object doesn't trigger a hit from bounding-box padding alone.\n\n**Jump trigger** \u2014 Up always jumps, with three exceptions where up already has a job: moving the car while standing in its narrow column (a corridor is part of the same screen but not this column, so jumping works normally there), riding the centre lift, and searching a found object. Search wins whenever a found object is in front of the player and up is held; jump is what up does everywhere else. Direction follows whichever way the player is currently moving (left/right), or straight up if they're standing still.\n\n**Jump arc** \u2014 Fixed parabolic arc, not an instant hop: higher and slower than a minimal hop, so it reads as a deliberate, floaty leap rather than a twitch dodge. Horizontal reach must clear either hazard (a robot's 8px body, or the lift shaft's gap \u2014 which is exactly as wide as the lift platform itself, not narrower than it) with margin, not exactly match it \u2014 landing right on the edge of what you jumped over isn't \"cleared.\" The sprite steps through a 4-frame launch/tuck/extend/land sequence keyed to arc progress, drawn as separate left/right-facing art (not mirrored) and picked by the jump's horizontal direction.\n\n**Player sprite & animation** \u2014 Beyond the jump sequence above: a stand pose, a 4-frame run cycle (separate left/right-facing art, picked by a facing flag set wherever left/right input drives movement), and a 2-frame search reach loop (direction-neutral, driven by search progress rather than a separate timer). Authored via a small host-side tool (`tools/sprites/sprite_tool.py`) that renders 8x8 hex-grid sprite definitions as terminal glyph art or PNGs for review, then patches them into the cart's `__gfx__` section directly \u2014 `tools/sprites/` had no scripts before this game.\n\n**Lift shaft width** \u2014 The gap in the room floor where the centre lift travels is exactly as wide as the lift platform, so there's no visual mismatch between where the platform sits and where the floor actually opens up. On the top and middle floors, walking into that gap while the lift isn't there starts a fall (see Falling below). The bottom floor's gap is solid ground instead, drawn as a continuous line with no visual gap: there's nothing below it to fall to, so by decision it reads and behaves as ordinary walkable floor, not a hazard.\n\n**Lift dwell time** \u2014 The lift pauses briefly (~1s) each time it reaches one of the 3 floor-aligned positions before continuing, giving the player a real window to board it by walking in. Catching it with a jump works by height proximity to the lift's current position, not by checking whether it's paused at a floor stop, so a jump can also catch it while it's actively moving between floors.\n\n**Riding the lift** \u2014 Once aboard, the player moves and jumps exactly as they would on any floor or corridor: horizontal input isn't gated on the lift being aligned with a floor, walking off either edge lands on whichever floor the lift is currently nearest to, and jumping off it launches a normal jump arc from the lift's current height (which can then catch the lift again mid-air, or miss it and fall/land normally). (Superseded an earlier design where movement while riding only worked when the lift happened to be paused at a floor stop, making it unresponsive for most of its travel, and where jumping off it wasn't possible at all.)\n\n**Falling** \u2014 Walking or jumping into the lift shaft's gap while the lift isn't there, on the top or middle floor only, starts a real descent, not an instant penalty: normal left/right input still applies while falling, so momentum can carry the player sideways out of the gap column entirely, landing safely on whichever floor's band the fall has reached by then. Catching the lift at its current position mid-descent also lands safely, whether or not it's paused at a floor. Only reaching the bottom floor's ground while still falling costs HP, landing the player there in place rather than respawning them at the room's entry door \u2014 scaled to how far they fell (1 HP from the middle floor, 2 HP from the top), not a flat amount, since a 1-floor slip and a full 2-floor plunge shouldn't cost the same. Either way, the same ~45-frame invulnerability window a robot hit gives applies. (Superseded two earlier designs in turn: first an instant-fail where a single pixel crossing the gap boundary immediately failed with no chance to recover, then a flat-3-HP/reset-to-entry-door fall that didn't distinguish 1-floor slips from 2-floor plunges and treated the bottom floor as another fall hazard rather than solid ground.)\n\n**Collision** \u2014 Player vs. robot: 1 HP loss plus a small knockback (a few px away from the robot) and a brief invulnerability window (~45 frames) before it can hit again; the robot's own hit box is inset 1px per side (see Robot behaviour above). Player vs. lift shaft void: see Falling above. Wrong letter-arrangement submission in the control room: 1 HP loss, no retry limit.\n\n**Puzzle-solving UI** \u2014 Control room renders one blank slot per letter of the secret word plus the player's collected letters below; directional input cycles the highlighted slot and selects which collected letter fills it, a confirm button checks the full arrangement against the target word.\n\n## Difficulty ramp\n\nRobot speed and density scale with rooms found, similar in spirit to game 3's `spd` formula: `robot_spd = base_spd + base_spd * (rooms_found / 10)`, capped at `rooms_found = 10` so the ramp maxes out once the secret word is complete rather than continuing to scale in bonus rooms.\n\n## Score\n\n`score = 100 * letters_collected + 2 * seconds_remaining` on a win; `0` on a loss. Shown on the game-over screen.\n\n## Timer\n\nStarts at 300 seconds (5 minutes, `timer = 9000` frames at 30fps), counts down continuously across the elevator shaft and all rooms, never resets. Game over on reaching 0.\n\n## Token budget\n\nThis design carries more concurrent state than games 1 or 3: per-room robot AI (3 behaviour variants), a search progress-bar timer, a 3-floor room layout, a seeded floor/puzzle generator that must validate solvability, persisted per-room state across revisits, and an ambient music loop for the elevator shaft. Lean on [`../lib/CLAUDE.md`](../lib/CLAUDE.md) for input handling, the state machine, the title screen (`draw_title_card`), and seeded RNG rather than rederiving them; the robot behaviour table is a good candidate for a flat array indexed by pattern id rather than per-pattern branching code. The 5-word list and per-room state table are the two new memory costs this game has that 1 and 3 didn't.\n", "plan": "# Plan\n\nPhased implementation checklist for `2.p8`, based on [README.md](README.md) and [DESIGN.md](DESIGN.md). Phases 1\u20135 are built, including the corridor rework (corridors merged into the elevator screen, replacing an earlier separate-screen misreading of the spec). Phases 6\u20137 are pending. Design is finalized, no open questions remain blocking any phase.\n\n## Phase 1: Elevator shaft & floor generation\n\n- [x] Elevator car moves up/down, clamped to shaft bounds\n- [x] 16 floors generated from a seed: left corridor, right corridor, both (two independent rooms), or neither; re-roll until at least 10 floors resolve to a valid room\n- [x] Valid floors are spaced apart with a blank floor between them wherever the roll leaves enough room-count slack above the 10-room minimum to spare (bug fix: the original per-floor independent roll had no spacing bias, so back-to-back valid floors were common); pre-existing runs of 2+ blank floors are left alone, so spacing is usually 1 blank, sometimes more, never at the cost of dropping below the minimum room count the puzzle needs\n- [x] Elevator hum/buzz sound while moving (ambient music loop deferred to Phase 6; `__music__` patterns need Pico-8's built-in tracker, not hand-typed hex)\n- [x] Shaft is narrow (16px); player walks left/right within it\n- [x] Elevator only auto-stops at floors with a corridor (`next_stop` scans past \"neither\" floors; can't park on one even at the shaft's physical top/bottom); up/down input only responds while standing inside the narrow shaft column; arriving at a new floor re-clamps the player's position (`shaft_bounds`) to that floor's actual layout\n- [x] Corridors are not a separate screen \u2014 a corridor floor's walkable area (`shaft_bounds`) extends from the shaft column straight out to that screen edge (x=0 or x=120), where the door is drawn (x=0-3 or x=124-127); a \"neither\" side there keeps the solid wall + concrete. (An earlier build made the corridor its own screen; that was a misreading of the spec, not the intended design \u2014 the \"blank room with nothing in it\" report was this screen, not a broken room.)\n- [ ] Verify (manual play-test): same seed produces the same floor layout; elevator skips \"neither\" floors without stopping; player is visible standing in the car; walking off the shaft column on a corridor floor reaches the room's door at the screen edge\n\n## Phase 2: Rooms, objects & search\n\n- [x] Walking through a corridor floor's edge door loads the room on the other side, player spawning beside the entry door on the room's bottom floor. Direction stays consistent throughout: entering left keeps going left, arriving beside the room's right wall; entering right keeps going right, arriving beside its left wall. Leaving retraces the same door in reverse, back to the shaft\n- [x] ~300ms input-frozen pause (`trans_t`, 9 frames) on both sides of the shaft\u2194room crossing, screen still rendering throughout; door SFX plays at that same crossing, both directions\n- [x] Room layout: 3 floors (even thirds, ~37px each), centre lift moving automatically top to bottom, pausing ~1s at each floor-aligned position (bug fix, post-Phase 5: it originally never paused, giving only an incidental few-frame window to board); rideable (board when it's aligned with your floor, ride it, disembark when aligned with another; crossing when misaligned falls into the void for 3 HP and a respawn at the room's entry door; jumping can also catch the lift mid-flight if it's aligned when the arc crosses the gap \u2014 another bug fix, since a directed jump's reach otherwise always overshot the 12px platform, making it impossible to land on)\n- [x] Objects placed per floor side (max 2), from the 4 object types, per one of 4 density patterns\n- [x] Room state persists across revisits: searched objects stay empty; robots keep their position and pattern state too (Phase 3)\n- [x] Search mechanic: holding up in front of an object raises the player's hands, shows a progress readout (0\u201310, ~1s/step), yields contents on completion; releasing up pauses rather than resets; a robot hit (Phase 3) also just pauses it, same mechanism\n- [x] Object contents: health pickup (+2 HP) or a puzzle letter, one per first-10 valid rooms in shaft order\n- [ ] Verify (manual play-test): search completes in ~10 seconds, object then stops being searchable, inventory/HP updates correctly; leaving and re-entering a room preserves its state; rooms reached via a corridor floor actually have their objects (confirming the earlier \"empty room\" report was the stray corridor screen, not this)\n\n## Phase 3: Robots\n\n- [x] Jump: fixed parabolic arc (`jumping`/`jt`/`jT`/`jh`/`jdir`/`jy0`), triggered by `btnp(2)` (up) except while standing in the elevator car's narrow column, riding the centre lift, or searching a found object \u2014 those three are up's other jobs and take priority; a corridor is part of the elevator-shaft screen but not that column, so jumping works there too (a follow-up fix \u2014 the first pass had left corridors with no jump handling at all, silently falling through to a no-op). 24 frames, ~18px peak height, ~19px horizontal: deliberately higher/slower/wider than a minimal hop, clearing an 8px robot or the lift shaft's gap with margin rather than exactly (spec gap resolved after Phase 3's first pass, which under-scoped this to a bare 8px/16-frame hop). Also replaces Phase 2's \"wait for the lift\" blocking behaviour at the gap: walking into a misaligned lift shaft costs 3 HP and falls into the void (`fall_void()`), while jumping normally clears it safely (the jump branch bypasses the fall check for the whole arc, only checking the landing spot). The room's lift shaft gap (`liftx0`/`liftx1`, 58-69) is now exactly as wide as the lift platform itself \u2014 a follow-up fix; the first pass had widened the platform to 12px without widening the underlying blank-floor gap or the fall-through/board collision column to match, leaving an 8px functional gap under a 12px visual platform. Bug fix (post-Phase 5): the void hazard originally only applied on floors 0-1 (dropping one floor for 3 HP) and was silently *blocked* on the bottom floor instead of being a hazard there too, and jump could never trigger it at all even in the edge case of landing back inside the gap column; `fall_void()` now applies uniformly on any floor (walking in, or landing a jump in), always resetting the player to the room's entry door rather than dropping one floor, since there's no meaningful \"floor below\" distinction once every floor risks the same void\n- [x] Stationary pattern (`pat==1`): random-interval left/right look (`r.dir` flips every 30-90 frames). Beep-on-look SFX deferred to Phase 6 alongside the rest of this game's SFX identity \u2014 not wired up yet, only the visual look-flip\n- [x] Patrol pattern (`pat==2`): left/right movement between `r.x0`/`r.x1` (its side's floor span), random pause (15-45 frames) at each end\n- [x] Chase pattern (`pat==3`): moves toward the player when `r.fl==rfl`; on overlap while the player is jumping, pauses 30 frames then flees the player's position for 20 frames before resuming the chase\n- [x] All 3 patterns are confined to their spawn side of the room, never crossing the centre lift gap (fixed after the initial Phase 3 pass, which only confined patrol; chase/flee could walk straight across since their movement wasn't clamped to a side)\n- [x] Placement rule: max 1 robot per floor side, rolled per side at generation time (`robp` probability table, indexed by the room's existing density pattern so heavier rooms get both more objects and more robots)\n- [x] Player/robot collision (`hit_check()`): 1 HP loss, small knockback (6px away from the robot), 45-frame invulnerability (`invt`, also gates the lift-fall hazard so a fall can't immediately cascade through multiple floors); player sprite flickers while invulnerable\n- [x] Difficulty ramp: `rmul()` returns `1 + min(nvisited,10)/10`, applied to `r.spd` every frame a robot moves (patrol and chase); `nvisited` increments the first time each room is entered, capped at 10. Density itself is NOT re-scaled live by rooms found \u2014 rooms are still all generated upfront in `gen_floors()`, before any room has been visited, so each room's density pattern (1-4, chosen at generation) is the only density lever; this is a deliberate scope call against DESIGN.md's prose (which reads as speed+density), following the DESIGN.md formula (speed only) as the more precise source\n- [ ] Verify (manual play-test): each pattern behaves distinctly; a chasing robot correctly pauses then flees when jumped; robots visibly speed up as more rooms are visited; jumping clears the lift gap safely on the top and middle floors; walking into a misaligned gap without jumping starts a real fall there (not an instant hit), landing safely if drifted sideways or onto the lift, otherwise costing 1-2 HP (scaled to floors fallen) and landing at the bottom in place; the bottom floor itself is solid and always walkable, no fall risk there at all (superseded this checklist's original wording of a flat 3 HP/every-floor hazard, see BUGS.md #2.1 and #2.8)\n\n## Phase 4: Puzzle & win condition\n\n- [x] Secret word picked per seed from the 5-word list (`impossible`, `infiltrate`, `demolition`, `electrical`, `mechanical`); one letter assigned per first-10 valid rooms in shaft order\n- [x] Puzzle solvability validated at generation time (word length and room count always line up), not just hoped for \u2014 `wlen` (derived from `words[1]`'s length, not a hardcoded `10`) drives both the `nrooms>=wlen` generation-retry threshold and the `idx<=wlen` letter-assignment cutoff, so the two can't drift apart even if the word list changes later\n- [x] Control room reachable from the last valid room in the shaft \u2014 `enter_control()`, triggered by reaching the deep wall (opposite the entry door) of the room whose index equals `nrooms`\n- [x] Control room UI: blank slot per letter, player arranges collected letters, submits\n- [x] Win: correct arrangement submitted. Wrong arrangement: 1 HP loss, stays in control room, unlimited retries. Loss: timer (starts 300s/9000 frames, never resets) reaches 0, or lift fall (1-2 HP, scaled to floors fallen \u2014 a flat 3 HP as of this Phase 4 entry, since revised, see Phase 6/BUGS.md #2.8) / robot hits (1 HP) bring HP to 0\n- [ ] Verify (manual play-test): a generated seed is always solvable; both win and loss paths are reachable; a wrong submission costs HP but doesn't end the run; the control room's deep wall is only reachable behind the true last room, not any letter room\n\n## Phase 5: Screens & flow\n\n- [x] Title screen: call the shared `draw_title_card(\"#2 MISSION\")` from [`../lib/title.lua`](../lib/title.lua) (colour-swatch strip, \"'26 WARPED GAME JAM\", \"#2 MISSION\", blinking start prompt) \u2014 already built since Phase 1 (this checkbox was stale, not a Phase 5 gap)\n- [x] Room enter/exit fade transitions; game start/end flash \u2014 `draw_overlay()` renders a shrinking black iris (top/bottom bars) over `trans_t`'s existing 9-frame window for shaft\u2194room/control-room crossings, and a brief white `flash_t` pop for game start (`new_game()`) and end (win in `update_control()`, loss in `_update()`). A deliberate scope call: single-phase reveal-only, not a true fade-out-then-fade-in crossfade (the state already switches the instant a transition starts, and a real palette-based crossfade would cost meaningfully more tokens for a jam-scope visual) \u2014 see CLAUDE.md\n- [x] Game over screen: win/loss headline, final score (`100 * letters_collected + 2 * seconds_remaining`, 0 on loss) \u2014 `draw_gameover()` now has a colour band (green/red) behind the headline instead of Phase 4's plain text stub; win/loss/score logic is unchanged from Phase 4\n- [x] HUD: line 1 timer + floor level, line 2 letters collected (e.g. \"LETTERS 4/10\") \u2014 `draw_hud()`, shared by the shaft and room screens, replacing the temporary debug HUD (seed/floor/room-count). HP has no dedicated slot in DESIGN.md's 2-line layout, so it's folded onto the letters line rather than dropped; the control room keeps its own separate hp/time display (DESIGN.md treats it as a distinct UI, not the standard room HUD)\n- [ ] Verify (manual play-test): full loop is playable start to finish, title \u2192 shaft \u2192 rooms \u2192 control room \u2192 game over \u2192 title; fades/flashes read correctly at each transition; HUD values (timer, floor, letters, hp) are all readable and correct in both the shaft and room screens\n\n## Phase 6: Visuals & sound polish\n\n- [ ] Apply palette (reused from game 1's colour indices; see DESIGN.md's table)\n- [x] Player stand pose (sprite 0), patched in and wired into both the shaft and room draw calls, replacing the placeholder `rectfill` square\n- [x] Player run animation: 4-frame leg/arm cycle, separate left-facing and right-facing sequences (not mirrored) \u2014 sprites 1-4 (right), 5-8 (left). New `pdir` facing state (0=right,1=left) set on `btn(0)`/`btn(1)` in both room and shaft/corridor movement; new `pft` timer increments while moving (reset to 0 when idle), frame picked via `flr(pft/6)%4`\n- [x] Player jump animation: 4-frame flip (launch/tuck/extend/land), separate left/right sequences \u2014 sprites 9-12 (right), 13-16 (left). Frame picked directly from existing `jt`/`jT` arc progress (`flr(jt/(jT/4))`, clamped to 3), using `jdir` to pick the sequence (straight-up jumps default to the right-facing one)\n- [x] Player search animation: 2-frame reach loop, direction-neutral, shown facing whichever way the player last moved \u2014 sprites 17-18. Frame picked from `sobj.prog` (`flr(prog/15)%2`), driven by existing search-progress state rather than a new timer\n- [x] Authored via a new host-side tool, `tools/sprites/sprite_tool.py` (`ascii`/`preview`/`patch` subcommands \u2014 glyph-grid terminal preview, PNG preview, and direct `__gfx__` patching into a cart), since `tools/sprites/` was an empty scaffold before this\n- [x] Robot sprite: inverted-U arch on two legs (red body, dark red legs, white direction lights), replacing the placeholder `rectfill`+`pset` \u2014 sprites 19 (lights off), 20 (lit left), 21 (lit right). Lights blink via the shared `blink(4)` helper and pick a side from the existing `r.dir` (already the \"facing/travel direction\" value across all 3 movement patterns, so no new robot state was needed)\n- [x] Furniture sprites: 4 kinds (can/desk/vending machine/shelf) x 3 colour variants (dark green/brown/dark grey), same silhouette per kind \u2014 sprites 22-33 (`22+(kind-1)*3+(variant-1)`), replacing the flat `rectfill` placeholder in `draw_obj()`. New `variant` field (1-3, rolled alongside `kind` at generation time) added to every object in `gen_room()`\n- [x] Health pickup glyph (green cross/plus, sprite 34) wired into `draw_obj()`, always shown on health objects \u2014 resolves BUGS.md #2.7 by decision: content hints are intentionally always visible, not revealed on completion\n- [x] Letter tile: yellow badge sprite (35) drawn behind the letter, printed in black for contrast (previously plain yellow-on-furniture), always shown same as the health cross\n- [x] Second robot skin (solid red body, yellow lights, sprites 36-38) added alongside the original two-tone one, picked at random per robot via a new `skin` field \u2014 resolves BUGS.md #2.6\n- [x] HUD given its own dark-blue panel with a top border, dim labels vs. brighter values \u2014 resolves BUGS.md #2.2\n- [x] Concrete backdrop given sparse speckle texture (deterministic hash, not `rnd()`) \u2014 resolves BUGS.md #2.4\n- [x] Placeholder transition screen (\"stay a while, solve a puzzle!\"), new `gs=5`, between title and `new_game()` \u2014 resolves BUGS.md #2.5\n- [x] Lift-shaft fall redesigned from an instant fail into a real descent (new `falling` state): sideways drift can land safely on a lower floor or catch the lift mid-transit; only reaching the bottom of the room still costs HP \u2014 resolves BUGS.md #2.1. DESIGN.md updated to match (Palette, State machine, and Core system design sections all brought current, rather than left to drift as historical record)\n- [x] Corridor floor/ceiling lines recoloured (navy-on-black was imperceptible) to light grey, drawn at both top and bottom of each floor's band; shaft column now also gets a yellow light bar marking the exitable side \u2014 resolves BUGS.md #2.3\n- [x] Bottom floor made solid ground (continuous ground line, fall trigger skipped at `rfl==2`); fall damage now scales with floors fallen (2 HP from the top, 1 from the middle) and lands the player in place rather than resetting to the entry door \u2014 resolves BUGS.md #2.8\n- [x] Robot hit box inset 1px per side to match its drawn silhouette more closely \u2014 resolves BUGS.md #2.9. Insufficient on its own (see #2.21 on-terminal objects roll as a clock \u2014 resolves BUGS.md #2.23\n- [x] Terminal item added: a 5th object kind (sprite 43, single fixed look, no colour variants), always item 4 (\"help\"), excluded from letter placement. Searching one opens a full-screen help overlay (controls, letter/win goal, object legend) that freezes the game until dismissed; unlike every other object it's never marked found, so it can be searched again \u2014 resolves BUGS.md #2.24\n- [x] Object content reveal reversed back to hidden-until-searched: `draw_obj()` no longer shows a permanent content hint (superseding #2.7's \"always visible\" decision), the icon now only appears in the search progress bubble once actively searching \u2014 resolves BUGS.md #2.25\n- [x] Terminal tuning: opens after 5 search steps instead of 10 (superseded, see below), releasing early cancels rather than pauses (unique to terminals, still true), and the help screen now has a bezel border + neon-green text to read as an actual terminal display \u2014 resolves BUGS.md #2.26\n- [x] Terminal placement restricted to the bottom floor's door-adjacent side (`gen_room()` now takes `entry_side`) \u2014 resolves BUGS.md #2.27\n- [x] Terminal step count reverted to the standard 10 (300 progress), but each step doubled to 2x speed (`prog+=4` vs. the normal `+=2`) \u2014 supersedes the 5-step version from #2.26, resolves BUGS.md #2.28. Tick-sound check changed from an exact `%30==0` match to a step-boundary crossing check, since a 4-wide stride doesn't evenly divide 30\n- [x] Help screen ignores input for its first 3 seconds (`help_t=90`) before it can be dismissed \u2014 resolves BUGS.md #2.29\n- [x] Robot look/turn sound (slot 7) capped at once per 3s per robot (`r.st` cooldown via `look_sfx()`) \u2014 fixes it getting \"stuck\" repeating when a chasing robot jitters right at the player's position \u2014 resolves BUGS.md #2.30\n- [ ] Ambient music loop for the elevator shaft, authored in Pico-8's built-in tracker (`__music__` pattern referencing 2-3 pad-note sfx slots), silent elsewhere\n- [ ] Verify: play a full round with sound on; confirm every listed SFX fires at its correct trigger\n\n## Phase 7: Token & performance check\n\n- [ ] Confirm final token count is within the ~8,192 budget\n- [ ] Confirm a room with 3 floors, a moving lift, up to 2 robots per side, and HUD renders without frame drops\n", "claude": "# CLAUDE.md\n\nThis file provides guidance to Claude Code (claude.ai/code) when working with code in this repository.\n\n## Project\n\nA Pico-8 game called \"2 Mission\" \u2014 an action/platform/puzzle game with Atari 2600 aesthetics, a vastly simplified remake of Impossible Mission (Epyx, 1984). The full spec is in [README.md](README.md), following [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md).\n\n**Status: in progress.** `2.p8` implements Phases 1\u20135 of [PLAN.md](PLAN.md): elevator shaft, floor generation (including corridors merged into the shaft screen, and the elevator only stopping at corridor floors), rooms, objects, search, jump, the lift-fall hazard, robots, the control room puzzle, win/loss/timer/score logic, screen-transition fades/flashes, a polished game-over screen, and the real bottom-strip HUD. Visual/sound polish (Phase 6: sprites, SFX, ambient music) and the token/performance check (Phase 7) aren't built yet \u2014 keep following README.md and [DESIGN.md](DESIGN.md) for those.\n\n## Development\n\nPico-8 has no build system, package manager, linter, or test runner. The workflow is:\n\n- Edit the `.p8` file in an external editor or inside Pico-8's built-in editor\n- Run with `pico8 -run 2.p8` (requires Pico-8 installed)\n- Or open Pico-8, then `load 2.p8` and press Ctrl+R to run\n\nVerification is manual: load the cart and play it.\n\n## Pico-8 Constraints\n\nThese constraints shape every implementation decision:\n\n- **Token limit**: ~8,192 tokens total; code is compressed and must be counted aggressively\n- **Display**: 128\u00d7128 pixels, 16-colour palette\n- **Sprites**: 8\u00d78 pixels each, 256 slots in the sprite sheet\n- **Map**: 128\u00d764 cells, shared memory with the bottom half of the sprite sheet\n- **Sound**: 64 SFX slots, 4 channels\n- **Lua variant**: Pico-8 Lua omits parts of the standard library; no `string.format`, use `tostr()`, `tonum()`, `sub()`, `#str`, `add()` for tables\n\n## Design summary (from README.md and DESIGN.md)\n\n- Player rides an elevator between 16 randomized floors (auto-stopping at each), then explores corridor-linked puzzle rooms (3 floors, centre lift, robots, searchable objects); a \"both\" floor leads to two independent rooms\n- Robots have 3 behaviour patterns: stationary-look, patrol, chase (see DESIGN.md's Core system design); speed/density ramp up with rooms found\n- Searching an object fills a 10-step progress bar (~1s/step, pausing rather than resetting if the player is hit) and yields +2 HP or a puzzle letter; one letter is guaranteed per each of the first 10 valid rooms, spelling a 10-letter secret word picked per seed from a 5-word list\n- Win: submit the correct letter arrangement in the control room (behind the shaft's last valid room). Loss: timer (300s) reaches 0, or HP (starts at 5; robot hit \u22121, fall \u22123, wrong submission \u22121) reaches 0\n- All values are finalized in README.md and DESIGN.md (health/damage amounts, timer, palette, SFX, score formula); implement from those directly rather than re-deriving them\n\n## Architecture (Phases 1\u20135)\n\n`2.p8` implements the standard Pico-8 callback structure with the title screen, elevator shaft (corridors included), puzzle rooms, the control room, and game over all built:\n\n```lua\n_init()   -- gs=0 (title), trans_t=0, flash_t=0\n_update() -- flash_t tick (always); title input; gs=4 input; timer tick + loss check;\n          -- update_control() (gs==3); update_room() (gs==2); elevator move/auto-stop/wall-walk (gs==1)\n_draw()   -- title card; draw_gameover() (gs==4); draw_control() (gs==3);\n          -- draw_room() (gs==2); shaft scroll + rendering (gs==1); draw_overlay() after every branch\n```\n\n`gs` values: 0=title, 1=elevator shaft, 2=puzzle room, 3=control room, 4=game over.\n\n**Floor/room generation** \u2014 `gen_floors()` seeds `lseed=flr(rnd(32767))`, `srand(lseed)`, then rolls `floors[i]` (1\u201316) as 0=neither, 1=left, 2=right, 3=both (both = 2 independent rooms toward the total). Re-rolls the seed until `nrooms>=wlen`, capped at 50 tries as a safety net (expected rooms per 16 floors is well above 10, so this practically always resolves on the first try). `wlen=#words[1]` (all 5 words are 10 letters, so any of them works as the canonical length) drives both this threshold and the `idx<=wlen` letter-assignment cutoff later in the same function \u2014 deriving both from the same value, rather than hardcoding `10` in two places, is what makes solvability (room count always covers the word length) structurally guaranteed instead of just true by coincidence.\n\n**Floor spacing (bug fix)** \u2014 The independent per-floor roll above has no spacing awareness, so back-to-back valid floors were common (each floor is independently ~75% likely to be valid). A second pass after the roll walks `floors[2..nf]` and blanks out the second floor of any back-to-back valid pair, but only while `slack` (`nrooms-wlen`, the room count generated above and beyond the puzzle's actual minimum) can absorb the loss \u2014 `rc` (1 or 2, matching that floor's room count) is deducted from both `slack` and `nrooms` each time a floor gets blanked, so this can never drop the shaft below the room count the puzzle needs. Since a typical roll's expected `nrooms` is well above `wlen` (each floor independently averages ~1 room, so ~16 across the shaft against a floor of 10), there's usually enough slack to break up most or all clusters. Pre-existing runs of 2+ blank floors from the original roll are left untouched \u2014 this pass only ever adds gaps, it doesn't trim existing ones \u2014 which is where \"sometimes more than 1 blank floor\" comes from.\n\n**Elevator vertical movement** \u2014 `cy` is the car's continuous world y; `cfloor`/`targety` track the discrete floor and its target y. Holding up/down (`btn(2)`/`btn(3)`) only responds while `spx` is within the narrow column (`carl` to `carr-7` \u2014 see Shaft walking); it calls `next_stop(dir)` rather than just `cfloor+dir`, so the car skips over \"neither\" floors and only ever targets one with a corridor. `next_stop` scans floor-by-floor in the given direction until it finds one where `floors[i]~=0`, or runs off the shaft's physical end (in which case the car just doesn't move \u2014 it can never park on a \"neither\" floor, even at floor 1 or 16). Arrival (`cy==targety`) snaps `moving=false` and re-clamps `spx` via `shaft_bounds()`, in case the new floor's corridor layout differs from the one just left.\n\n**Shaft walking & corridors (merged into the shaft screen)** \u2014 `spx` is the player's x within the shaft screen, normally clamped to the narrow 16px column (`carl`=56 to `carr`=71), but `shaft_bounds()` extends that range out to the screen edge (0 or 120) on whichever side the current floor (`floors[cfloor]`) has an open corridor. There's no separate corridor screen: walking off the narrow column into an open side just keeps going, using the same `spx` movement, until it reaches `spx<=0` (left) or `spx>=120` (right), which calls `enter_room()`. A side with no corridor keeps `shaft_bounds()` clamped at the column edge, so movement just stops there (blocked, matching the solid wall drawn that side).\n\n**Camera** \u2014 `camy=mid(0,cy-44,maxcamy)` centres the car vertically and clamps to the shaft's total height (`nf*fh`) minus the 112px playfield, so the view never scrolls past the top or bottom floor.\n\n**Rendering** \u2014 `carl`/`carr` bound the shaft's interior column, where the car (`rectfill`+`rect` outline, sky blue/white) travels, with the player sprite (`pspr()`, see Player
