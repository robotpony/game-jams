sprite below) drawn at `spx` on top of it. Per floor, each side independently renders one of two looks: a closed side gets the solid `wt`-thick navy wall plus, beyond it, `draw_concrete()`'s grey coursed-mortar-and-speckle backdrop (drawn once for the full shaft height, before the per-floor loop); an open-corridor side instead gets that whole span (from the shaft column to the screen edge) painted blank/black, overwriting the concrete there, with a thin white door frame at the true screen edge (x=0-3 or x=124-127), a light-grey floor/ceiling line at both the top and bottom edge of that floor's band (colour 6; bug fix \u2014 these were originally colour 1, the same near-black navy as the wall/concrete, so they were technically drawn but not perceptible against the black corridor fill), and a 2px yellow light bar at the shaft-column edge (`carl-2` to `carl-1`, or `carr+1` to `carr+2`) marking that side as exitable, visible from inside the narrow column itself rather than only at the far screen edge. Furniture/robot/player sprites are real art (Phase 6); the shaft/room backdrop itself (walls, floor lines, the lift platform) is still flat rects, not sprites. The shaft's original debug HUD (seed, current floor, room count) is gone, replaced by `draw_hud()` (see below); `lseed` is still a global if it's ever needed from the Pico-8 console, it's just not printed to screen anymore.\n\n**Room/object generation** \u2014 `gen_floors()` also builds, per seed: `word` (one of the 5-word list), and `rooms` (array indexed 1..nrooms, one entry per valid corridor in shaft order \u2014 a \"both\" floor adds its left room before its right). `roomL[i]`/`roomR[i]` map a shaft floor back to its room index, and each call also passes a fixed `entry_side` (0 for `roomL`, 1 for `roomR` \u2014 matching what `enter_room()` will always use for that room, since a given room is only ever reached from the one corridor it's attached to). `gen_room(letter,entry_side)` rolls one of 4 density patterns (`objp` thresholds) and places 0-2 objects per of the room's 6 floor-sides (3 floors \u00d7 left/right of the lift); if `letter` is non-nil (room index <=wlen) it's assigned to one random object in the room, chosen only from non-terminal objects (`kind~=5`), force-adding one plain object first if the room has none eligible. Every object's `kind` (1-5) and `item` (1=health, 2=letter, 3=clock, 4=terminal/help) roll independently: `kind==5` (terminal) always forces `item=4`; otherwise `item` is a 25/75 roll between clock and health. `kind` itself only ever includes 5 (terminal) on the bottom floor's `door_side=1-entry_side` slot (`near_door`, computed once per floor-side loop) \u2014 bug fix, post-Phase 6: terminals originally could roll anywhere in the room, including far from where the player actually enters; `entry_side` exists specifically to let generation know which side that is. Nothing is ever truly empty, and nothing (other than a terminal) is ever without a tangible payoff.\n\n**Room persistence** \u2014 `rooms[idx]` is generated once in `gen_floors()` and never regenerated; `enter_room()` just points `cur_room` at the existing table (and `cur_idx` at its index, for the exit call), so `obj.found`/`obj.prog` mutations from a previous visit are still there.\n\n**Room entry/exit side** \u2014 `enter_room(idx,side)` spawns the player at `px=116` for `side==0` (left corridor: the room is to the shaft's left, so the player arrived walking left and is now beside the room's *right* wall, continuing left to go deeper) or `px=4` for `side==1` (mirror image). Exiting reverses this: `entry_side==0` requires walking right off `px>=120` (deeper is left, so leaving means backtracking right), `entry_side==1` requires walking left off `px<=0`. Either sets `gs=1` directly (no intermediate screen) and places `spx` at the matching shaft edge (0 or 120) to resume from.\n\n**Transition pause** \u2014 `trans_t` (frames remaining) is checked first thing in `_update()`; while positive it just decrements and returns, freezing all game logic for that many frames while `_draw()` keeps rendering the new screen normally. Set to 9 (~300ms at 30fps) by `enter_room()` and by the room's exit code, so both directions of the shaft\u2194room crossing pause briefly on arrival. Elevator floor stops don't set it.\n\n**Door SFX** \u2014 Plays once per shaft\u2194room crossing, both directions: inside `enter_room()`, and inside the room's exit-check right before `gs=1`.\n\n**Centre lift (rideable)** \u2014 `lifty` bounces between `topy`/`boty` (the top and bottom floor's stand-level, `liftys[]`) at `liftspd` px/frame, pausing for `liftpause` (30 frames, ~1s) whenever it reaches any of the 3 floor-aligned y values (`topy`, `boty`, or the middle floor's `liftys[2]`, checked in `update_room()`'s first block, before anything else runs each frame). `lift_near(fl)` checks alignment within `liftt` px (8) against a specific floor's stop position; walking into the lift's column while `lift_near(rfl)` boards it (`ronlift=true`, `py` tracks `lifty` every frame).\n\nWhile riding (`ronlift`), movement and jumping now work exactly like standing on any floor or corridor \u2014 bug fix, post-Phase 6: disembarking used to require directional input while `lift_near` was true for *some* floor (`lift_near(0) or lift_near(1) or lift_near(2)`), which meant the lift was completely unresponsive to input whenever it was mid-transit between stops, and jumping was impossible while riding at all. Now: horizontal input always moves `px` (with `pft`/`pdir` tracked the same as normal walking, so the run animation and footstep SFX both work while riding); walking off either edge of the lift's column (`liftx0`/`liftx1`) disembarks regardless of the lift's current alignment, snapping to `nearest_floor(lifty)`. `btnp(2)` launches a normal jump from the lift's current height (`jy0=py`, `rfl=nearest_floor(jy0)` so the landing/fall-gating logic downstream has a sensible floor reference), letting the player jump off it deliberately rather than only being able to walk off. Catching the lift again mid-arc (in the `jumping` branch) now checks height proximity (`abs(py-lifty)<=4`) instead of `lift_near(rfl)` \u2014 a floor-stop check \u2014 so a jump can catch the lift whether it's paused or actively moving, and can just as easily miss it if it's elsewhere, falling/landing per the usual jump logic.\n\n**Jumping onto the lift (bug fix)** \u2014 Landing a jump used to only ever check the gap column at the fixed end of the 24-frame arc (`jt>=jT`), and only to decide whether to trigger a fall; it never checked whether the lift was actually *there*, so a directed jump (`jdir~=0`) could never land ON the 12px-wide lift platform in the first place \u2014 the arc's ~19px horizontal reach is deliberately wider than the gap specifically so it clears the hazard, which structurally means it always overshoots a stationary target inside that same gap. `update_room()`'s `jumping` branch now checks every frame of the arc (not just the last one): if the player's current x crosses the gap column while the lift is close by vertically (`abs(py-lifty)<=4` \u2014 height proximity, not a floor-stop check, so this also catches a lift that's actively moving, not just paused), the jump ends immediately and boards the lift (`ronlift=true`, `py=lifty`) right where it caught it, rather than carrying through to the far side. This is what makes \"jump onto the lift\" possible at all \u2014 catching it mid-flight, not landing precisely on it at the arc's end. The catch check only activates once `jt>=4` \u2014 bug fix, post-Phase 6: a jump launched *from* the lift itself starts with `py` and `cx` already inside the catch tolerance (the parabola has moved only ~3px by `jt=1`), so every jump off the lift was instantly re-caught and re-boarded on its first or second frame, making it impossible to actually leave. The 4-frame grace window is well before a normal floor-launched jump could realistically reach the gap column, so it doesn't affect catching the lift from elsewhere.\n\n**Lift shaft visuals** \u2014 `liftx0`/`liftx1` (58/69, 12px) are the single shared bounds for both the visual gap and the platform, on the top and middle floors (`fl` 0 and 1): each of those floors' ground line (drawn in `draw_room()`) is split into two segments, `x=0-(liftx0-1)` and `x=(liftx1+1)-127`, leaving that column permanently blank rather than drawing a floor line across it \u2014 that gap is the visual \"you can fall down here\" cue matching the fall-through hazard below. The bottom floor (`fl==2`) instead draws one continuous line across the full width, no gap \u2014 bug fix, post-Phase 6: it originally split the same way as the other two floors even though the bottom floor has no floor below it to fall to, so the gap there was purely cosmetic and misleading. The lift itself renders as a short, wide platform (`rectfill(liftx0,lifty+5,liftx1,lifty+7,12)`, 3px tall) spanning `liftx0`/`liftx1` regardless of which floor it's at, reading as a floor slab rather than a solid block; its bottom row lands exactly on the same y as the ground line whenever the lift is aligned with a floor (on the bottom floor this just means the platform sits flush with the already-solid ground, not plugging anything). `liftx0`/`liftx1` are also what the boarding, disembarking, and fall-through checks below use for `cx`.\n\n**Jump in rooms** \u2014 `jumping`/`jt`/`jT`(24)/`jh`(18)/`jdir`/`jy0` implement a fixed parabolic arc: `btnp(2)` (the up-press edge, not held) starts one whenever the player isn't in front of a searchable object (`fo==nil` at that instant \u2014 reaching the trigger check at all already implies that, since the search branch above it returns early on `btn(2) and fo`), reading `jdir` from whichever of `btn(0)`/`btn(1)` is held that frame (0 if neither, matching \"straight up if the player isn't moving\"). Up is otherwise unconditional \u2014 the only other place it does something else in a room is the `ronlift` branch (disembark input), which `return`s before this trigger is ever reached, so \"up always jumps except on the lift/searching\" falls out of code order rather than an explicit guard. Each frame while `jumping`, `jt` advances, `px` moves by `jdir*0.8` (~19px total over the jump), and `py` follows `jy0 - jh*4*jt*(jT-jt)/(jT*jT)` \u2014 the standard 0-at-both-ends, peak-`jh`-at-the-midpoint parabola, needing no gravity/velocity state. 24 frames and 18px peak height are deliberately more than a minimal hop needs, so the arc clears an 8px robot or the 12px lift gap (see Lift shaft visuals above) with margin instead of exactly matching it (an initial pass under-scoped this to a bare 8px/16-frame hop that only just cleared either hazard). The whole branch `return`s early, so normal walking is skipped while airborne, and the only way to leave it early is catching an aligned lift mid-flight (see Jumping onto the lift below) \u2014 otherwise that's what \"clears it safely\" means in practice for the mid-arc frames. Landing (`jt>=jT`, only reached if the mid-flight lift check didn't already end the jump) snaps `py=jy0` exactly, clears `jumping`, and (see Falling below) checks whether the landing `px` is in the gap column; the player returns to the same floor (`rfl` doesn't change from a jump) unless that check enters the `falling` state. The sprite flip mentioned in the spec now has real art (Phase 6): `pspr()` picks from a 4-frame launch/tuck/extend/land sequence, mirrored per `jdir`, based on `jt`/`jT` arc progress.\n\n**Jump in the elevator shaft (corridors)** \u2014 the same `jumping`/`jt`/`jT`/`jh`/`jdir` globals drive a parallel jump implementation in `_update()`'s `gs==1` branch, triggered the same way (`btnp(2)`) once the shaft-column control check (`spx>=carl and spx<=carr-7`) has had its chance to consume the up-press for moving the car instead \u2014 that check always `return`s when up is pressed inside the column (even if the car can't actually move further), so reaching the jump-trigger check at all already means the player is out in a corridor, not in the column; no separate \"am I in a corridor\" guard is needed. There's no room-equivalent `py`/`jy0` here since the shaft player's y is always derived from `cy` (the car's position), not an independent value, so the jump only moves `spx` (clamped through `shaft_bounds()`, so it still respects a closed wall same as walking) and still triggers `enter_room()` on reaching an open door edge, same as normal corridor walking. `_draw()` computes a purely cosmetic vertical offset (`jh*4*jt*(jT-jt)/(jT*jT)`) applied to the player square's y so the arc is visible; nothing else about the corridor changes during a jump, since there's no hazard there to clear \u2014 it's just a faster crossing. (First Phase 3 pass omitted this entirely: pressing up in a corridor did nothing, since jump only existed inside `update_room()`.)\n\n**Falling (`falling`)** \u2014 walking into the misaligned lift column (not `lift_near(rfl)`), or landing a jump inside it, on the top or middle floor only (`rfl<2`) and while not invulnerable (`invt<=0`), starts a real descent rather than an instant fail. `fall_from` records which floor the descent started from (0 or 1; the trigger sites simply don't fire at all when `rfl==2`, `elseif rfl==2 then px=nx` instead, so the bottom floor's gap columns are just normal walkable ground \u2014 bug fix, post-Phase 6: this used to be a hazard on every floor including the bottom one, with no floor below it to justify a fall). Each frame while `falling`, `py+=fallspd` (3px/frame) and normal left/right input still moves `px` (updating `pdir` same as walking), so the player can drift out of the gap under momentum exactly like a real fall. Three outcomes are checked every frame, in order: (1) if the actual lift is close by vertically (`abs(py-lifty)<=4`), the player lands on it (`ronlift=true`, `py=lifty`) regardless of pattern/pause state, catching it mid-transit not just mid-stop; (2) if `px+4` has drifted outside the `liftx0`/`liftx1` column, the fall ends safely on whichever floor's band the current `py` has reached (`fall_floor(py)`, comparing against `fly[]`'s band boundaries), landing at that floor's ground level \u2014 this is what lets sideways momentum carry the player onto a lower floor instead of falling all the way; (3) only if `py` reaches the bottom floor's ground level (`floor_ground(2)`) while still inside the column does the fall resolve as a landing-with-damage: `hp-=(fall_from==0 and 2 or 1)` (2 HP from the top floor, 1 from the middle), `invt=45`, and the player is placed standing at `rfl=2`, `py=floor_ground(2)-7` \u2014 in place, not reset to the room's entry door (bug fix, post-Phase 6: an earlier pass used a flat 3 HP and reset to the entry door regardless of fall distance, inherited from this mechanic's original instant-fail design). A player with no horizontal input at all falls straight down and always hits case 3, since `px` never leaves the column \u2014 matching \"no momentum, no escape.\"\n\n**Robots (`cur_room.robots`)** \u2014 generated in `gen_room()` alongside objects: each of the room's 6 floor-sides independently rolls a robot via `robp[pat]` (a % chance, indexed by the same density pattern that drives that room's object counts, so denser rooms get more of both), capped at 1 per side by construction (it's a single roll, not a loop). Pattern is uniform-random 1-3 (stationary/patrol/chase) independent of density. `update_robot(r)`, called for every robot every frame regardless of player state, opens by computing `lo,hi=r.side==0 and 4 or 72, r.side==0 and 50 or 119` \u2014 the same per-side span patrol always used for `r.x0`/`r.x1` (now folded into this shared computation instead of stored per-robot), reused as the movement clamp for all 3 patterns so a robot can never walk across the centre lift gap (`liftx0`/`liftx1`, 58-69) onto the room's other side, regardless of pattern. `hi` was originally 56/124 \u2014 bug fix, post-Phase 6: with an 8px-wide sprite, 124 let a robot's right edge reach x=131 (past the 127px screen) and 56 let it reach x=63 (into the 58-69 gap); both are now tight enough to keep the full sprite clear of the screen edge and the gap. `base_spd` (0.6, before this fix) was also halved to 0.3, reported as roughly twice too fast.\n\nEach robot also rolls a `skin` (0-2, `flr(rnd(3))`) picking its sprite block via `skinbase={19,36,39}` (indexed `skinbase[skin+1]`, each block laid out neutral/lit-left/lit-right same as the player's run pairs). Skins 0 and 1 (red/dark-red/white, and solid red/yellow) were the only two for most of Phase 6; skin 2 (purple body, white lights, sprites 39-41) was added after a play-test question revealed both original skins were red-based and read as a single colour at a glance despite being two nominally-distinct variants.\n\nSound: `look_sfx(r)` wraps every `sfx(7,0)` call site (the stationary flip, patrol's turn, chase's \"thinks\" pause, and chase's direction-change pause) behind a per-robot cooldown, `r.st` (frames remaining, ticked down once per `update_robot()` call, set to 90 whenever the sound actually plays) \u2014 bug fix: a chasing robot converging on the player's exact `x` can overshoot by a fraction of a pixel every frame, flipping which side it's nominally on each frame too and re-triggering the direction-change branch (and its sound) every single frame for as long as that jitter lasted, reading as the sound getting \"stuck\" repeating. The underlying pause/direction-change logic is untouched and still runs at full rate; only the sound is rate-limited to once per 3s per robot.\n\nSound cycle (post-Phase 6): every look/turn event plays SFX slot 7 (\"bleep-bloop\") on channel 0 \u2014 the stationary pattern's flip, patrol's turn at either end, chase's \"thinks\" pause, and (new, see below) chase's direction-change pause. Actively moving (patrol, chase, or fleeing) plays slot 8 (a buzz blip) roughly every 8px of travel, checked as `flr(r.x)%8<1` rather than a new per-robot timer \u2014 since `r.x` increases by less than 1px/frame and `flr()` of a continuously-increasing value passes through every integer, this reliably fires once per ~8px regardless of the robot's current speed. Both slots share channel 0 (otherwise unused) across every robot in the room; this is a jam-scope simplification, not true per-robot polyphony, so if two robots' sounds would overlap only the most recently triggered one is actually heard.\n\nChase's direction change now pauses like patrol's turns do \u2014 bug fix, post-Phase 6: it used to recompute `r.dir=px>r.x and 1 or -1` and move in that new direction the same frame, so a robot could reverse instantly and repeatedly if the player lingered near its `r.x`, with no equivalent to patrol's pause-at-turn. The chase branch now compares the newly computed direction against `r.dir`; if it changed, the robot pauses (`r.t=10`, plays slot 7) instead of moving that frame, and only resumes movement (and the slot 8 buzz) once `r.t` runs out with the direction unchanged:\n- **Stationary** (`pat==1`) \u2014 flips `r.dir` every 30-90 frames (`r.t` countdown), no movement; this is the look-left/right cue. The look SFX from README's spec is Phase 6 work (see SFX slots below), not wired up yet \u2014 only the visual flip.\n- **Patrol** (`pat==2`) \u2014 walks between `lo`/`hi` (its spawn side's floor span) at `r.spd*rmul()`, reversing and pausing 15-45 frames (`r.t`) at each end.\n- **Chase** (`pat==3`) \u2014 while `r.fl==rfl`, moves toward `px` at `r.spd*rmul()`, clamped to `lo`/`hi` same as patrol \u2014 a robot chasing from its own side simply stops at the gap rather than following the player across it. If the player is `jumping` and overlaps the robot's x (`abs(px-r.x)<=6`) and it hasn't already triggered this pass (`r.jumped`), it \"thinks\" for 30 frames (`r.t`, no movement) then flees the player's x for 20 frames (`r.flee`, also clamped to `lo`/`hi`) before resuming the chase; `r.jumped` resets once the player's x moves away, so a second jump-over later in the same encounter can retrigger it.\n\nEach robot's `spd` is randomized at generation (`base_spd*(0.7 to 1.3)`), matching README's \"moves at a random speed\" for chase; `rmul()` \u2014 `1 + min(nvisited,10)/10` \u2014 is the shared difficulty-ramp multiplier applied on top of that at movement time (see Difficulty ramp below), so already-generated robots speed up live as the run progresses rather than needing regeneration.\n\n**Player/robot collision (`hit_check()`)** \u2014 called once per frame, unconditionally (works during jump and while riding the lift too, since it's just an AABB test against the player's *current* `px,py` \u2014 a jump's elevated `py` or the lift's `py=lifty` naturally miss a floor-level robot's box without any jump/lift special-casing). While `invt>0` it just ticks the timer down and skips the check. Both boxes are inset 2px on every edge (`r.x+2` to `r.x+6`, `r.y+2` to `r.y+6` for the robot; `px+2` to `px+6`, `py+2` to `py+6` for the player, tested as `px<r.x+4 and px+6>r.x+2 and py<r.y+4 and py+6>r.y+2`) \u2014 bug fix, post-Phase 6, two passes: the first inset only the robot's side by 1px, which turned out insufficient (still triggered 2-4px before the sprites visually touched, since the player's own box was still the full 8x8); this pass tightened the robot's inset to 2px and added the same 2px inset to the player's side. On a hit: `hp-=1`, `invt=45`, and a small knockback shoves `px` 6px away from the robot. The player sprite flickers (`blink(10)`) while `invt>0` as the visual invulnerability cue.\n\n**Difficulty ramp** \u2014 `nvisited` (0-10) increments the first time each room is entered (`cur_room.seen` guards against re-counting a revisit), tracked via `enter_room()`. `rmul()` turns that into the DESIGN.md formula `1 + rooms_found/10` and is applied to robot movement speed live, every frame, rather than baked into `r.spd` at generation. Density is deliberately *not* re-scaled by `nvisited`: all rooms are generated upfront in `gen_floors()` before any room has been visited (0 rooms found at that point), so there's no live \"rooms found so far\" signal available at generation time to scale density against. Each room's density pattern (1-4, chosen once at generation, drives both `objp` and `robp`) is the only density lever this cart has; that's a scope call against DESIGN.md's prose (\"robot speed **and density** scale up\"), following its precise formula (`robot_spd` only) as the more authoritative source over the looser prose description.\n\n**Search** \u2014 `sobj` (or nil) is the object currently being searched, recomputed fresh every frame rather than toggled: each frame finds the front, unfound object on `rfl` within `abs(px-o.x)<=6`, and only advances while `btn(2)` is held that same frame (`prog+=4` for a terminal, item 4; `prog+=2` for everything else \u2014 a terminal takes the same 300-unit/10-step threshold as every other object, just twice as fast per step, rather than a shorter step count). A tick plays (SFX slot 5) whenever this frame's increment crosses a 30-unit step boundary, checked as `flr(prog/30) > flr(prevprog/30)` rather than `prog%30==0` \u2014 the terminal's 4-wide stride doesn't evenly divide 30, so an exact-multiple check would silently skip ticks for it (2 does divide 30 evenly, so this only mattered once the terminal's rate diverged from the default). Releasing up, walking away, or the floor changing all just stop the increment for items 1-3 \u2014 `prog` lives on the object itself, so it's never lost, only paused \u2014 but for a terminal specifically, the same drop-out resets `sobj.prog=0`, cancelling the attempt outright rather than pausing it (checked right where `sobj` gets cleared to `nil`, using the *previous* frame's `sobj` before it's overwritten). On reaching 300 it plays a celebratory major-chord arpeggio (SFX slot 6, distinct from the per-step tick), then branches on `fo.item`: 2 (letter) adds to `inv`, sets `found_letter`/`found_t=60` for the \"found: X\" popup, and marks `found=true`; 3 (clock) adds 1800 to `timer` and marks `found=true`; 4 (terminal) sets `help_on=true`/`help_t=90` and resets `fo.prog=0` instead of marking found \u2014 the only item type that isn't consumed, so the same terminal can be searched again; anything else (1, health) adds 2 to `hp` (capped at 5) and marks `found=true`. Searching pre-empts movement, lift-boarding, and jumping entirely (an early `return` while `btn(2) and fo`); jumping is checked afterward via `btnp(2)`, so a held-up search always wins over a fresh up-press when both are momentarily true.\n\n`draw_obj()` no longer shows any content hint on the object itself \u2014 design reversal, post-Phase 6 (see BUGS.md #2.7 for the original \"always visible\" decision, and its own follow-up bug for this reversal): a play-test round found that always-visible contents let players skip objects on sight, undermining the point of having several object types to search. The furniture sprite alone is shown (`22+(kind-1)*3+(variant-1)` for kinds 1-4, or sprite 43 unconditionally for kind 5/terminal, which has no colour variants). The content icon only appears once `sobj` is set, drawn inside the search progress bubble in `draw_room()` (letter tile+glyph for item 2, clock for item 3, terminal for item 4, health cross otherwise) \u2014 checking every object is now the only way to learn what it holds.\n\n**HUD (`draw_hud()`)** \u2014 Shared by the shaft and room screens (both call it at the very end of their own draw function, the shaft after its `camera()` reset back to screen-absolute coordinates). Draws its own panel first (post-Phase 6, bug fix \u2014 it used to print directly over whatever the scene left behind, the same plain white text as everything else): a light-grey border line at `y=111` and a dark-blue fill (`rectfill(0,112,127,127,1)`) underneath both text lines, so the HUD reads as a UI layer rather than blending into the room/shaft. Line 1 (`y=113`; bug fix \u2014 was `y=112`, which put the text close enough to the `y=111` border line to visually run into it): `\"time\"` label (colour 6, dim) then `flr(timer/30)` (colour 7, bright) left-aligned, `\"floor \"..cfloor..\"/\"..nf` right-aligned (`126-4*#fl`, using the standard 4px/char advance this file already relies on elsewhere, e.g. `draw_title_card`'s centring), also colour 6. Line 2 (`y=120`): `\"letters \"..#inv..\"/\"..wlen` (colour 6) with `\"hp \"..hp` (colour 8, red) printed separately further right. DESIGN.md's ASCII mockups spec exactly these two lines for both screens and don't reserve a slot for hp; rather than drop hp entirely (it's the loss-condition stat, genuinely useful to see continuously) or add a third line the 16px bottom strip doesn't have room for, it rides along on the letters line instead \u2014 a presentation call within an otherwise-followed spec, not a new game-balance value. The control room does *not* use this function; DESIGN.md treats it as a distinct puzzle-arrangement UI rather than a physical room, and it already prints its own hp/time pair in its own layout.\n\n**Control room entry (deep wall)** \u2014 Every room already has one impassable \"deep\" wall opposite its entry door (the far edge the player never reaches under normal play, since `px` is clamped to 0-120 and nothing previously handled reaching that clamp). For the single room where `cur_idx==nrooms` (the last valid room generated, in shaft order \u2014 always a real room, whether or not it happens to carry a letter, since idx runs 1..nrooms independent of the `wlen` letter cutoff), reaching that deep wall while still walking into it (`entry_side==0` needs `px<=0 and btn(0)`; `entry_side==1` needs `px>=120 and btn(1)` \u2014 continuing the same direction the player entered with, not reversing) calls `enter_control()` instead of leaving it as a dead stop. This check sits inside the existing `if rfl==2 then ... end` block in `update_room()`, alongside (but before) the shaft-exit checks, since the two use opposite directions/edges and can't both fire the same frame.\n\n**Control room (`gs==3`)** \u2014 `enter_control()` sets `slots={}` (array 1..wlen, each nil or an index into `inv`), `csel=1` (cursor over `inv`, the pool of collected letters), `ssel=1` (cursor over `slots`), plus the same `trans_t=9`/door-SFX pattern every other screen transition uses. `update_control()`: left/right (`btnp(0)`/`btnp(1)`) cycle `csel` through all of `inv` (1-indexed wraparound via `(csel-2)%#inv+1` / `csel%#inv+1`), including already-placed letters \u2014 placing one twice is simply a no-op (see below), not prevented at the cursor level, to avoid a second \"skip used letters\" pass. Up/down (`btnp(2)`/`btnp(3)`) cycle `ssel` through `slots` the same way. `btnp(4)` (\"Z\") toggles the targeted slot: clears it if occupied, otherwise places `inv[csel]` there provided that inventory index isn't already sitting in some other slot (checked by scanning `slots`). `btnp(5)` (\"X\") submits: builds a guess string from `slots` (unfilled slots contribute `\"_\"`, which can never equal a real letter, so an incomplete arrangement just reads as wrong rather than needing a separate completeness check) and compares it to `word`. A match sets `score`, `won=true`, `gs=4`; a miss costs 1 HP (`max(0,hp-1)`) and clears `slots` back to empty so the player re-places from scratch \u2014 README only requires \"costs 1 HP, can be retried without limit,\" not that partial placement survives a wrong guess, and clearing is simpler than tracking which letters to leave in place.\n\n**Timer & loss condition** \u2014 `timer` (frames remaining, starts at 9000 = 300s at 30fps, set in `new_game()`) ticks down once per frame centrally in `_update()`, after the `gs==0`/`gs==4` early-outs but before dispatching to `update_control()`/`update_room()`/the elevator logic \u2014 so it runs across gs 1/2/3 uniformly without each of those needing its own decrement. The same central spot checks `timer<=0 or hp<=0` and, if either, sets `won=false`, `score=0`, `gs=4` and returns before that frame's gameplay update runs. HP-reducing spots (`hit_check()`'s robot hit, the lift-fall hazard, a wrong control-room submission) all clamp with `max(0,hp-n)` so `hp` never reads negative in the one frame between the damage and the next frame's centralized check catching it.\n\n**Game over (`gs==4`)** \u2014 `draw_gameover()` prints a win/loss headline (`won and \"mission complete\" or \"mission failed\"`) over a colour band (`rectfill(0,40,127,58,won and 11 or 8)`, green/red) and `score`, plus a blinking \"press any button\" prompt; `_update()`'s `gs==4` branch returns to the title screen (`gs=0`) on `any_btnp()`, matching the state table (game over exits to title on any button, title exits to a fresh `new_game()` on any button \u2014 two separate any-button presses, not one). `score` is set to `100*#inv+2*flr(timer/30)` on a win (inside `update_control()`'s submit check) or `0` on any loss path; this logic is unchanged from Phase 4, only the presentation is new.\n\n**Terminal help screen (`help_on`)** \u2014 A modal overlay rather than a `gs` value, since it can only ever be triggered from state 2 (a completed terminal search, see Search above) and needs to resume exactly there when dismissed. `_update()` checks `help_on` first, before even `trans_t`: while true, the only thing that happens is ticking `help_t` down, then (once it's spent) watching for `any_btnp()` to clear `help_on`, so the timer, robots, the lift, and every other piece of game state are completely frozen for as long as it's shown. `help_t=90` (~3s) is set alongside `help_on=true` at the trigger site, and dismissal is gated on it reaching 0 first \u2014 bug fix: without this, a button held over from completing the search (or an early stray press) could close the screen before the player had a chance to read it. `draw_help()` also only prints the \"press any button to close\" line once `help_t<=0`, so the screen doesn't invite input it isn't yet honouring. `_draw()` checks `help_on` first too, calling `draw_help()` and returning before any of the normal `gs` branches run, so the room behind it isn't drawn at all while help is up. `draw_help()` styles itself as a terminal display rather than plain text on black: a light-grey `rect(2,2,125,125,6)` bezel frames the screen, and every line prints in neon green (colour 11, not the plain white used elsewhere) \u2014 `cls(0)` plus ~10 lines of `print()` covering controls, the letter/win goal, and a short object legend.\n\n**Screen-transition overlay (`draw_overlay()`)** \u2014 Called at the end of every `_draw()` branch (title, room, control room, game over, shaft), so it always renders on top regardless of which screen is active. Two independent effects:\n- *Iris wipe* \u2014 while `trans_t>0` (the existing shaft\u2194room/control-room crossing pause from Phase 2), draws a black bar shrinking in from both the top and bottom (`h=flr(64*trans_t/9)`, so `trans_t=9` covers the full screen and `trans_t=0` covers nothing), revealing the already-switched screen underneath. This is a deliberate single-phase reveal, not a true fade-out-then-fade-in crossfade: `gs` switches the instant `enter_room()`/`enter_control()`/an exit fires, before `trans_t` starts counting down, so there's no \"old screen\" left to fade out by the time the overlay starts drawing \u2014 and a real crossfade would need a 4-level palette-remap table (16 colours \u00d7 several darkness steps) that isn't worth the token cost for a jam-scope transition. Reads as \"fades in/out\" per DESIGN.md's one-line requirement at a fraction of the cost.\n- *Start/end flash* \u2014 `flash_t` (frames remaining, ticked down unconditionally as the very first line of `_update()`, independent of `trans_t`/`gs`) draws a solid white full-screen rect while positive. Set to 6 in three places: `new_game()` (game start), the loss branch in `_update()` (timer or hp hits 0), and the win branch in `update_control()` (correct submission) \u2014 covering both \"game start and end flash\" cases from DESIGN.md. It's a hard flash-then-cut rather than a graduated fade, which is a fair reading of \"flash\" (as opposed to the iris wipe's smoother \"fade in/out\" language) and needs no extra palette table either.\n\n### SFX slots\n\n| Slot | Event | Notes |\n| ---- | ----- | ----- |\n| 0 | Elevator hum/buzz | Low triangle tone (pitch 0x10) with vibrato, looped over its full 32 steps; played on channel 1 while moving, stopped (`sfx(-1,1)`) on arrival |\n| 1 | Shaft/room door | 4-note decaying noise hit (pitch 24\u219220, volume 5\u21920) then silence; one-shot, no loop; played on channel 2 whenever the shaft and a room connect, in either direction |\n| 2 | Footstep | 2-note percussive click (noise wave, pitch 24\u219220, volume 3\u21921); played on channel 3 via `step_sfx()`, called from every movement branch (room, shaft/corridor, riding the lift) whenever `pft%12==1` \u2014 a fixed modulus against the run-cycle timer, landing roughly 2 steps per 4-frame run cycle regardless of which branch is moving the player |\n| 3 | Jump (\"sproing\") | 4-note ascending run (sawtooth, pitch 0x10\u21920x28, pitch-slide effect between notes); played on channel 3 once at every jump launch (room, shaft/corridor, and jumping off the lift) |\n| 4 | Landing | 2-note percussive thump (noise wave, pitch 8\u21926, volume 5\u21922); played on channel 3 once when a jump's arc completes (`jt>=jT`) in both the room and shaft/corridor jump implementations \u2014 not played when the arc ends early by catching the lift mid-flight, since that's a board, not a landing |\n| 5 | Search progress tick | 2-note blip (square wave, pitch 0x24\u21920x20); played on channel 3 once per progress step, checked as `fo.prog%30==0` right after `fo.prog+=2` \u2014 since `prog` starts at 0 and always increments by an even number, every multiple of 30 (each of the 10 steps) is hit exactly, no separate step-tracking needed |\n| 6 | Search completion | 4-note ascending major-chord arpeggio (square wave, root/third/fifth/octave: 0x18/0x1c/0x1f/0x24), fast speed so the notes blend chord-like; played on channel 3 once when `fo.prog>=300` |\n| 7 | Robot look/turn (\"bleep-bloop\") | 2-note pulse-wave pair (pitch 0x28\u21920x20); played on channel 0 at every robot look/turn event \u2014 see `update_robot()`'s Robots entry below |\n| 8 | Robot move buzz | 1-note phaser-wave blip (pitch 0x10); played on channel 0, retriggered periodically while a robot is actively moving |\n\n### State variables\n\n```lua\n-- screen\ngs        -- game state: 0=title 1=elevator shaft 2=puzzle room 3=control room 4=game over\ntrans_t   -- frames left in the shaft<->room arrival pause; freezes _update while >0\nflash_t   -- frames left in the current start/end white flash; ticks down unconditionally\n          -- every frame regardless of gs/trans_t, purely cosmetic (doesn't freeze _update)\n\n-- floor/room generation\nnf, fh    -- floor count (16), px per floor / car height (24)\nlseed     -- current building's RNG seed\nfloors    -- array 1..nf, corridor type per floor (0/1/2/3)\nnrooms    -- valid room count from the last generation (always >=wlen); the control room\n          -- sits behind rooms[nrooms], the last one generated in shaft order\nword      -- this seed's secret word (one of the 5-word list)\nwlen      -- #words[1]; word length, also the letter-assignment cutoff and the minimum\n          -- room count gen_floors() re-rolls for -- ties the two together structurally\nrooms     -- array 1..nrooms, {objs={...}, robots={...}, seen} per valid room, generated once\nroomL, roomR -- [shaft floor] -> room index, for corridor-entry lookup\n\n-- elevator\ncfloor    -- current floor index, 1-based\ncy        -- car's continuous world y\ntargety   -- y of the floor currently being travelled to\nmoving    -- true while travelling between floors\nspx       -- player's x within the shaft screen; column-clamped, or corridor-extended per shaft_bounds()\n\n-- shaft layout (x-axis)\ncarl, carr -- shaft/car interior bounds (56, 71)\nwt         -- wall thickness (4px)\ncl, cr     -- wall's outer, concrete-facing x (52, 75)\n\n-- camera\nmaxcamy   -- max camera y offset (nf*fh - playfield height)\n\n-- player resources (persist across rooms)\nhp        -- 0-5, +2 per health object (capped at 5)\ninv       -- array of collected letters, in find order\n\n-- room (valid only while gs==2)\ncur_room  -- rooms[idx] for the room currently entered; {objs={...}, robots={...}, seen=}\ncur_idx   -- that room's index, so exiting can hand it back to the shaft\nentry_side -- 0=left corridor, 1=right; which edge the door/exit is on\nrfl       -- player's current room floor, 0-2 (top-bottom)\npx, py    -- player's room-local position\nronlift   -- true while riding the centre lift\nsobj      -- object currently being searched, or nil; each object's .item is\n          -- 1=health, 2=letter, 3=clock, 4=terminal (see Search above)\nfound_t   -- frames left showing the \"found: X\" letter popup; ticks down unconditionally\n          -- in _update() like flash_t, so it decays even if the room is left mid-popup\nfound_letter -- the letter shown in that popup\nhelp_on   -- true while the terminal help screen overlay is shown; freezes _update()\n          -- entirely (see Terminal help screen) until help_t reaches 0 and any_btnp() clears it\nhelp_t    -- frames left before help_on can be dismissed (90, ~3s); also gates\n          -- when draw_help() shows its \"press any button\" line\nfly, flh  -- y-top / height of each room floor (37,37,38)\nliftys, topy, boty, liftspd, liftt -- lift's 3 floor-aligned y values, travel bounds, speed, near-alignment tolerance\nliftpause -- frames left paused at a floor-aligned y; lift movement is skipped while >0\nliftx0, liftx1 -- lift shaft x-bounds (58,69); shared by the blank floor gap, the platform render, and the board/fall-through checks\nfalling   -- true while descending through the lift gap on floor 0 or 1 (room-only,\n          -- never triggered on the solid bottom floor); fallspd (3px/frame) and\n          -- fall_floor(y) (which floor band a given py has reached) support this\nfall_from -- which floor (0 or 1) the current fall started from; scales landing damage\n          -- (2 hp from floor 0, 1 hp from floor 1) when the fall reaches the bottom\n\n-- jump (jumping/jt/jT/jh/jdir shared by gs==1 corridors and gs==2 rooms; jy0 is room-only)\njumping   -- true while the jump arc is playing out\njt, jT    -- frames elapsed / total frames in the current jump (24)\njh        -- jump peak height, px (18)\njdir      -- horizontal direction for this jump, -1/0/1\njy0       -- room-only: py at jump start, the floor-ground y the player returns to on landing\n\n-- player damage & difficulty (persist across rooms)\ninvt      -- invulnerability frames remaining; also gates the lift-fall hazard\nnvisited  -- distinct rooms entered so far, capped at 10; drives rmul()\nbase_spd, robp -- robot base speed anchor; per-density-pattern % chance of a robot per floor side\n\n-- control room (valid only while gs==3)\nslots     -- array 1..wlen, each nil or an index into inv (which collected letter fills that blank)\ncsel      -- cursor into inv (left/right), the currently selected pool letter\nssel      -- cursor into slots (up/down), the currently targeted blank\n\n-- timer, win/loss, score (persist across the whole run)\ntimer     -- frames remaining, starts 9000 (300s @ 30fps); ticks down across gs 1/2/3, never resets\nwon       -- true if gs==4 was reached via a correct control-room submission, not timer/hp hitting 0\nscore     -- 100*#inv + 2*flr(timer/30) on a win, 0 on any loss; shown on the gs==4 screen\n```\n\n## Reusable code\n\nCheck [`../lib/CLAUDE.md`](../lib/CLAUDE.md) for shared Lua snippets (input handling, screen flash/fade, state machine, tweening, collision, HUD, map queries, seeded RNG) before writing new utility code from scratch. Snippets are copy-pasted into this cart's `__lua__` section, not imported \u2014 inline only what's needed given the shared token budget.\n"}}, {"num": "3", "title": "3 FALLING", "tagline": "action/puzzle game", "hasCart": true, "cartRelPath": "downloads/3.p8", "embedPath": "exports/3/3.html", "embedStatus": "ok", "docs": {"readme": "# 3 FALLING\n\nThis is a action/puzzle game built using Claude and Pico-8. Follows the format in [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md).\n\nThe game looks like an Atari 2600 game. Colours, sprites, and fonts should approximate the Atari 2600 aesthetic using Pico-8's palette.\n\n## Game overview\n\n- items fall from the top, down to the bottom of the screen and out of view, unless a player catches them with the paddle\n- item colours, catch effects, and spawn odds:\n\n  | Colour | Spawn odds | Score on catch | Other effect on catch |\n  | ------ | ---------- | --------------- | ---------------------- |\n  | Grey   | 40% | +1 | none |\n  | Blue   | 25% | +2 | none |\n  | Red    | 15% | -2 | paddle -1 segment |\n  | Orange | 15% | +1 | paddle +1 segment (capped at 5), lives +1 (capped at 5) |\n  | Green  | 5%  | +4 | none |\n\n- letting any item (any colour) fall past the paddle uncaught is a miss: lives -1\n- lives start at 5; game over when lives reach 0\n- the paddle has its own health, separate from lives: starts at 3 segments, min 0, capped at 5\n  - catching red removes 1 segment (min 0); at 0 segments the paddle is at its minimum width but still catches items and the game continues, gated only by lives\n  - catching orange restores 1 segment (max 5) and adds 1 life (max 5)\n- the round is won by surviving 90 seconds without running out of lives\n  - items fall at a constant spawn rate: one new item every 1.2 seconds, with up to 2-3 items falling concurrently\n  - fall speed ramps linearly over the 90 seconds, reaching roughly 2x the starting speed by the end\n- players control a paddle that moves left and right at the bottom of the screen\n- the HUD (bottom line) shows the remaining lives count and score, and the middle section showing the last 3 pieces caught by the player\n- if the last 3 pieces caught match (same colour), a combo is triggered; the tracker then resets, so a fresh streak of 3 is needed to combo again\n  - a blue combo adds 10 to the score\n  - a green combo adds back one life (capped at 5)\n  - an orange combo resets a player's lives to 5 and adds 1 paddle segment (capped at 5)\n  - a red combo adds 25 points\n  - a grey combo adds 5 points\n  - when a combo shows, the screen flashes to the colour with \"COMBO\", then back to the game (500ms)\n\n## Scenes\n\n| Scene | Shows | Enters from | Exits to |\n| ----- | ----- | ------------ | -------- |\n| Title | Shared jam title card: colour-swatch strip, \"'26 WARPED GAME JAM\", \"3 FALLING\", blinking start prompt | Startup | Any button \u2192 Game |\n| Game | Playfield (items fall from the top), player paddle, HUD | Title, or \"play again\" from End | Lives hit 0, or timer reaches 90s \u2192 End |\n| Combo flash | Screen fills with the combo colour, \"COMBO\" text overlay | 3 matching catches in a row | 500ms (15 frames) \u2192 resumes Game |\n| End | Shared win/loss layout: headline (\"GAME OVER\" on loss, \"YOU SURVIVED\" on win), final score, items caught, items missed | Game | Any button \u2192 Title |\n\n## Sprites\n\n- the paddle is a horizontal bordered bar; its width/appearance reflects current segment health (0 through 5 segments)\n- items are simple bordered shapes: fill colour carries the semantic colour (grey/blue/red/orange/green), border is a simple contrasting outline (black or white) for readability, not a literal colour-wheel complement\n\n## Sounds\n\n- simple explosion sound (pink noise) when a red item hits the player's paddle\n- a \"bing\" sound when other items hit it, one per colour. bings should be melodic (C, D, E, F, G)\n- when a combo is completed, it plays a chord, using the notes starting with the colour's note\n- when a player loses (lives reach 0), 3 descending melodic notes play\n- when a player wins (survives the full 90 seconds), 3 ascending melodic notes play\n", "design": "# 3 Falling \u2014 Design\n\n**Superseded.** `3.p8` now exists; [CLAUDE.md](CLAUDE.md)'s Architecture section is the as-built source of truth, per [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md)'s document lifecycle. Kept here as historical pre-implementation reference (pixel layout, colour, state machine, tuning constants) \u2014 a few details below (paddle catch-flash, title stripe treatment) were never implemented; see CLAUDE.md's Known deviations.\n\n## Screen layout (128\u00d7128)\n\n```\ny=0                                          \n  |  playfield: items fall here\n  |\n  |\ny=103   paddle travel row (8px tall, moves left/right, clamped to x=0..127)\ny=111\ny=112   HUD line (16px: lives | last-3-caught icons | score)\ny=127\n```\n\n- Playfield: y=0\u2013102, items spawn at y=0 and fall until they reach the paddle row or exit the bottom.\n- Paddle row: y=103\u2013110 (one 8px sprite row). The paddle never leaves this row; it only moves horizontally.\n- HUD: y=111\u2013127, two 8px text rows or one row with icon glyphs. Left-aligned lives, centered last-3-caught icons, right-aligned score (matches game 1's left/center/right HUD convention).\n\n## Colour palette\n\nUsing Pico-8's native palette; the semantic item names map directly to Pico-8 colour names, so no approximation layer is needed for items:\n\n| Element | Colour | Index |\n| ------- | ------ | ----- |\n| Grey item | light_gray | 6 |\n| Blue item | blue | 12 |\n| Red item | red | 8 |\n| Orange item | orange | 9 |\n| Green item | green | 11 |\n| Item border (default) | white | 7 |\n| Item border (grey item only) | black | 0 |\n| Paddle fill | white | 7 |\n| Paddle border | dark_blue | 1 |\n| Background | black | 0 |\n| HUD text | white | 7 |\n\nBorder rule: white border on all items for contrast against black, except grey items use a black border (white-on-light-grey reads poorly).\n\n## Paddle\n\n- Starts at 3 segments (24px), each rendered as an 8\u00d78 block, and can grow via orange catches/combo up to a max of 5 segments (40px), centered under wherever it currently is.\n- Segment count \u2192 width: 5 segments = 40px, 4 = 32px, 3 = 24px (start), 2 = 16px, 1 = 8px, 0 = 4px (a thin sliver; still wide enough to register a catch, but noticeably harder).\n- Shrinks/grows symmetrically from center so the paddle's midpoint (used for input/collision) doesn't jump.\n- Movement: left/right d-pad, clamped to screen bounds (`x = mid(4, x, 124)` adjusted for current width). Suggested speed: 2px/frame at 30fps.\n- On red catch (segment loss), flash the paddle red for a few frames as a hit indicator. On orange catch (segment gain), flash white/green briefly.\n\n## Items\n\n- Spawn at a random x (aligned to keep the full sprite on-screen) at y=0.\n- Colour chosen by weighted roll: grey 40, blue 25, red 15, orange 15, green 5 (out of 100).\n- Fall speed starts at a base value and ramps linearly to 2\u00d7 that value over the 90-second round (see Difficulty ramp below). All items on screen at a given moment share the current global fall speed.\n- Spawn timer: a new item spawns every 1.2s (36 frames at 30fps), independent of how many items are already falling. Because fall speed increases over the round while spawn interval stays fixed, 2\u20133 items are typically on screen at once, more as the round progresses.\n- Sprite: 8\u00d78 bordered square (simplest \"simple bordered shape\" reading). Rectangle rather than circle/diamond keeps sprite budget and collision math simple.\n- Collision (catch): item's bounding box overlaps the paddle's current bounding box at the paddle row \u2192 caught, remove item, apply catch effects (below).\n- Miss: item's y exceeds the paddle row without having been caught \u2192 remove item, apply miss effect (lives -1).\n\n## State machine\n\n| `gs` | Name | Entered from | Exits to |\n| ---- | ---- | ------------- | -------- |\n| 0 | Title | startup | 1 (any button) |\n| 1 | Playing | title, or \"play again\" from end screen | 2 (lives hit 0, or timer reaches 90s) |\n| 2 | End | playing | 0 (any button) |\n\n`won` (bool) is set when state 1 is exited via the timer rather than via lives reaching 0; the end screen branches its headline/sound on this flag.\n\n## Resources & rules\n\n**Lives**\n- Start at 5, max 5.\n- Any uncaught item of any colour (falls past the paddle) costs 1 life.\n- Game over (loss) at 0 lives.\n\n**Score**\n- Per-catch deltas: grey +1, blue +2, green +4, red -2, orange +1.\n- Floored at 0 for display (never shown negative), though this only matters in practice if a red catch happens before any points are banked.\n\n**Paddle segments**\n- Start at 3, max 5, min 0.\n- Red catch: -1 segment. Orange catch: +1 segment (no-op if already at 5, but orange's +1 score and +1 life still apply), +1 life (capped at 5).\n- Independent of lives; reaching 0 segments does not end the game by itself.\n\n## Combo system\n\n- Track the colours of the last 3 successful catches in a small ring buffer (any colour counts, including red/orange).\n- When all 3 entries match, trigger that colour's combo, then clear the buffer (next combo requires a fresh streak of 3).\n- Combo effects:\n\n| Colour | Effect |\n| ------ | ------ |\n| Blue | +10 score |\n| Green | +1 life (capped at 5) |\n| Orange | Lives reset to 5, +1 paddle segment (capped at 5) |\n| Red | +25 score |\n| Grey | +5 score |\n\n- On trigger: fill the screen with the combo colour, overlay \"COMBO\" text in a contrasting colour (white on dark fills, black on light/grey fills), hold 500ms (15 frames at 30fps), then resume normal rendering.\n\n## Difficulty ramp & win condition\n\n- Round length: 90 seconds (2700 frames at 30fps).\n- Fall speed: `spd = base_spd + (base_spd * (t / 2700))`, linearly interpolated so speed is `base_spd` at t=0 and `2 * base_spd` at t=2700.\n- Win: timer reaches 2700 frames while lives > 0 \u2192 `gs = 2`, `won = true`.\n- Loss: lives reach 0 at any point \u2192 `gs = 2`, `won = false`, regardless of timer.\n\n## Screens\n\n**Title** \u2014 Intellivision-style: black background, a bordered colour-band frame (alternating stripes in the item palette: grey/blue/red/orange/green), large blocky \"3 FALLING\" centered, blinking \"PRESS \ud83c\udd7e\ufe0f TO START\" prompt beneath.\n\n**Game** \u2014 Playfield + paddle + HUD as laid out above. No pause state.\n\n**End** (shared layout, win/loss differ only in headline text and sound) \u2014 Centered headline (\"GAME OVER\" or \"YOU SURVIVED\"), then final score, items caught, and items missed, stacked below. Any button returns to title.\n\n## Sound\n\n| Event | Description |\n| ----- | ------------ |\n| Grey catch | Bing, note C |\n| Blue catch | Bing, note D |\n| Red catch | Pink-noise explosion (not melodic) |\n| Orange catch | Bing, note F |\n| Green catch | Bing, note G |\n| Combo (any colour) | Chord starting on that colour's note |\n| Loss | 3 descending melodic notes |\n| Win | 3 ascending melodic notes |\n\nNote assignment follows the catch-effect ordering in the README (C, D, [red is noise], F, G) \u2014 red keeps the explosion instead of a bing since it's a negative event, so it skips the melodic slot rather than reusing E.\n\n## Token budget\n\nThis design carries more state than game 1: two health pools (lives, paddle segments), a weighted spawn table, a 3-slot combo buffer, and a time-based difficulty ramp. Lean on [`lib/`](../lib/CLAUDE.md) for shared primitives (input, screen flash, state machine, seeded RNG) rather than re-deriving them, and keep the combo/spawn tables as flat arrays indexed by colour id rather than branching per-colour code.\n", "plan": "# Plan\n\nPhased implementation checklist for `3.p8`, based on [README.md](README.md) and [DESIGN.md](DESIGN.md).\n\n## Phase 1: Core movement & falling items\n\n- [x] Paddle: 8\u00d78\u00d73-segment sprite (starting width; grows to 5 as of the Phase 2/3 spec update below), renders centered, moves left/right, clamped to screen bounds\n- [x] Item spawn: random x, weighted colour roll (grey 40 / blue 25 / red 15 / orange 15 / green 5), fixed 1.2s spawn interval\n- [x] Item fall: constant baseline speed (ramp comes in Phase 4), removed when caught or off-screen\n- [x] Catch detection: item/paddle bounding-box overlap at the paddle row\n- [x] Miss detection: item passes the paddle row uncaught\n- [x] Verify: items spawn at the documented odds, fall visibly, and the paddle can intercept them\n\n## Phase 2: Resource systems\n\n- [x] Lives: start at 5, -1 on any miss, game-over check at 0\n- [x] Score: per-colour deltas (grey +1, blue +2, green +4, red -2, orange +1), floored at 0 for display\n- [x] Paddle segments: start 3, max 5 (updated from 3), red catch -1, orange catch +1 segment + 1 life (capped), paddle width reflects current segment count\n- [ ] Verify: catching or missing each colour produces the correct score/life/segment change; paddle at 0 segments still catches items; orange catch grows the paddle up to 5 segments and adds a life (manual \u2014 needs a play test in Pico-8, re-verify after orange/paddle-cap spec change)\n\n## Phase 3: Combo system\n\n- [x] Last-3-caught ring buffer (any colour, including red/orange)\n- [x] Combo detection on 3-in-a-row match; buffer resets after a trigger\n- [x] Per-colour combo effects: blue +10, green +1 life (capped 5), orange resets lives to 5 + 1 paddle segment (capped 5, updated), red +25, grey +5\n- [x] Combo screen flash: fill with combo colour + \"COMBO\" text, 500ms, then resume\n- [ ] Verify: a streak triggers exactly once, the buffer resets correctly, and each colour's effect applies (and caps) correctly, including orange's new paddle-segment bonus (manual \u2014 needs a play test in Pico-8)\n\n## Phase 4: Difficulty ramp & win condition\n\n- [x] 90-second round timer (2700 frames at 30fps)\n- [x] Fall speed linear ramp: base speed at t=0 to 2\u00d7 base speed at t=2700\n- [x] Win check: timer reaches 2700 frames with lives > 0\n- [x] Loss check: lives reach 0 at any point, regardless of timer\n- [ ] Verify: round ends in a win at exactly 90s if the player is still alive; fall speed is visibly faster late in the round (manual \u2014 needs a play test in Pico-8)\n\n## Phase 5: Screens & flow\n\n- [x] Title screen: Intellivision-style colour-band frame, blocky \"3 FALLING\", blinking start prompt\n- [x] Game screen: playfield + paddle + HUD wired together (lives left, last-3-caught icons center, score right)\n- [x] End screen: shared layout, headline branches on win/loss, shows final score/caught/missed\n- [x] State machine: title \u2192 playing \u2192 end \u2192 title\n- [ ] Verify: full loop is playable start to finish; both win and loss paths are reachable (manual \u2014 needs a play test in Pico-8)\n\n## Phase 6: Visuals & sound polish\n\n- [x] Apply final colour palette to paddle, items, HUD, and combo flashes (already matched DESIGN.md's palette table from earlier phases; no changes needed)\n- [x] SFX: per-colour bing (C/D/F/G, red uses noise instead), combo chord, win ascending run, loss descending run\n- [x] HUD polish: confirm lives/last-3/score layout matches DESIGN.md at all paddle-segment widths (paddle row y=103-110 is separate from HUD row y=111-127, so paddle width changes don't affect HUD layout)\n- [ ] Verify: play a full round with sound on; confirm every listed SFX fires at its correct trigger (manual \u2014 needs a play test in Pico-8; sound content authored by ear-judgment, not auditioned, since I can't run Pico-8's audio myself \u2014 flag any note/tempo that sounds off)\n\n## Phase 7: Token & performance check\n\n- [ ] Confirm final token count is within the ~8,192 budget (heuristic estimate ~960 tokens, well under budget \u2014 authoritative number is only available from Pico-8's own status bar; manual confirmation needed)\n- [ ] Confirm 2-3 concurrent falling items plus paddle/HUD render without frame drops (draw calls are a handful of rectfill/rect/print per frame, no heavy computation \u2014 very likely fine, but needs a manual play-test to confirm actual FPS)\n", "claude": "# CLAUDE.md\n\nThis file provides guidance to Claude Code (claude.ai/code) when working with code in this repository.\n\n## Project\n\nA Pico-8 game called \"3 Falling\" \u2014 an action/puzzle item-catching game with Atari 2600 aesthetics, built for the \"Warped 2026 Game Jam 1\". The full spec is in [README.md](README.md), following [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md).\n\n**Status: built.** `3.p8` exists and implements all 7 phases of [PLAN.md](PLAN.md). The Architecture section below documents the as-built cart, read directly from `3.p8`; per [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md), it supersedes [DESIGN.md](DESIGN.md) as the source of truth for how the game actually works.\n\n## Development\n\nPico-8 has no build system, package manager, linter, or test runner. The workflow is:\n\n- Edit the `.p8` file in an external editor or inside Pico-8's built-in editor\n- Run with `pico8 -run 3.p8` (requires Pico-8 installed)\n- Or open Pico-8, then `load 3.p8` and press Ctrl+R to run\n\nVerification is manual: load the cart and play it.\n\n## Pico-8 Constraints\n\nThese constraints shape every implementation decision:\n\n- **Token limit**: ~8,192 tokens total; code is compressed and must be counted aggressively\n- **Display**: 128\u00d7128 pixels, 16-colour palette\n- **Sprites**: 8\u00d78 pixels each, 256 slots in the sprite sheet\n- **Map**: 128\u00d764 cells, shared memory with the bottom half of the sprite sheet\n- **Sound**: 64 SFX slots, 4 channels\n- **Lua variant**: Pico-8 Lua omits parts of the standard library; no `string.format`, use `tostr()`, `tonum()`, `sub()`, `#str`, `add()` for tables\n\n## Architecture\n\nThe game follows the standard Pico-8 callback structure in a single `3.p8` file:\n\n```lua\n_init()   -- called once on startup: set base speed/paddle speed, gs=0 (title)\n_update() -- called 30fps: title/end input, timer, paddle movement, item spawn/fall/catch, combo checks\n_draw()   -- called 30fps: dispatches to draw_title / draw_end / combo flash / gameplay draw\n```\n\n### Key systems\n\n**Item colour table** \u2014 `colc={6,12,8,9,11}` (grey, blue, red, orange, green Pico-8 colour indices), `colsc={1,2,-2,1,4}` (score deltas), `catch_sfx={0,1,4,2,3}`, `combo_sfx={5,6,7,8,9}`. Colour id `it.c` (1\u20135) indexes all four in parallel; this is the flat-array-by-colour-id approach DESIGN.md's Token budget section called for instead of per-colour branching.\n\n**Spawn/fall** \u2014 `rnd_col()` weighted roll (40/25/15/15/5) picks a colour; a new item is added to `itms` every 36 frames (`spawn_t`, 1.2s at 30fps) at `x=rnd(121), y=0`. Each item falls at the shared global `spd`, recomputed every frame.\n\n**Difficulty ramp** \u2014 `spd = base_spd + base_spd * (t/2700)`, `base_spd=1`, `t` the frame counter capped at 2700 (90s at 30fps). Win fires at `t>=2700` if the round hasn't already ended in a loss.\n\n**Catch/miss** \u2014 per item, a bounding-box check (`it.y+7>=py and it.y<=py+7` and `it.x` overlap with the paddle) determines a catch; falling past `py+7` uncaught is a miss (`lives-=1`, game over at 0). Caught items apply `colsc` to score, adjust `pseg` for red/orange, and feed the combo tracker.\n\n**Paddle** \u2014 `pseg` (0\u20135, starts 3) drives `paddle_w()`: `pseg*8` px, or a 4px sliver at 0. `pmid` (centre x) is clamped to `[pw/2, 128-pw/2]` and moves at `pspd=3` px/frame on left/right input; `px = pmid - pw/2` is recomputed every frame before drawing.\n\n**Combo tracking** \u2014 `last3` holds up to 3 recent catch colours (`deli` trims to a sliding window). When all 3 match, `trigger_combo(c)` applies the colour's score/lives/segment effect, sets `flash_t=15` (500ms) and `flash_c`, and clears `last3` so a fresh streak of 3 is required again.\n\n**Screen flash** \u2014 `flash_t>0` freezes gameplay (no spawn/fall/timer advance) and fills the screen with `flash_c` plus a \"combo\" text overlay in `_draw()`; used only for the combo trigger, not for individual catches (see Known deviations below).\n\n**HUD** \u2014 drawn every frame at y=113+ over the playfield: lives left, last-3-caught colour swatches centred, score right (floored at 0 via `max(0,score)`).\n\n**Title screen** \u2014 Uses the shared jam title card from [`../lib/title.lua`](../lib/title.lua) and [`../lib/screen.lua`](../lib/screen.lua) (`draw_title_card`, `blink`), pasted into this cart's `__lua__` section. `gs==0` calls `draw_title_card(\"3 FALLING\")` directly in `_draw()`; the old per-game `draw_title()` function is gone. `draw_end()`'s \"press any button\" prompt also now uses `blink(2)` instead of a hand-rolled counter.\n\n### Game states\n\n| `gs` | Name | Triggered by |\n| ---- | ---- | ------------ |\n| 0 | Title | Startup; any button from End |\n| 1 | Playing | `new_game()`, called on any button from Title |\n| 2 | End | Lives reach 0 (`won=false`), or `t` reaches 2700 (`won=true`) |\n\n### SFX slots\n\n| Slot | Event | Notes |\n| ---- | ----- | ----- |\n| 0 | Grey catch | Single note C (pitch 0x24), square-ish tone, speed 8 |\n| 1 | Blue catch | Single note D (0x26), speed 8 |\n| 2 | Orange catch | Single note F (0x29), speed 8 |\n| 3 | Green catch | Single note G (0x2b), speed 8 |\n| 4 | Red catch | Noise waveform, low pitch (0x14), fade-out effect, speed 6 \u2014 the \"pink-noise explosion\" |\n| 5 | Grey combo | C major triad (C-E-G), speed 3 |\n| 6 | Blue combo | D major triad (D-F#-A), speed 3 |\n| 7 | Red combo | E major triad (E-G#-B) \u2014 uses the E slot the single-catch scheme skips, since red isn't melodic solo | \n| 8 | Orange combo | F major triad (F-A-C), speed 3 |\n| 9 | Green combo | G major triad (G-B-D), speed 3 |\n| 10 | Loss | G-E-C, 3 descending notes, speed 12 |\n| 11 | Win | C-E-G, 3 ascending notes, speed 10 |\n\n### State variables\n\n```lua\n-- lookup tables, indexed by colour id 1-5 (grey, blue, red, orange, green)\ncolc, colsc, catch_sfx, combo_sfx\n\n-- screen\ngs        -- game state: 0=title 1=playing 2=end\nt         -- frame counter, 0-2700 (90s at 30fps)\n\n-- difficulty\nspd, base_spd, pspd  -- current/base fall speed, paddle move speed\n\n-- paddle\npx, py    -- paddle top-left; py fixed at 103\npw, pmid  -- current width (from pseg), centre x\npseg      -- segments: 0-5, starts 3\n\n-- items\nitms      -- array of {x, y, c}; c is colour id 1-5\nspawn_t   -- frames until next spawn, resets to 36\n\n-- resources\nlives     -- 0-5, starts 5; game over at 0\nscore     -- can go negative internally; displayed floored at 0\nwon       -- set true only when state 1 exits via t>=2700\n\n-- combo\nlast3     -- sliding window of up to 3 recent catch colours\n\n-- screen flash (combo only)\nflash_t, flash_c\n\n-- end-screen stats\ncaught_ct, missed_ct\n```\n\n### Known deviations from DESIGN.md\n\nTracked in [`../BUGS.md`](../BUGS.md#3--falling) (entries 3.1\u20133.3): no per-catch paddle flash, title/combo/end-screen text printed lowercase instead of the spec's quoted uppercase, and an ambiguous read of \"alternating stripes\" on the title frame.\n\n## Reusable code\n\nCheck [`../lib/CLAUDE.md`](../lib/CLAUDE.md) for shared Lua snippets (input handling, screen flash/fade, state machine, tweening, collision, HUD, map queries, seeded RNG) before writing new utility code from scratch. Snippets are copy-pasted into this cart's `__lua__` section, not imported \u2014 inline only what's needed given the shared token budget.\n"}}, {"num": "4", "title": "Gyri #4", "tagline": "arcade shooter", "hasCart": true, "cartRelPath": "downloads/4.p8", "embedPath": "exports/4/4.html", "embedStatus": "ok", "docs": {"readme": "# Gyri #4\n\nThis is an arcade shooter built using Claude and Pico-8. Follows the format in [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md).\n\nThe game looks like an Atari 2600 game. Colours, sprites, and fonts approximate the Atari 2600 aesthetic using Pico-8's palette. It's a Space Invaders/Galaga-style shooter with the player's straight firing line replaced by a curved one.\n\n**Status: Phase 7 of 8 implemented, plus several play-test follow-up passes** (real sprites, sound, and screens are in; only Phase 8's final token/performance check remains \u2014 see [CLAUDE.md](CLAUDE.md)). Design for all phases is locked; see [DESIGN.md](DESIGN.md) for exact numbers and [PLAN.md](PLAN.md) for the build order.\n\n## Game overview\n\nThe player's ship holds a fixed angular position on an arc near the bottom of the screen, rather than an x-coordinate. The arc's implied centre sits off-screen above the play area, so it opens upward like a U: the ship rests low in the middle and sweeps up toward the screen edges as it moves left or right.\n\nFiring is hold-to-fire: holding the button repeats shots at a fast, steady rate. Each shot travels inward along the radius line running from the ship's current position toward the implied centre, so a shot's direction depends on where the ship is on the arc when it fires. A shot from the left end angles up and to the left; from the middle, it fires straight up.\n\nEnemies occupy three concentric arcs above the ship, in a full Galaga-scale formation (18 enemies on wave 1). They sweep back and forth along their arcs, periodically fire radial shots back at the ship along the same kind of trajectory the player uses, and occasionally break formation to dive at the ship. On later waves, a few enemies peel off and dive before the formation has even finished forming, so the pressure ramps up from the very start of the entrance. A wave clears once every enemy on it is destroyed. Two fixed boss planets flank the top of the screen throughout every wave, each taking 10 hits on wave 1 (+5 per wave after) to destroy in a burst of particles; shooting one is worth bonus points per hit but is entirely optional and has no bearing on clearing the wave, and a destroyed planet returns at full health next wave. The run is endless: there's no final wave, only an escalating one, and it ends when the player runs out of lives.\n\n## Scenes\n\n| Scene | Shows | Enters from | Exits to |\n| ----- | ----- | ------------ | -------- |\n| Title | Shared jam title card: colour-swatch strip, \"'26 WARPED GAME JAM\", \"GYRI #4\", blinking start prompt | Startup | Any button \u2192 Game |\n| Game | Arc playfield (ship and enemies on concentric arcs), scanline grid, HUD | Title, or wave transition complete | All enemies on the current wave destroyed \u2192 Wave transition; lives reach 0 \u2192 End |\n| Wave transition | Ship zooms to the shared centre, where a yellow glow pulses behind it, then to a fixed top point, trailing a line that turns white; each step pauses briefly with a rising tone. Screen irises to white, \"NEW WAVE n\" holds in the new wave's colour, then irises back to reveal the next wave already loaded | All enemies on the current wave destroyed | 5-stage sequence complete \u2192 Game, next wave loaded |\n| End | Final score, wave reached | Game, on lives reaching 0 | Any button \u2192 Title |\n\n## Core mechanic: arc movement & radial shooting\n\n- The ship's position is an angle along a fixed-radius arc, not an x-coordinate; left/right input changes that angle, clamped to \u00b169\u00b0 from the arc's centre point (a ~21\u00b0 trim off the true \u00b190\u00b0 endpoints, so the ship's 8\u00d78 sprite stays fully on-screen; derivation in DESIGN.md).\n- The ship's arc is a 180\u00b0 half-circle, radius 64px, centred at (64, 55): the ship's centred resting position is at (64, 119), just above the HUD, the lowest point of the valley, and the untrimmed endpoints reach exactly (0, 55) and (128, 55), the screen's left and right edges.\n- Holding fire releases shots at a fixed cooldown, each travelling along the radius line through the ship's angle at the moment it was fired, continuing inward (toward the centre, i.e. up) until off-screen or it hits an enemy.\n- Enemies live on three concentric arcs at smaller radii than the ship's own (40px, 30px, 20px); a smaller radius sits closer to the shared centre and therefore higher on screen, since that centre sits above the ship (full derivation in DESIGN.md). Each arc's angular sweep is a band, not the full semicircle, for a formation look.\n- Enemies sweep back and forth along their arc, periodically fire radial shots toward the ship, and occasionally break formation to dive; frequency of both increases with wave number (see Progression).\n- On later waves, a few enemies dive during the entrance itself, before settling into formation: 1 on wave 1, ramping to 5 by wave 5, staggered a few seconds apart. Same dive mechanic as a formation dive, just triggered early.\n- A diving enemy that misses doesn't die or leave the wave: it reappears at the top of its arc and attacks again, faster and more often each time it misses. A wave only ever clears by killing every enemy on it.\n\n## Player\n\n- Moves left/right along the arc; movement is angular, not linear, clamped to \u00b169\u00b0.\n- Hold-to-fire: shots repeat automatically while held, 4 frames apart, travelling at 4px/frame along the radial trajectory.\n- Resources: 5 starting lives, score.\n- Fixed colours (white 7, red 8 trim) mark the ship regardless of wave; every other on-screen colour re-tints per wave (see DESIGN.md Palette), so the ship stays the one constant visual anchor.\n\n## Game over conditions\n\n- Player lives reach 0.\n\nThere's no win condition. The run is endless; difficulty escalates wave over wave until the player dies (see Progression).\n\n## Sound\n\n| Trigger | Character |\n| ------- | --------- |\n| Ship fire | Short, punchy blip, the one sound that breaks from the game's atmospheric palette |\n| Enemy destroyed | Atmospheric, sustained tone |\n| Player hit | Atmospheric, sustained tone, lower/harsher than enemy destroyed |\n| Enemy dive start | Atmospheric, sustained rising tone |\n| Wave clear | Atmospheric, sustained ascending chord |\n| Game over | Atmospheric, sustained descending tone |\n| Planet bonus | Bright, quick ascending chime, a bonus rather than a kill |\n| Wave-transition pause | Three short ascending tones, one per pause in the transition sequence, building to a rising phrase |\n\n## Tile / sprite visuals\n\n| Element | Colour | Description |\n| ------- | ------ | ------------ |\n| Ship | White (7) with red (8) trim, fixed, never re-tints | Rocket-wedge silhouette, native 8\u00d78, one of 3 sprites (straight + 2 lean levels) picked by angle so the ship visibly rotates, nose always pointing toward the shared centre |\n| Enemy | Wave theme colour, primary and accent, both rotate (see DESIGN.md Palette) | Five-shape roster, one per tier: Crab (inner), Moth (middle), Wyrm (outer), and Stinger for any enemy that's currently diving, regardless of tier. Drawn via `sspr` at a continuous size driven by distance from the shared centre (small far away, growing as it approaches \u2014 outer tier ends up largest, a \"worth more\" cue) |\n| Ship shot | White (7) | One of 3 shared shot sprites (straight/shallow/steep), picked and mirrored by travel angle, pointing inward/up, drawn at half size (4\u00d74) |\n| Enemy shot | Matches that wave's enemy colour | Same 3 shared shot sprites, `flip_y`'d to point outward/down, also drawn at half size |\n| Background grid | Dark blue (1), fixed, never re-tints | Line pairs converging on the shared centre, denser near the middle, sparser toward either screen edge (see DESIGN.md) |\n| Boss planets | Yellow/red, fixed, never re-tint (the Saucer alien, see DESIGN.md's Sprite rendering) | Two fixed targets flanking the top of the screen; take 10 hits on wave 1 (+5/wave) to destroy in a particle burst, worth a score bonus per hit, optional and non-gating (see DESIGN.md's Boss planets note) |\n\n## Progression\n\nWave-to-wave escalation (exact formulas in DESIGN.md's Core system design): enemy count, enemy speed, and enemy aggression (dive frequency and fire rate) all increase with wave number. Enemy count is capped at 24 (leaving headroom under the 32-entity concurrent cap for enemy shots); once the count cap is hit, speed and aggression carry the rest of the difficulty curve.\n", "design": "# Gyri #4 \u2014 Design\n\nTechnical design derived from the spec in [README.md](README.md), following [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md). Pre-implementation. Once `4.p8` exists, the as-built version of this becomes the Architecture section of [CLAUDE.md](CLAUDE.md).\n\n## Screen layout (128\u00d7128)\n\nTitle: the shared jam title card, drawn by `draw_title_card(\"GYRI #4\")` from [`../lib/title.lua`](../lib/title.lua). No per-game layout to design here; games 1-3 already use the same card.\n\nGame:\n\n```\ny=0\n  |  open sky; two entry-point sprites (\"planets\", see Sprite\n  |  rendering's Enemy roster note) sit near here at (32,12) and\n  |  (96,12), where enemies enter and split left/right\n  |  (see Core system design's Enemy entrance note); shootable for\n  |  a bonus all wave (see Core system design's Boss planets note). A third,\n  |  undrawn point at (64,12) \u2014 directly between the two planets,\n  |  the original single entry point before the entrance split \u2014\n  |  is the destination of the wave-transition zoom (see Core\n  |  system design's Wave transition sequence note)\ny=12    entry points / the wave-transition zoom's target point\n  |  background grid: dark-blue line pairs converging on the\n  |  shared centre below, sparsest here near the top (see Core\n  |  system design's Background grid note)\ny=55    ship's arc centre; also the height of its untrimmed\n  |     endpoints (x=0 and x=128), where the arc meets the\n  |     screen edges (the whole reason this is a valley, see\n  |     Core system design's Arc geometry note). Drawn as a\n  |     small dot with faint spoke lines fanning out to the\n  |     ship's arc edge; enemies spiral out from this point on\n  |     spawn (see Enemy arcs' Enemy entrance note) instead of\n  |     appearing pre-placed\ny=78    ship's position at full \u00b169\u00b0 trim (near the screen edges)\n  |  ship's arc: 180\u00b0 half-circle, radius 64, centred (64, 55),\n  |  opening upward (a valley, not a dome): the ship sweeps up\n  |  toward the screen edges rather than down away from them\n  |  enemy arcs: three concentric bands between the centre and\n  |  the ship, topmost reach (outer band edge) y\u224872, ranging to\n  |  y\u224895 (inner tier's centred position) \u2014 exact per-tier\n  |  values in Core system design\ny=119   ship's centred/rest position (the valley floor), sitting\n  |     just above the HUD\ny=120   HUD line (8px): lives left, score centre, wave right\ny=127\n```\n\nWave transition: no layout sketch needed (per SPEC-FORMAT's rule to skip sketches for scenes with no fixed spatial layout of their own); it's a timed sequence rather than a static screen \u2014 see Core system design's Wave transition sequence note for the full staging.\n\n## Palette\n\nBase colour pool reuses game 1's Atari-2600 approximation ([`../1/CLAUDE.md`](../1/CLAUDE.md)): black(0), white(7), red(8), orange(9), yellow(10), green(11), dark green(3), teal(12), sky blue(6), dark blue(5), purple(2), dark red(13).\n\n| Element | Colour | Index |\n| ------- | ------ | ----- |\n| Ship (fixed, never re-tints) | White | 7 |\n| Ship shot | White | 7 |\n| Enemy / enemy shot | Wave theme primary + accent, rotates | varies, see below |\n| Crab's trim (fixed, never re-tints) | White | 7 |\n| Background grid, radial spoke lines, vanishing-point dot | Dark blue (fixed, never re-tints) | 1 |\n| Entry-point sprite (\"planet\", the Saucer alien) | Yellow + red, fixed (never re-tints) | 10 / 8 |\n| HUD text | White | 7 |\n\nWave theme rotates on a 4-wave cycle, indexed by `(wave-1) % 4`, and carries two colours per wave, a primary (majority of each alien's shape) and an accent (the detail band), rather than the single colour used before the enemy roster grew from one shape to five (see Sprite rendering's Enemy roster note):\n\n| `(wave-1) % 4` | Primary | Accent |\n| -------------- | ------- | ------ |\n| 0 | Red (8) | Dark red (13) |\n| 1 | Green (11) | Dark green (3) |\n| 2 | Teal (12) | Sky blue (6) |\n| 3 | Purple (2) | Dark blue (5) |\n\nEach pair is a hue and its darker or cooler tonal neighbour from the same locked pool rather than two unrelated hues, so every wave still reads as one colour family the way the single-colour version did. An earlier version of this table rotated the background grid through a similar \"hi\"/\"mid\" tone pair per wave (Orange/Dark red, Dark green/Dark green, Sky blue/Dark blue, Dark red/Dark blue); that was dropped when the background grid reverted to the fixed dark-blue radiating version (see Core system design's Background grid note) \u2014 a play-test note preferred that grid's original, unchanging look, so wave identity was carried by the enemy/shot colour alone for a while. The accent slot revives the same two-tone idea, now applied to the enemy roster instead, since a single shape only needed one swappable colour but five distinct aliens read better with the same two-tone richness as the reference art they're modelled on.\n\nBackground fill (`cls()`) is always black (0).\n\n## State machine\n\n| `gs` | Name | Entered from | Exits to |\n| ---- | ---- | ------------- | -------- |\n| 0 | Title | startup | 1 (any button) |\n| 1 | Game | title; wave transition complete | 2 (all enemies on wave destroyed); 3 (lives reach 0) |\n| 2 | Wave transition | wave cleared | 1 (5-stage zoom/fade sequence complete, next wave already loaded underneath) |\n| 3 | End | lives reach 0 | 0 (any button) |\n\n## Core system design\n\n**Arc geometry** \u2014 All arcs (ship and enemy) are concentric circles
