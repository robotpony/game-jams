or a clean silhouette rather than derived mechanically, standing in for \"partway rotated\"), and 6 (an exact 90\u00b0 rotation of sprite 0, computed by index permutation \u2014 `new[i][j]=old[7-j][i]` \u2014 which is pixel-perfect with no interpolation, unlike a nearest-neighbour trig rotation at the same angle, which was also tried and also produced holes/disconnected chunks at 8\u00d78). Sprite 7 is retired (patched blank, slot unused); `shipspr()` reverted to 2 thresholds (23\u00b0/46\u00b0, thirds of \u00b169\u00b0) and 3 sprites, giving 5 rotation states \u2014 fewer than the previous 7, but all of them clean. The top bucket showing a full 90\u00b0 rather than the true ~69\u00b0 is a deliberate stylization the play-test note asked for directly.\n- Enemy formation radii (`ER`) shrank from `{53,43,33}` to `{40,30,20}` \u2014 a play-test note said the settled formation sat \"too low\" and should be \"closer to the centre dot.\" The 10px gap between tiers and the angular bands (`EB`) are unchanged, so the formation keeps its shape and just shifts about 13px toward `(64,55)`. The enemy `sspr` size formula (`ds`, Enemy entrance note) is retuned to match \u2014 its leading constant dropped from `60` to `50`, keeping the same `10` divisor and `[1,3]` clamp, since the old constants had been calibrated to the old, larger radii and would otherwise clamp the middle and outer tiers to the same maximum size, losing the \"outer tier reads bigger\" cue.\n- The Planet bonus (previous follow-up) is now spelled out explicitly as non-gating in DESIGN.md's Scoring section: the wave-clear check (`#en==0`) never looks at planets, so hitting them any number of times neither advances nor blocks a wave \u2014 requested explicitly (\"treat them as extra points, but they do not gate the level end\"); no code change, since this was already the actual behaviour, just not stated in so many words.\n\nToken count after this follow-up: 2,212 (`p8tool stats`), down slightly from 2,223 (net effect of removing a sprite/threshold offsetting the other additions).\n\n**Follow-up (rotation angle corrected to the true fire-line angle)**: a follow-up note walked back the \"completely rotated 90 degrees\" request from the previous round \u2014 \"I was wrong about 90%, it's the angle of the line it aligns with, can you determine it's angle from the code?\" The true angle is derivable directly from the existing `SC` constant: `SC=0.19167` turns `\u00d7 360\u00b0 = 69.0\u00b0`, and since `arc_xy`'s own parametrization makes `sang` (in turns) literally the geometric angle of any point/direction on the arc from vertical, the ship's fire-line angle at maximum deflection is exactly `sang`'s clamp, `69\u00b0` \u2014 the same \u00b169\u00b0 trim already derived in DESIGN.md's Ship movement & trim section, not a separate figure. Sprite 6 (the \"sharp\" rotation) is redrawn to represent 69\u00b0, not 90\u00b0.\n\nBoth sprite 6 and the \"35\u00b0\" sprite 5 (this bucket's rough midpoint, replacing the earlier ad hoc \"45\u00b0\" placeholder) were regenerated with a better rotation technique after the exact-90\u00b0-via-index-permutation and plain nearest-neighbour-at-69\u00b0 approaches both proved unusable: index permutation only produces clean results at exact 90\u00b0 multiples, and plain nearest-neighbour trig rotation at 35\u00b0/69\u00b0 reintroduced the same kind of single-pixel holes and disconnected fragments seen in the original row-shift attempt. The fix was supersampled rotation: upscale sprite 0 8\u00d7 (64\u00d764), rotate that upscaled grid by nearest-neighbour, then downsample each 8\u00d78 block back to a single pixel by majority vote (filled if \u226550% of samples in the block are filled) \u2014 this anti-aliases away the holes a direct 8\u00d78 rotation leaves. One remaining single-pixel hole in each of the two supersampled results was hand-patched afterward (filled solid) since majority-vote rounding still left one right at the 50% boundary in each case.\n\nNo code change (thresholds `SL1`/`SL2` at 23\u00b0/46\u00b0 are unchanged; only the sprite art at slots 5/6 was replaced). Token count unaffected: still 2,212 (`p8tool stats`), since `__gfx__` data isn't part of the Lua token count.\n\n**Follow-up (bullet rotation direction fixed)**: player shots had the same class of sign inversion the ship's rotation did \u2014 a play-test note caught it (\"the bullets rotate in the inverse direction... it would look better rotated in the direction of movement\"). the `flip_x` value stored on a player shot at spawn was `sang<0`; since sprites 3/4's un-mirrored art leans right and player shots travel *inward* (`arc_xy(0,0,-1,sang)`), the correct condition is `sang>0` (identical reasoning to the ship's own nose-direction fix: `sang>0` puts the shot's travel direction to the left, requiring the mirror). Fixed to `add(shots,{...,fx=sang>0})`. Enemy shots (`fx=e.ea<0`, travelling *outward*, `arc_xy(0,0,1,ea)`) needed no change \u2014 verified independently via the same geometric reasoning (outward travel continues in the same left/right sense the enemy is already offset in, rather than reversing it like inward travel does), and confirmed correct as-is. One-line fix, no token change.\n\n**Follow-up (planets became bosses)**: the flat, indestructible planet-bonus target (previous follow-up) gained hit points \u2014 \"let's turn the planets into bosses, or BOSS PLANETS, they take 10 hits (increases by 5 per level) to explode, using a particle effect.\" `spawn_wave()` now builds `pl={{x=LX,hp=php},{x=RX,hp=php}}` each wave, `php=10+5*(wv-1)`; the old flat-bonus collision check became a per-planet loop gated on `hp>0`, decrementing on every hit and branching at `hp<=0` into a distinctly bigger particle burst (14 particles, up to 3px/frame, 15-30 frame life, vs a normal hit's 5/1.5px/10-15 frames) plus the enemy-destroyed chime (`sfx(1)`) instead of the ordinary hit chime (`sfx(6)`). A destroyed planet stops drawing and stops registering hits for the rest of that wave, then comes back at full health next wave since `spawn_wave()` re-arms both unconditionally regardless of last wave's outcome. Per-hit score (200) is unchanged and applies to every hit including the kill, so a fully-destroyed planet is worth `200 * hp` for that wave \u2014 not rebalanced beyond what was asked, though it's a large score contributor (2,000+ points per planet on wave 1) worth flagging if it turns out to dominate scoring once played. See DESIGN.md's Boss planets note (renamed from Planet bonus) for the full spec.\n\n**Follow-up (transition pauses + first-pause glow)**: \"add a delay between each step except the last, with a building sound... for the first pause, is it possible to add a glow around the back of the ship?\" A `pz` counter (0 when idle) now gates the front of `gs==2`'s `_update()` branch: while `pz>0` it just counts down and returns, freezing `ws`/`frz`/the trail exactly where they were; when it hits 0 the stage-advance logic that used to run immediately on `frz<=0` now runs instead. A `PZ=12`-frame pause is inserted after stages 1, 2, and 3 (the gap into stage 4), each playing one of three new ascending `__sfx__` slots (7/8/9, `sfx(6+ws)`) so the three pauses read as one rising phrase; the stage 4\u21925 gap has no pause, since stage 4's own 30-frame hold already serves that purpose. During the first pause only (`ws==1 and pz>0`, ship parked at the shared centre dot), a pulsating yellow `circfill` (`3+2*sin(time()*4)` radius) draws behind the ship sprite as a glow. Token count after this follow-up: 2,914 (`p8tool stats`), up from 2,851.\n\n## Phase 8: Final token & performance check\n\n- [ ] Confirm final token count is within the ~8,192 budget (second checkpoint, now including Phase 6/7's screens, sprites, and SFX on top of Phase 5's core-systems count)\n- [ ] Confirm a full wave at the entity cap (32 hostile entities plus ~8 player shots) renders without frame drops, given the extra per-frame trig from angle-based movement and the per-frame grid redraw\n\n## Future ideas (not scheduled)\n\nNot part of any numbered phase; captured here so they aren't lost, not committed to a phase or a token budget yet.\n\n- **Squad-diverse entrance patterns**: partially done. A Phase 7 play-test follow-up split phase 1 into two entry points (left/right, half the wave each by spawn-order parity) instead of one shared point \u2014 see Phase 7's follow-up note. Still open: both groups share the same radius (`D1R`) and speed (`CSPD`), and the split is purely spatial (left/right), not by tier or any other grouping; a future pass could still vary radius/speed/shape per group, or tie group identity to tier, wave, or a visual tag, if two symmetric streams end up feeling too uniform once played more.\n", "claude": "# CLAUDE.md\n\nThis file provides guidance to Claude Code (claude.ai/code) when working with code in this repository.\n\n## Project\n\nA Pico-8 game called \"Gyri #4\" \u2014 an arcade shooter with Atari 2600 aesthetics, Space Invaders/Galaga-style but with the player's and enemies' straight lines replaced by concentric arcs. The full spec is in [README.md](README.md), following [`../SPEC-FORMAT.md`](../SPEC-FORMAT.md).\n\n**Status: Phase 7 of 8 implemented, plus a play-test follow-up pass.** `4.p8` covers PLAN.md's Phase 1 (ship arc movement, hold-to-fire shooting), Phase 2 (three enemy arcs with a two-phase formation entrance, player-shot/enemy collision), Phase 3 (enemy fire, dive, miss-respawn, player-hit collision, entity cap), Phase 4 (wave clear/respawn, per-wave difficulty scaling, score tracking), Phase 5 (token checkpoint), Phase 6 (title/wave-transition/end screens, real HUD), and Phase 7 (real sprites, wave-theme palette rotation, explosion particles, background grid, and 6 SFX slots), replacing every placeholder visual (filled circles, single pixels) from Phases 1-4. A subsequent play-test pass (documented in PLAN.md's Phase 7 follow-up) reverted the background grid to its original radiating style, added ship-rotation sprites, halved shot sprite size, restored continuous distance-based enemy sizing, and split the enemy entrance's single entry point into two. None of the six gameplay/flow/polish phases' manual play-test verify steps have been run yet.\n\n**Wave-transition sequence implemented**: `4.p8`'s original static 36-frame freeze is replaced by the 5-stage sequence DESIGN.md's Wave transition sequence note describes (ship zooms to the shared centre then a fixed top point `(TX,TY)=(64,12)`, trailing a colour-ramping line; screen irises to white; \"NEW WAVE n\" holds; iris reveals the next wave) \u2014 see PLAN.md's Phase 6 \"Redesign implemented\" note for the implementation shape (`gs==2` gained a `ws` sub-stage counter and `zoompos()`; `_draw()` was split into `draw_backdrop()`/`draw_trail()`/`draw_game()` so ordinary play and the transition's final reveal stage share one renderer).\n\n**Phase 5 (token checkpoint)**: measured with `p8tool stats 4.p8` (the [picotool](https://github.com/dansanderson/picotool) project, installed into a scratch virtualenv for this check since Pico-8's own GUI console is the only other source of an authoritative count and doesn't run headlessly on this machine) at **1,415 tokens** against the ~4,000 soft ceiling PLAN.md set for core systems, about a third of it. No simplification pass was needed; Phases 1-4's logic is untouched. This leaves roughly 6,777 tokens of the ~8,192 total budget for Phase 6's screens/HUD and Phase 7's sprites/SFX. The arc's orientation was corrected after Phase 1 was first built (it had been a downward-opening dome instead of an upward-opening valley \u2014 see DESIGN.md's Arc geometry note), and `4.p8`'s constants and shot direction were updated to match. After that fix, the arc's vertical placement was still off: with the shared centre at `(64,25)`, the ship's resting position landed at `y=89`, which read as vertically centred on-screen with a large unused gap down to the HUD. The shared centre moved to `(64,55)` so the ship's resting position sits at `y=119`, just above the HUD line, with every enemy-arc and grid-adjacent y-value in DESIGN.md's Screen layout sketch and Core system design table shifted by the same +30px (radii, angles, and trim math are all unaffected, since they don't depend on `cy`); a placeholder HUD line (`line(0,120,127,120,7)`) was also added to `4.p8` so this reads correctly during play-testing ahead of Phase 6's real HUD. PLAN.md's Phase 1 checklist still holds, but treat it as re-verify-needed rather than already-confirmed.\n\nPhase 2 adds a flat `en` array (one table per enemy: `tr` tier 1-3, `ea` angle, `dir` \u00b11 sweep direction, `r` current radius, `x`/`y` cached screen position), populated at `_init()` from `ER`/`EB`/`EN` (per-tier radius/band/starting-count lookup tables) with enemies evenly spaced from `-B` to `+B` within each tier's band. Each enemy sweeps independently, `ea += ESPD*dir`, reversing `dir` at its own tier's `\u00b1B` bound; since all enemies in a tier share speed but start at different offsets, they reach their bounds at different frames, giving a staggered rather than lockstep sweep (no per-tier shared state, matching DESIGN.md's \"sweep back and forth\" without over-specifying synchronization it didn't require). Enemy screen position is recomputed once per frame via `arc_xy()` and cached on the enemy table so the same values serve both drawing and collision without recomputing trig twice. Collision is a reverse double loop over `shots`/`en` with an `abs(dx)<3 and abs(dy)<3` box check; both arrays support safe same-frame deletion because the loops walk from `#array` down to 1. Enemy fire, dive behaviour, and lives (Phase 3) aren't implemented yet, so enemies currently can't hurt the ship.\n\n**First-play-test follow-up**: enemies originally spawned pre-placed on their bands (y=84-108), which read as using only the lower half of the screen with the top left empty. The fix wasn't to move the shared centre `(64,55)` up \u2014 that's blocked, since the ship's rest position is `cy+64` (64 is fixed so the ship's semicircle exactly spans the screen edge-to-edge) and raising `cy` would just reopen the \"big unused gap above the HUD\" problem the centre's previous move from `(64,25)` already fixed once. Instead each enemy spawned at `r=0` (the shared centre) and grew toward its tier's radius (`RGR=1` px/frame) while sweeping, so it visibly spiralled out into formation; the centre point itself was drawn as a small dot (`circfill`, colour 6) with five faint spoke lines (colour 1) fanning out to the edge of the ship's own arc, pulling forward a bit of Phase 7's visual polish so the point enemies emerge from reads as deliberate rather than empty.\n\n**Second-play-test follow-up**: extended to a full two-phase entrance driven by a single global frame counter `ET` (reset in `_init()`, incremented once per frame in `_update()`). Each enemy now: (1) orbits a second, independent fixed point `(D1X,D1Y)=(64,12)` near the top of the screen at a small radius (`D1R=10`) for `ND1` frames, all sharing one angular speed (`CSPD`) but starting at a different phase offset (`ca`, spread evenly by spawn order via a running `idx/tot` fraction) so they don't stack; (2) over the next `ND2` frames, blends from that orbit position toward the shared centre by linear interpolation on progress through the phase, and because the orbit formula keeps evaluating throughout (not frozen at the phase-1 exit point) this reads as a decaying spiral rather than a straight glide; (3) past `ET>=ND1+ND2`, falls through to the original grow-into-formation behaviour unchanged. The two fixed points are both drawn (shared centre: dot + spokes as before; entry point: a plain dot, colour 10). A placeholder animated background grid (12 horizontal lines, spacing interpolating 24px\u21928px over the same `ET` timeline) was added alongside, standing in for Phase 7's real fixed-row grid until the two get reconciled. See DESIGN.md's Enemy entrance and Background during entrance notes, and PLAN.md's Phase 2 follow-ups, for the full reasoning.\n\n**Third pacing/visual pass**: `ND1`/`ND2` doubled from 180 to 360 frames each and `CSPD` doubled from 0.005 to 0.01, so phase 1 now shows roughly 3.6 revolutions around the entry point instead of under 1, and the whole entrance runs ~25.8s instead of ~13.8s. Enemy rendering shrank from a 2px `circfill` to a single-pixel `pset` (colour 8 unchanged; the `abs(dx)<3 and abs(dy)<3` collision hitbox is independent of the draw call, so hit detection didn't change). The animated background grid switched from colour 9 (orange) to colour 1 (dark blue), matching the radial spoke lines so both line systems read as one visual element.\n\n**Fourth pass**: enemy size is no longer fixed \u2014 `_draw()` now computes `dist` (each enemy's live distance from the shared centre `(64,55)`, via `sqrt`) every frame regardless of entrance phase, and draws a `circfill` at `mid(1,(60-dist)/10,3)`. This makes enemies read small while far away (near the entry point) and grow through the phase-2 spiral as they approach, and as a side effect reproduces Phase 7's planned \"outer tier reads bigger\" sprite rule for free once settled (the outer tier, `r=33`, sits closest to the shared centre and so computes the largest `sz`; the inner tier, `r=53`, the smallest). The 3px collision box is a separate, fixed constant in the shot/enemy collision check, untouched by this. `ESPD` (formation sweep angular speed) halved, `0.00139`\u2192`0.0007`; since `ea` only drives visible position once an enemy has fully arrived (`ET>=ND1+ND2` and `r` at its tier target \u2014 phases 1-2 use the orbit/spiral position formulas instead), this slows only the settled formation sweep, matching a play-test note asking for slower movement specifically \"once in the radial area.\" The radial spoke lines' `arc_xy` call switched from `SR` (64, the ship's own arc radius) to a literal 200, well past any on-screen distance, so Pico-8's line-clipping \u2014 not a deliberately computed length \u2014 is what stops them exactly at the screen edge. The background grid's `ET`-driven squeeze animation was removed entirely and replaced with a static loop (`GD0=4` starting offset, `GGR=1.6` per-step growth, `GN=6` line pairs) drawing lines at `CY\u00b1d` for a geometrically growing `d`, so line density is fixed in place from frame 1, densest near the shared centre and sparser toward the screen edges \u2014 a play-test note flagged the animated version's motion as unexplained rather than a legible distance cue.\n\nPhase 3 adds enemy attack state to the same `en` table: `dv` (0/1 diving flag), `dvx`/`dvy` (dive velocity, set once at dive start), `dvsg` (\u00b11, which band edge to respawn at on a miss, captured from `sign(ea)` when the dive begins), `mc` (miss count, capped at 7), and `fc` (fire cooldown, seeded with `rnd(90)` at spawn so enemies don't volley in lockstep). The enemy loop in `_update()` now branches on `e.dv` first: a diving enemy just moves in a straight line and checks for a ship hit or going off-screen (both routes converge on the same respawn-at-band-edge code, differing only in whether `mc` increments); a non-diving enemy runs the existing entrance/formation-sweep logic and, once `e.r>=ER[e.tr]` (fully arrived), independently rolls for fire and dive each frame using wave-scaled formulas (`wfc`, `dch`, computed once per frame from a `wv` variable currently fixed at 1, ready for Phase 4 to update). Ship position (`shx,shy`) moved to a single `arc_xy()` call at the top of `_update()`, reused by the player's own shot spawn, dive targeting, and both hit-collision checks rather than recomputed per site. New `eshots` array mirrors `shots`' structure and update pattern (reverse-loop movement, off-screen removal, `del()`-safe). A `lv` (lives, starts 5) variable is decremented on either hit type and floored at 0; there's no game-over handling yet; that's Phase 4. A placeholder `lv N` readout (top-left, `print()`) stands in for Phase 6's real HUD.\n\nPhase 4 adds wave progression on top of the `wv` variable Phase 3 already fed formulas from. The old fixed `EN={7,6,5}` table and its dedicated spawn loop in `_init()` are gone, replaced by a `spawn_wave()` function that computes each wave's total (`min(24, 18+2*(wv-1))`) and splits it across the three tiers by scaling the wave-1 7:6:5 ratio, so the inner-heaviest formation silhouette holds at every wave size instead of skewing as the count grows; `_init()` now just resets state and calls it once. Formation sweep speed is wave-scaled at the top of `_update()` (`local espd=ESPD*(1+0.08*(wv-1))`), replacing the bare `ESPD` constant in the sweep line; `base_espd` here is the already-tuned `0.0007` (the fourth-pass value from Phase 2's follow-up), not DESIGN.md's original literal `0.5\u00b0/frame`, so wave 1's speed matches what's already been played. A wave clear (`#en==0`) sets a 36-frame freeze counter `frz`; while `frz>0`, `_update()` decrements it and returns immediately, skipping ship movement, shot movement, and all enemy logic so the playfield reads as frozen (standing in for Phase 6's \"WAVE n\" overlay, which isn't built yet); when the freeze ends, `wv` increments and the next wave replays the *full* two-phase entrance from `spawn_wave()` rather than spawning straight into formation. Losing all 5 lives sets an `over` flag that makes `_update()` return at its very first line, freezing the game permanently since there's no Phase 6 End screen to transition to yet; `over` is checked ahead of `frz`, so a simultaneous lives-out and wave-clear resolves as game over. Score (`sc`, starts 0) is added at the shot/enemy collision site, the one place both the killed enemy's tier and its current diving state are already in scope (`sc+=50*e.tr+(e.dv==1 and 50 or 0)`). The placeholder HUD line grew to `lv N sc N w N` to make all three verifiable without Phase 6's real HUD.\n\nPhase 6 replaces the placeholder `over`/`frz`-return flow from Phases 3-4 with a real `gs` state variable matching DESIGN.md's state table exactly (0 title, 1 game, 2 wave transition, 3 end); `_update()` branches on `gs` at the top instead of checking `over==1`/`frz>0` as separate early returns, and the `frz` wave-transition countdown is unchanged in mechanics, just now paired with a `gs` change instead of an in-place return. `newgame()` holds the full state reset (ship angle, shots, enemies, `ET`, lives, wave, score, then `spawn_wave()`) that used to live in `_init()`; `_init()` now just sets `gs=0`, and both the title screen and (eventually) a restart path call `newgame()`. `any_btnp()` (loop over `btnp(0..5)`), `blink()` (`lib/screen.lua`), and `draw_title_card()` (`lib/title.lua`) are pasted in wholesale rather than hand-rolled, following the same pattern game 3 already uses for its own title/end screens. The wave-transition overlay reads `\"wave \"..(wv+1)`, the upcoming wave rather than the one just cleared, since `wv` itself doesn't increment until the freeze ends; because the freeze only triggers once `#en==0`, the \"frozen playfield\" behind the overlay is in practice just the background grid, ship, and any still-in-flight shots (which also stop moving during the freeze, since `_update()` returns early for `gs==2`), not a snapshot with enemies still visible. The real HUD replaces the placeholder `lv N sc N w N` line with three separately-positioned strings at y=121 (lives left-aligned, score centred using `title.lua`'s `64-#s*2` centring convention, wave right-aligned), keeping the placeholder `line(0,120,127,120,7)` as a visual separator. Token count after Phase 6: 1,714 (`p8tool stats`), up from Phase 5's 1,415 checkpoint.\n\nPhase 7 replaces every remaining placeholder visual with real assets. Sprites 0-4 (ship, enemy, and the three shot directions) are authored as 8\u00d78 hex-grid text files under [`../tools/sprites/defs/`](../tools/sprites/defs/) (`g4_ship.txt`, `g4_enemy.txt`, `g4_shot_straight.txt`, `g4_shot_shallow.txt`, `g4_shot_steep.txt`) and patched into `4.p8`'s `__gfx__` section with `tools/sprites/sprite_tool.py patch`, the same tool games 1 and 3 use; each was rendered to a combined preview PNG and checked before patching, since the tool runs headlessly without needing Pico-8 itself. Colour rotation is done via `pal()` swaps rather than duplicate sprite art: the enemy sprite is drawn in the sheet using the wave-1 theme's red(8), shot sprites in white(7), and `pal(8,ecol)`/`pal(7,ecol)` remap those at draw time to the current wave's theme colour (`WT`, a 4-row `{enemy/shot colour, grid-hi, grid-mid}` table indexed by `(wv-1)%4+1`), each swap immediately reset with a bare `pal()` so it doesn't bleed into the next draw call. This also retires the Phase 2 continuous distance-based enemy-scaling placeholder in favour of DESIGN.md's actual final rule (fixed native size for inner/middle tiers, `sspr` at 10\u00d710 for the outer tier) \u2014 DESIGN.md's Enemy entrance note had already flagged that placeholder as temporary, so real sprites now render at final size through all three entrance phases, not just once settled. Each shot's sprite index and `flip_x` are computed once at spawn (`shsp(th)`, a shared threshold lookup at 12\u00b0/37\u00b0 for both player and enemy shots) and stored on the shot table, since a shot's fired angle is fixed after spawn; `flip_y` is passed as a literal per shot type at the draw call instead. A new `pt` array holds short-lived explosion particles (same `del()`-safe reverse-loop pattern as the other entity arrays), 5 spawned per kill with random outward velocity and a 10-15 frame countdown, drawn in the wave's theme colour; cleared alongside `en`/`eshots` on both a fresh game and a wave transition. The Phase 2 placeholder background grid (`GD0`/`GGR`/`GN`, a static gradient centred on the shared centre) is replaced by DESIGN.md's real 8-fixed-row scanline grid (`GY={127,119,109,97,83,67,49,30}`, rows 1-3 in the wave's `ghi` colour, 4-5 in `gmid`, 6-8 always black) \u2014 the reconciliation DESIGN.md's Background during entrance note had flagged as pending; the Phase 4 placeholder white HUD separator line is removed since the grid's own row at y=119 now serves that role. 6 `__sfx__` slots (0 fire, 1 enemy destroyed, 2 player hit, 3 enemy dive start, 4 wave clear, 5 game over) were hand-authored via a one-off Python script rather than typed by hand, since `tools/sfx/` has no notation utility yet (see `../tools/TASKS.md`); `sfx(n)` calls were added at each event's existing state-change site. Token count after Phase 7: 2,001 (`p8tool stats`), up from Phase 6's 1,714.\n\n**Follow-up (play-test pass)**: five changes on top of the initial Phase 7 build, all draw-only or entrance-only (no collision/scoring/state-machine logic touched). The 8-fixed-row scanline grid described above is gone; the background grid reverted to the Phase 2 radiating version (`GD0`/`GGR`/`GN`, `GN` now 7, fixed dark blue, no wave rotation) per a play-test note that preferred the original (\"we lost the gridlines into the distance, they looked good\"); `WT` correspondingly collapsed from a `{enemy,grid-hi,grid-mid}` table to a flat per-wave colour array, and the Phase 6 white HUD separator line (`line(0,120,127,120,7)`) came back since the flat grid's row that had been standing in for it is gone. The enemy-scaling placeholder this same paragraph describes as retired is back too, in a different form: `_draw()` now feeds the Phase 2 continuous distance-from-centre formula into an `sspr` destination size for the single enemy sprite (`ds=mid(1,(60-dist)/10,3)*3`) rather than picking between a native `spr()` and a fixed 10\u00d710 `sspr()` by tier \u2014 a play-test note asked for enemies to visibly start smaller and grow as they approach, which the fixed-tier version didn't show during phases 1-2 of the entrance. Two new ship sprites (5 \"lean slight\", 6 \"lean sharp\", alongside the existing 0 \"straight\") were added and patched the same way as Phase 7's other sprites; `shipspr(sang)` picks one by two angle thresholds (23\u00b0/46\u00b0 across the ship's \u00b169\u00b0 range) and mirrors via `flip_x=sang<0`, so the ship visibly rotates while sweeping instead of translating as a fixed silhouette. Shots now draw at `sspr(...,4,4,...)`, a 4\u00d74 destination instead of native 8\u00d78, after a play-test note found them reading too large; the 3px hitbox is unaffected. The enemy entrance's phase 1 (orbit the entry point) now uses two entry points instead of one \u2014 `LX,RX=32,96` replace the single `D1X=64` \u2014 with each enemy assigned to one by `idx%2` at spawn (stored as `e.dex,e.dey`, read by both the phase-1 orbit formula and phase-2's spiral-to-centre blend in place of the old global `D1X,D1Y`), splitting the wave exactly in half by spawn order; a play-test note asked for the entrance to visibly fork left/right before merging into the shared centre and continuing down into formation, rather than reading as one ring around a single point. Token count after this follow-up: 2,095 (`p8tool stats`), up from Phase 7's 2,001.\n\n**Follow-up (rotation direction fix)**: the ship-rotation flip condition above shipped inverted (`flip_x = sang < 0`), pointing the nose away from the shared centre instead of toward it at both ends of the sweep. Corrected to `flip_x = sang > 0`; DESIGN.md's Sprite rendering section now carries the geometric derivation (it falls straight out of the already-established \"increasing `sang` moves the ship right\" input mapping \u2014 no need to reason about `arc_xy`'s internal trig signs). Draw call only, no logic or token change.\n\n**Follow-up (rotation precision + planet bonus)**: a 4th ship sprite (7, \"lean 3\") was added alongside 0/5/6, and `shipspr()` switched from 2 thresholds (thirds) to 3 (even quarters of the \u00b169\u00b0 range), giving 7 rotation states instead of 5 \u2014 a play-test note found the 3-sprite version imprecise. The new sprite's rows are both shifted and narrowed (an 8px row can only shift so far before clipping), reading as a compressed, near-horizontal silhouette at maximum deflection rather than a mild tilt. Separately, the two entry-point dots (\"planets\") are now shootable: a new collision check after the shot/enemy loop awards a flat 200-point bonus, plays a new `sfx(6)` chime, and spawns the existing particle effect in yellow (10) via a new optional `c` field on particle tables (`pset(p.x,p.y,p.c or ecol)` at draw time, defaulting to the wave's enemy colour when unset) \u2014 added after a play-test note asked for the planets to be hittable. Planets are never removed on hit, unlike enemies, since `spawn_wave()` depends on them existing every wave. Token count after these two follow-ups: 2,223 (`p8tool stats`), up from 2,095.\n\n**Follow-up (rotation art fix + formation moved closer to centre)**: a play-test screenshot showed the row-shifted sprite 7 rendering as a jagged, disconnected staircase rather than a rotated ship, with a note asking for a full \"completely rotated 90 degrees\" look at maximum deflection. Row-shifting turned out to be the wrong technique past a couple of pixels of skew on an 8-wide sprite; replaced with 3 sprites (0 straight, unchanged; 5 a hand-drawn solid triangle for \"partway\"; 6 an exact 90\u00b0 rotation of sprite 0 via index permutation, `new[i][j]=old[7-j][i]`, pixel-perfect with no interpolation artifacts, unlike a nearest-neighbour trig rotation at the same angle, also tried, also broken). Sprite 7 is retired (patched blank); `shipspr()` reverted to 2 thresholds/3 sprites (23\u00b0/46\u00b0, thirds of \u00b169\u00b0), 5 rotation states instead of 7 but all clean; the extreme bucket showing a full 90\u00b0 rather than the true ~69\u00b0 is a deliberate stylization, not an approximation error. Separately, enemy formation radii (`ER`) shrank `{53,43,33}`\u2192`{40,30,20}` after a play-test note said the settled formation sat \"too low\" and should be \"closer to the centre dot\"; tier gaps and angular bands are unchanged (the formation just shifts ~13px toward `(64,55)`), and the enemy `sspr` size formula's leading constant dropped `60`\u2192`50` to match (same `10` divisor, same `[1,3]` clamp), since the old constant would otherwise clamp the middle and outer tiers to the same max size at the new radii. Finally, DESIGN.md's Scoring section now states explicitly that planet hits never affect the wave-clear check (`#en==0`, planets are never in `en`) \u2014 requested directly (\"treat them as extra points, but they do not gate the level end\"); no code change, since this was already true. Token count: 2,212 (`p8tool stats`), down slightly from 2,223.\n\n**Follow-up (rotation angle corrected to the true fire-line angle)**: the \"completely rotated 90 degrees\" request above turned out to be the user's own mistaken guess, walked back with \"it's the angle of the line it aligns with, can you determine it's angle from the code?\" The angle is already in the code: `SC=0.19167` turns `\u00d7 360\u00b0 = 69.0\u00b0`, and since `arc_xy`'s parametrization makes `sang` itself the geometric angle of any arc point/direction from vertical, that's exactly the ship's fire-line angle at maximum deflection \u2014 the same \u00b169\u00b0 trim DESIGN.md's Ship movement & trim section already derives, not a separate number. Sprite 6 is redrawn to represent 69\u00b0, not 90\u00b0; sprite 5 (this bucket's ~35\u00b0 midpoint) replaces the earlier ad hoc 45\u00b0 placeholder too. Both were generated by supersampled rotation (upscale sprite 0 8\u00d7, rotate by nearest-neighbour, downsample each 8\u00d78 block back to one pixel by majority vote) after both index-permutation (clean only at exact 90\u00b0 multiples) and plain nearest-neighbour trig rotation at 35\u00b0/69\u00b0 (produced the same kind of holes/disconnected fragments as the original row-shift attempt) proved unusable; one remaining single-pixel hole in each result was hand-patched solid. No code change (`SL1`/`SL2` thresholds unchanged), no token change (`__gfx__` isn't token-counted).\n\n**Follow-up (bullet rotation direction fixed)**: player shots had the same sign inversion the ship's rotation did, caught by a play-test note (\"the bullets rotate in the inverse direction... it would look better rotated in the direction of movement\"). The `flip_x` value stored on a player shot at spawn was `sang<0`; since sprites 3/4's un-mirrored art leans right and player shots travel *inward* (`arc_xy(0,0,-1,sang)`), the correct condition \u2014 by the identical reasoning already used for the ship's own nose fix \u2014 is `sang>0`. Fixed. Enemy shots (`fx=e.ea<0`, travelling *outward*) were checked independently via the same geometric method and confirmed already correct, no change needed there. One-line fix, no token change.\n\n**Follow-up (planets became bosses)**: the flat, indestructible planet-bonus target gained hit points \u2014 \"let's turn the planets into bosses... they take 10 hits (increases by 5 per level) to explode, using a particle effect.\" `spawn_wave()` builds `pl={{x=LX,hp=php},{x=RX,hp=php}}` each wave (`php=10+5*(wv-1)`); the collision check became a per-planet loop gated on `hp>0`, branching at `hp<=0` into a bigger particle burst and the enemy-destroyed chime (`sfx(1)`) instead of the ordinary hit chime (`sfx(6)`). A destroyed planet stops drawing/registering hits for the rest of the wave and comes back full-health next wave via the same `spawn_wave()` re-arm. See DESIGN.md's Boss planets note (renamed from Planet bonus) and PLAN.md's Phase 7 follow-up for the full detail. Token count after both this and the wave-transition implementation above: 2,851 (`p8tool stats`), up from 2,212.\n\n**Follow-up (transition pauses + first-pause glow)**: \"add a delay between each step except the last, with a building sound... for the first pause, is it possible to add a glow around the back of the ship?\" A `pz` pause counter now gates the front of `gs==2`'s `_update()` branch (freezes `ws`/`frz`/the trail while counting down, then runs the stage-advance logic on hitting 0); `PZ=12` frames after stages 1/2/3, none after stage 4 (already a 30-frame hold). Each pause plays one of three new ascending `sfx` slots (7/8/9, `sfx(6+ws)`) so the three pauses read as a rising phrase. Only the first pause (ship parked at the shared centre dot) draws a pulsating yellow `circfill` glow behind the ship (`3+2*sin(time()*4)` radius). See DESIGN.md's Wave transition sequence note and PLAN.md's Phase 7 follow-up. Token count: 2,914 (`p8tool stats`), up from 2,851.\n\n**Follow-up (five-alien roster + two-tone ship)**: a play-test discussion around a physical reference (photographed 3D-printed sprite pins from a classic shmup) asked for two things neither Phase 7 nor its follow-ups had covered: alien *shape* variety (until now, every enemy on every tier shared one generic wing silhouette, only its colour rotating per wave) and a multi-tone player ship (until now, flat white). Both were mocked up as standalone HTML/canvas concept sheets and approved before any code changed, per DESIGN.md's Palette and Sprite rendering sections (see those for the full rationale; this paragraph covers only what the code does).\n\nFive new 8\u00d78 sprites replace the single generic enemy: Crab (slot 1, the old generic-enemy slot, now the inner tier), Moth (7, middle tier), Wyrm (8, outer tier), Stinger (9, shown whenever an enemy is diving regardless of tier), and Saucer (10, the two entry-point \"planets\", drawn via `spr(10,...)` in place of the old `circfill(...,10)` dot). `ESP={1,7,8}` maps `e.tr` to a sprite slot; the enemy draw loop picks `sp=e.dv==1 and 9 or ESP[e.tr]` each frame and feeds it into the existing `sspr(sp*8,0,8,8,...)` call, so the already-tuned distance-based `ds` sizing formula is untouched, just applied to whichever alien is currently on screen. All five share one `pal(8,ecol) pal(12,acol)` swap (two source colours, red and teal, instead of the old single red), so recolouring five shapes per wave costs exactly one more `pal()` call than recolouring one did; `WT` (the existing per-wave colour array) is joined by a new `WA` array of the same shape (`{13,3,6,5}`, a \"dark red/dark green/sky blue/dark blue\" tonal partner for each of `WT`'s four hues) rather than restructuring `WT` into nested pairs, so both stay flat `(wv-1)%4+1`-indexed lookups. Saucer's yellow/red pixels are literal, not remapped \u2014 it's drawn before `pal(8,ecol)` is ever set for the frame, same as it always was as a plain `circfill`.\n\nThe ship sprites (0, 5, 6) keep their exact silhouettes; only which of their white pixels turned red changed. The rule was mechanical, not hand-placed per sprite: any occupied run of 1-2 pixels in a row (the nose, the leg/wingtips) goes solid red, and any run of 3+ gets red at both ends with white in between \u2014 the same rule applied identically to the straight, ~35\u00b0, and \u00b169\u00b0 sprites without redesigning it per rotation. Both colours are baked into the sheet as literal pixels, same as before Phase 7 established \"ship stays fixed white, never re-tints\"; red just joined white as a second fixed, never-swapped tone, on the same footing as the enemy roster's one deliberate exception (Crab's fixed-white trim stripe, added in the same pass, callback intentional). No `pal()` touches ship art at any point in `_draw()`, so wave theme changes can't bleed into it.\n\nAll 8 sprites were authored as hex-grid text files in [`../tools/sprites/defs/`](../tools/sprites/defs/) (`g4_ship.txt`, `g4_ship_lean1.txt`, `g4_ship_lean2.txt` rewritten in place; `g4_alien_crab.txt`, `g4_alien_moth.txt`, `g4_alien_wyrm.txt`, `g4_alien_stinger.txt`, `g4_alien_saucer.txt` new, replacing the retired `g4_enemy.txt`), rendered together to one combined preview PNG via `sprite_tool.py sheet` and checked before patching, same process as Phase 7. Token count: 2,266 (`p8tool stats`), up from 2,212.\n\n**Follow-up (background grid fades toward the top)**: a play-test note asked for the background grid's upper lines (the ones climbing from the shared centre toward the entry points) to fade out rather than stay flat dark blue all the way up. Pico-8's palette has no tone between dark blue (1) and black (0), so a true colour fade isn't available; a new `dline(y,pat)` helper (next to `arc_xy` in the lib block) draws a dashed line instead of a solid one, walking a run-length table (`pat`) that alternates lit/unlit segments in px, always starting lit. Three tables \u2014 `GP1={3,2,3,2,1,2}` (dash-dash-dot), `GP2={3,2,1,2}` (dash-dot), `GP3={1,2,1,2}` (dot-dot) \u2014 are ~54%, 50%, and 33% lit respectively, so cycling through them as the grid loop's `i` increases (1-3 \u2192 `GP1`, 4-5 \u2192 `GP2`, 6-7 \u2192 `GP3`) is a genuine decreasing-density progression, not three arbitrary patterns. Only the upper line (`CY-d`) uses `dline`; the lower line (`CY+d`, toward the ship) is untouched, still a plain solid `line()` call \u2014 the fade is one-directional, matching the play-test note's \"toward the top,\" and starts at the very first line pair past the centre rather than being held off for a few solid lines first. Token count: 2,372 (`p8tool stats`), up from 2,266.\n\n**Follow-up (early-attack divers)**: requested directly (\"a ramping-up variation that starts slow... ship(s) diving down from the group before they migrate, to start the attack\"), clarified across two rounds of questions before implementation: divers break off mid-phase-1 (before phase 2's migration to the shared centre), diver count ramps `min(5, wv)` (1 on wave 1, +1/wave, capped at 5), triggers are staggered at fixed frames across roughly the first half of phase 1 rather than rolled randomly, and the dive mechanic itself is fully reused from the existing formation-dive system rather than built separately. `spawn_wave()` now picks that many random enemies from the wave's roster and stamps each with a trigger frame (`e.dt=20+40*(i-1)`, so a 5-diver wave's last trigger lands at frame 180 of `ND1=360`, still inside phase 1). The formation dive-trigger and dive-resolve logic, previously inlined at the fire/dive roll site and at both hit/miss sites in the main enemy loop, was pulled into two shared functions (`start_dive(e,shx,shy,ed)`, `end_dive(e)`) so an early dive and a formation dive share one implementation; the only branch between them is a new `ed` (entrance-dive) flag read only at resolution time: a formation dive still snaps the enemy to its band edge on hit or miss (it already has a settled tier position to return to), while an entrance dive has none yet, so it just clears its dive flag and falls back into whatever entrance phase the shared `ET` counter is in by then \u2014 deliberately a \"resume the shared timeline\" resolution rather than a dedicated return-to-entry-point animation. No draw or collision code changed: an entrance diver already renders as the Stinger sprite and is already shootable through the existing `e.dv==1` draw/collision paths, both keyed off the dive flag rather than which system triggered it. Token count after this follow-up: 2,989 (`p8tool stats`), up from 2,372.\n\nDesign for all 8 phases is locked, see README.md and [DESIGN.md](DESIGN.md) for exact numbers; DESIGN.md remains the source of truth until more phases land and this file grows a full Architecture section the way [`../3/CLAUDE.md`](../3/CLAUDE.md) documents game 3.\n\n## Development\n\nPico-8 has no build system, package manager, linter, or test runner. The workflow is:\n\n- Edit the `.p8` file in an external editor or inside Pico-8's built-in editor\n- Run with `pico8 -run 4.p8` (requires Pico-8 installed)\n- Or open Pico-8, then `load 4.p8` and press Ctrl+R to run\n\nVerification is manual: load the cart and play it.\n\n## Pico-8 Constraints\n\nThese constraints shape every implementation decision:\n\n- **Token limit**: ~8,192 tokens total; code is compressed and must be counted aggressively\n- **Display**: 128\u00d7128 pixels, 16-colour palette\n- **Sprites**: 8\u00d78 pixels each, 256 slots in the sprite sheet\n- **Map**: 128\u00d764 cells, shared memory with the bottom half of the sprite sheet\n- **Sound**: 64 SFX slots, 4 channels\n- **Lua variant**: Pico-8 Lua omits parts of the standard library; no `string.format`, use `tostr()`, `tonum()`, `sub()`, `#str`, `add()` for tables\n\n## Design summary (from README.md and DESIGN.md)\n\n- Ship holds an angular position on a fixed-radius arc near the bottom of the screen instead of an x-coordinate; left/right input sweeps that angle, clamped to \u00b169\u00b0\n- Hold-to-fire: shots repeat every 4 frames while held, along the radius line through the ship's current angle, so shot direction changes with the ship's position on the arc\n- Enemies live on three concentric arcs at *smaller* radii than the ship's own (40/30/20px vs the ship's 64px) \u2014 the shared centre sits above the ship, so a smaller radius is what puts an arc higher on screen, not a larger one\n- Enemies fire back radially *outward* (away from the shared centre, hence down toward the ship, the opposite direction from the player's own inward shots) on a wave-scaled cooldown, and occasionally dive at the ship; a total enemy+enemy-shot cap of 32 bounds concurrent entities\n- A diving enemy that misses never leaves the wave: it respawns at the outer edge of its arc's angular band (its highest reachable point, not its centred position) and comes back faster and more aggressive (a per-enemy miss counter, capped after ~7 misses). A wave clears only by killing every enemy on it, never by attrition\n- Ship and shot sprites are distinct pixel art; shots share 3 sprites (straight/shallow/steep) mirrored via `flip_x`/`flip_y` to cover every reachable travel direction. Enemies are a five-alien roster (Crab/Moth/Wyrm/Stinger/Saucer, one shape per tier plus a dive-only look and the two entry-point \"planets\") rather than one shape recoloured; outer-tier enemies still render larger via the same `sspr` scaling, now applied to whichever alien is currently shown\n- A wave clears when every enemy on it is destroyed; the run is endless, with enemy count, speed, and aggression all scaling with wave number (formulas in DESIGN.md)\n- Ship colour is fixed (white + red trim) and never re-tints; the enemy roster's colours rotate through a 4-wave theme cycle (a primary and an accent tone per wave), defined in DESIGN.md's Palette section; the background grid stays fixed dark blue and does not rotate\n- All values are decided; DESIGN.md is the source of truth for exact numbers, don't re-derive or re-guess them during implementation\n\n## Reusable code\n\nCheck [`../lib/CLAUDE.md`](../lib/CLAUDE.md) for shared Lua snippets (input handling, screen flash/fade, state machine, tweening, collision, HUD, map queries, seeded RNG) before writing new utility code from scratch. Snippets are copy-pasted into this cart's `__lua__` section, not imported \u2014 inline only what's needed given the shared token budget.\n"}}, {"num": "5", "title": "Game 5 to the top", "tagline": "A platform game where the player has to ascend from the bottom to the top using the ramps and special objects. The ramps randomly have ladders, chutes, stairs, and boxes, for ascending. The game theme is wild west themed, so items drop from the top, and roll down the ramps until they reach the bottom and disappear offscreen. These items cause damage to the user, so the user needs to jump or ascend to avoid them. There are gaps in the ramps that the user needs to jump over, that the items fall through. When the player gets to the top platform, there is a button the player walks into that starts a new randomized level.", "hasCart": false, "cartRelPath": null, "embedPath": null, "embedStatus": "no cart", "docs": {"readme": "# Game 5 to the top\n\nA platform game where the player has to ascend from the bottom to the top using the ramps and special objects. The ramps randomly have ladders, chutes, stairs, and boxes, for ascending. The game theme is wild west themed, so items drop from the top, and roll down the ramps until they reach the bottom and disappear offscreen. These items cause damage to the user, so the user needs to jump or ascend to avoid them. There are gaps in the ramps that the user needs to jump over, that the items fall through. When the player gets to the top platform, there is a button the player walks into that starts a new randomized level.\n\n\n", "design": null, "plan": null, "claude": null}}]}</script>
<script src="theme/warped.js" defer></script>
<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const GAMES = DATA.games;
const FACES = ['play', 'download', 'about'];
const FACE_LABELS = {play: 'Play', download: 'Download', about: 'About'};

let gameIndex = 0;
let faceIndex = 0;
let busy = false;

function md(text){
  if(!text) return '';
  return window.marked ? window.marked.parse(text) : '<pre>' + text.replace(/</g,'&lt;') + '</pre>';
}

function defaultFaceIndex(game){
  return game.embedPath ? FACES.indexOf('play') : FACES.indexOf('about');
}

function playFaceHtml(game){
  if(game.embedPath){
    return `<iframe src="${game.embedPath}" loading="lazy" allow="autoplay"></iframe>`;
  }
  const hint = game.hasCart
    ? 'Cart exists, but no playable web export yet. Capture a label for this cart in Pico-8, then rerun generate.py.'
    : "Design is in progress — see the About tab.";
  return `<div class="placeholder"><strong>(GAME NOT READY)</strong>${hint}</div>`;
}

function downloadFaceHtml(game){
  if(!game.hasCart){
    return `<div class="placeholder">No cart yet.</div>`;
  }
  return `<div><a href="${game.cartRelPath}" download>Download ${game.num}.p8</a>
    <p>Load locally: <code>pico8 -run ${game.num}/${game.num}.p8</code></p></div>`;
}

function aboutFaceHtml(game){
  const sections = [
    ['SPEC', game.docs.readme],
    ['DESIGN', game.docs.design],
    ['PLAN', game.docs.plan],
    ['GUIDANCE', game.docs.claude],
  ].filter(([, text]) => text);
  if(!sections.length) return '<div class="placeholder">No docs yet.</div>';
  return sections.map(([label, text]) =>
    `<p class="doc-label">${label}</p>${md(text)}`).join('<hr>');
}

function faceHtml(game, face){
  if(face === 'play') return playFaceHtml(game);
  if(face === 'download') return downloadFaceHtml(game);
  return aboutFaceHtml(game);
}

function faceClass(face){
  return face === 'play' ? 'face-play' : (face === 'download' ? 'face-download' : 'face-about');
}

function render(){
  const game = GAMES[gameIndex];
  const face = FACES[faceIndex];
  const screen = document.getElementById('console-screen');
  screen.className = faceClass(face);
  screen.innerHTML = faceHtml(game, face);

  const upLabel = FACE_LABELS[FACES[(faceIndex - 1 + FACES.length) % FACES.length]];
  const downLabel = FACE_LABELS[FACES[(faceIndex + 1) % FACES.length]];
  document.getElementById('prev-face').textContent = '▲ ' + upLabel;
  document.getElementById('next-face').textContent = '▼ ' + downLabel;

  const indicator = document.getElementById('console-indicator');
  const title = game.title || `Game ${game.num}`;
  indicator.innerHTML = `<span class="title">${title}</span>` +
    (game.tagline ? `<span class="tagline">${game.tagline}</span>` : '');
}

function flip(axis, dir, updateFn){
  if(busy || GAMES.length === 0) return;
  busy = true;
  const cube = document.getElementById('console');
  const exitDeg = dir > 0 ? -90 : 90;
  const enterDeg = dir > 0 ? 90 : -90;
  const prop = axis === 'y' ? 'rotateY' : 'rotateX';

  // Pivot from the leading edge, not the box's own center: a center pivot on
  // a shallow box shrinks symmetrically toward the middle and reads as a
  // fade, not a turn. Hinging on the edge you're heading toward gives an
  // asymmetric swing (one edge anchored, the other sweeps) that reads
  // unambiguously as rotation.
  const origin = axis === 'y'
    ? (dir > 0 ? 'right center' : 'left center')
    : (dir > 0 ? 'center bottom' : 'center top');
  cube.style.transformOrigin = origin;

  cube.style.transition = 'transform .5s ease';
  cube.style.transform = `${prop}(${exitDeg}deg)`;

  const onExit = (e) => {
    if(e.propertyName !== 'transform') return;
    cube.removeEventListener('transitionend', onExit);
    updateFn();
    render();
    cube.style.transition = 'none';
    cube.style.transform = `${prop}(${enterDeg}deg)`;
    void cube.offsetWidth;
    cube.style.transition = 'transform .5s ease';
    cube.style.transform = 'none';
    setTimeout(() => { busy = false; }, 520);
  };
  cube.addEventListener('transitionend', onExit);
}

function nextGame(){
  flip('y', 1, () => { gameIndex = (gameIndex + 1) % GAMES.length; faceIndex = defaultFaceIndex(GAMES[gameIndex]); });
}
function prevGame(){
  flip('y', -1, () => { gameIndex = (gameIndex - 1 + GAMES.length) % GAMES.length; faceIndex = defaultFaceIndex(GAMES[gameIndex]); });
}
function nextFace(){ flip('x', 1, () => { faceIndex = (faceIndex + 1) % FACES.length; }); }
function prevFace(){ flip('x', -1, () => { faceIndex = (faceIndex - 1 + FACES.length) % FACES.length; }); }

document.addEventListener('DOMContentLoaded', () => {
  if(GAMES.length === 0){
    document.getElementById('console-indicator').textContent = 'No games in this repo yet.';
    return;
  }
  faceIndex = defaultFaceIndex(GAMES[gameIndex]);
  render();
  document.getElementById('next-game').addEventListener('click', nextGame);
  document.getElementById('prev-game').addEventListener('click', prevGame);
  document.getElementById('next-face').addEventListener('click', nextFace);
  document.getElementById('prev-face').addEventListener('click', prevFace);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') nextGame();
    else if(e.key === 'ArrowLeft') prevGame();
    else if(e.key === 'ArrowDown') nextFace();
    else if(e.key === 'ArrowUp') prevFace();
  });

  let touchStartX = null, touchStartY = null, touchOnScreen = false;
  const stage = document.querySelector('.console-stage');
  stage.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchOnScreen = !!e.target.closest('#console-screen');
  }, {passive: true});
  stage.addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
      dx < 0 ? nextGame() : prevGame();
    } else if(Math.abs(dy) > 40 && !touchOnScreen){
      // A vertical drag that started on the screen content (the About/
      // Download face) is a scroll attempt, not a face-nav swipe — only
      // treat drags starting on the frame/bezel as face navigation.
      dy < 0 ? nextFace() : prevFace();
    }
    touchStartX = null; touchStartY = null;
  }, {passive: true});

  const toggle = document.getElementById('theme-toggle');
  toggle.addEventListener('click', () => {
    if(document.body.classList.contains('dark')){
      document.body.classList.remove('dark');
      localStorage.setItem('pref-theme', 'light');
    } else {
      document.body.classList.add('dark');
      localStorage.setItem('pref-theme', 'dark');
    }
  });

  const topLink = document.getElementById('top-link');
  window.addEventListener('scroll', () => {
    const show = document.body.scrollTop > 400 || document.documentElement.scrollTop > 400;
    topLink.style.visibility = show ? 'visible' : 'hidden';
    topLink.style.opacity = show ? '1' : '0';
  });
});
</script>
